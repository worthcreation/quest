<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest</title>
<style>
  :root { --ink: #fdf6e3; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: "Courier New", monospace; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #sound { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: rgba(0,0,0,.35); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: .9rem; }
  #pad { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; opacity: .85; }
  #pad button, .abtn { background: rgba(0,0,0,.38); color: var(--ink); border: 0; touch-action: none; font: inherit; }
  #pad button { font-size: 1.3rem; border-radius: 8px; }
  #pad button:active, .abtn:active { background: rgba(0,0,0,.65); }
  .abtn { position: fixed; border-radius: 50%; font-weight: bold; opacity: .85; }
  #act  { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; font-size: 1.5rem; }
  #dash { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #eat  { right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  .hidden { display: none; }
  @media (pointer: fine) and (min-width: 900px) { #pad, .abtn { display: none !important; } }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #3f8f4c; font-size: 1.4rem; letter-spacing: 2px; cursor: pointer; text-align: center; padding: 20px; }
  #start small { font-size: .9rem; letter-spacing: 1px; opacity: .85; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="sound">sound: on</button>
<div id="pad">
  <span></span><button data-dir="up">&#9650;</button><span></span>
  <button data-dir="left">&#9664;</button><span></span><button data-dir="right">&#9654;</button>
  <span></span><button data-dir="down">&#9660;</button><span></span>
</div>
<button id="act" class="abtn">A</button>
<button id="dash" class="abtn hidden">dash</button>
<button id="eat" class="abtn hidden">eat</button>
<div id="start"><div>tap to begin</div><small id="startHint"></small></div>
<script>
'use strict';
// =====================================================================
// Screen
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
const K = TOUCH
  ? { act: 'A', dash: 'dash', eat: 'eat', l: '\u25C0', r: '\u25B6', u: '\u25B2' }
  : { act: 'F', dash: 'D', eat: 'S', l: '\u2190', r: '\u2192', u: '\u2191' };
document.getElementById('startHint').textContent = TOUCH ? 'd-pad to move, A to act' : 'arrow keys to move, F to act';
let W = window.innerWidth, H = window.innerHeight, UNIT = 32, DPR = window.devicePixelRatio || 1;
const computeUnit = () => { UNIT = Math.max(20, Math.min(W, H) / 14); };
computeUnit();
const L = () => Math.max(W, H);

// =====================================================================
// Random (seeded per adventure so each new game has a new layout)
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;
const rr = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp01 = v => Math.max(0.04, Math.min(0.96, v));

// =====================================================================
// World generation
// =====================================================================
const AREA_NAMES = { forest: 'The Glade', field: 'The Windswept Field', cave: 'The Dank Cave', marsh: 'The Marsh' };
const OPP = { n: 's', s: 'n', e: 'w', w: 'e' };

function edgePoint(side, along) {
  if (side === 'n') return [along, 0.03];
  if (side === 's') return [along, 0.97];
  if (side === 'w') return [0.03, along];
  return [0.97, along];
}
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function makePath(a, b, bends) {
  const pts = [a];
  for (let i = 1; i <= bends; i++) {
    const t = i / (bends + 1);
    pts.push([clamp01(a[0] + (b[0] - a[0]) * t + rr(-0.22, 0.22)), clamp01(a[1] + (b[1] - a[1]) * t + rr(-0.2, 0.2))]);
  }
  pts.push(b);
  return pts;
}
function clearSpot(sc, fx, fy, rU, pathW, keep) {
  const x = fx * W, y = fy * H, r = rU * UNIT;
  for (const p of sc.paths) for (let i = 0; i < p.length - 1; i++)
    if (distSeg(x, y, p[i][0] * W, p[i][1] * H, p[i + 1][0] * W, p[i + 1][1] * H) < pathW * UNIT + r) return false;
  for (const k of keep) if (Math.hypot(x - k[0] * W, y - k[1] * H) < k[2] * UNIT + r) return false;
  for (const s of sc.solids) if (Math.hypot(x - s.fx * W, y - s.fy * H) < (s.r + rU) * UNIT * 0.85) return false;
  return true;
}
function scatter(sc, n, kind, rMin, rMax, pathW, keep = [], box = [0.06, 0.94, 0.08, 0.92]) {
  let placed = 0;
  for (let tries = 0; tries < n * 60 && placed < n; tries++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]), r = rr(rMin, rMax);
    if (clearSpot(sc, fx, fy, r, pathW, keep)) { sc.solids.push({ fx, fy, r, kind }); placed++; }
  }
}
function edgeWall(sc, side, kind, rU, gaps, density = 1.6) {
  const horiz = side === 'n' || side === 's', len = horiz ? W : H;
  const step = rU * UNIT * density, n = Math.ceil(len / step) + 1;
  for (let i = 0; i < n; i++) {
    const along = (i * step + rr(-0.15, 0.15) * step) / len;
    if (along < -0.02 || along > 1.02) continue;
    const margin = rU * UNIT * 1.2 / len;
    if (gaps.some(([a, b]) => along > a - margin && along < b + margin)) continue;
    const inset = rU * UNIT * 0.45, r = rU * rr(0.85, 1.2);
    const [fx, fy] = side === 'n' ? [along, inset / H] : side === 's' ? [along, 1 - inset / H]
      : side === 'w' ? [inset / W, along] : [1 - inset / W, along];
    sc.solids.push({ fx, fy, r, kind });
  }
}
function gapAt(c, half = 0.09) { return [Math.max(0.1, c - half), Math.min(0.9, c + half)]; }
function freeSpot(sc, box, rU, keep = []) {
  for (let i = 0; i < 200; i++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]);
    if (sc.solids.every(s => Math.hypot(fx * W - s.fx * W, fy * H - s.fy * H) > (s.r + rU) * UNIT) &&
        keep.every(k => Math.hypot(fx * W - k[0] * W, fy * H - k[1] * H) > k[2] * UNIT)) return [fx, fy];
  }
  return [rr(box[0], box[1]), rr(box[2], box[3])];
}

function newScene(o) {
  return Object.assign({ solids: [], deco: [], spawns: [], pullables: [], exits: [], pools: [], paths: [], feat: {}, speed: 0.5, accel: 10 }, o);
}

function buildWorld() {
  rng = mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
  const S = {};
  const add = sc => (S[sc.id] = sc);

  // ---------------- Forest: glade hub, meadow (west), grove (north) ----------------
  const start = add(newScene({ id: 'start', area: 'forest', msg: 'Reach the blue stone', music: 'forest', amb: 'none', floor: '#3f8f4c', heroStart: [0.3, 0.62] }));
  start.exits = [
    { side: 'n', a: 0.4, b: 0.6, to: 'grove' },
    { side: 'w', a: 0.38, b: 0.62, to: 'meadow' },
    { side: 's', a: 0.42, b: 0.58, to: 'f1' },
  ];
  start.feat.stone = [0.9, 0.5];
  const turnip = [rr(0.34, 0.44), rr(0.3, 0.38)];
  start.pullables.push({ id: 'turnip', kind: 'turnip', fx: turnip[0], fy: turnip[1], need: 4 });
  start.paths = [[0.5, 0.03], [0.03, 0.5], [0.5, 0.97], [0.9, 0.5], turnip, start.heroStart].map(p => makePath([0.5, 0.5], p, 1));
  scatter(start, 11, 'tree', 0.9, 1.3, 1.5, [[...turnip, 2], [0.9, 0.5, 2.5]]);
  decoFlowers(start, 26);

  const grove = add(newScene({ id: 'grove', area: 'forest', msg: 'A quiet clearing', music: 'forest', amb: 'none', floor: '#3c8a48' }));
  grove.exits = [{ side: 's', a: 0.4, b: 0.6, to: 'start' }];
  const stump = [Math.max(0.1, (UNIT * 2.8) / W), rr(0.4, 0.55)];
  grove.feat.stump = stump;
  grove.pullables.push({ id: 'sword', kind: 'sword', fx: stump[0], fy: stump[1], need: 6 });
  grove.solids.push({ fx: stump[0], fy: stump[1], r: 0.55, kind: 'stump' });
  for (let a = 100; a <= 260; a += 26) {                 // alcove ring, open to the east
    const rad = a * Math.PI / 180, d = UNIT * 2.5;
    grove.solids.push({ fx: stump[0] + Math.cos(rad) * d / W, fy: stump[1] + Math.sin(rad) * d / H, r: rr(1.0, 1.3), kind: 'tree' });
  }
  grove.paths = [makePath([0.5, 0.97], [stump[0] + 2.2 * UNIT / W, stump[1]], 1)];
  scatter(grove, 7, 'tree', 0.9, 1.3, 1.5, [[...stump, 3.5]], [0.4, 0.95, 0.08, 0.85]);
  decoFlowers(grove, 20);

  const meadow = add(newScene({ id: 'meadow', area: 'forest', msg: 'Birdsong drifts over the meadow', music: 'forest', amb: 'none', floor: '#4a9650' }));
  meadow.exits = [{ side: 'e', a: 0.38, b: 0.62, to: 'start' }];
  meadow.paths = [makePath([0.97, 0.5], [0.3, 0.5], 2)];
  meadow.feat.perches = [];
  for (let i = 0; i < 3; i++) {
    const p = freeSpot(meadow, [0.12, 0.8, 0.15, 0.85], 2.5);
    meadow.solids.push({ fx: p[0], fy: p[1], r: 0.45, kind: 'snag' });
    meadow.feat.perches.push(p);
  }
  scatter(meadow, 7, 'tree', 0.9, 1.3, 1.4, meadow.feat.perches.map(p => [...p, 2]));
  decoFlowers(meadow, 60);

  // ---------------- Field: 7 screens south, wind, rocks guide the path ----------------
  const FIELD_MSG = ['', 'The grass hisses', 'The wind picks up', 'Something darts in the grass', 'Clouds gather overhead', 'The gusts grow stronger', 'A ravine. Too wide to jump.'];
  const HARES = [0, 1, 1, 2, 2, 3, 1];
  let north = [0.42, 0.58];
  for (let i = 1; i <= 7; i++) {
    const last = i === 7;
    const sc = add(newScene({
      id: 'f' + i, area: 'field', depth: i, msg: FIELD_MSG[i - 1] || '', music: 'field', amb: 'wind',
      floor: '#7d9a4c', speed: 0.45, accel: 8,
      wind: { dir: pick([-1, 1]), strength: 0.035 + 0.015 * i, period: rr(4.5, 6.5) },
    }));
    const south = last ? null : gapAt(rr(0.22, 0.78), 0.08);
    sc.exits.push({ side: 'n', a: north[0], b: north[1], to: i === 1 ? 'start' : 'f' + (i - 1) });
    if (south) sc.exits.push({ side: 's', a: south[0], b: south[1], to: 'f' + (i + 1) });
    const nPt = edgePoint('n', (north[0] + north[1]) / 2);
    edgeWall(sc, 'w', 'boulder', 1.0, []);
    edgeWall(sc, 'e', 'boulder', 1.0, []);
    edgeWall(sc, 'n', 'boulder', 1.0, [north]);
    if (!last) {
      edgeWall(sc, 's', 'boulder', 1.0, [south]);
      sc.paths = [makePath(nPt, edgePoint('s', (south[0] + south[1]) / 2), 2 + (i > 3 ? 1 : 0))];
      scatter(sc, 3 + Math.floor(i * 1.6), 'boulder', 0.7, 1.4, Math.max(1.4, 2.0 - i * 0.07), [], [0.1, 0.9, 0.12, 0.88]);
    } else {
      edgeWall(sc, 's', 'boulder', 1.0, []);
      sc.feat.ravine = [0.44, 0.6];
      const up1 = [rr(0.2, 0.8), 0.36], up2 = [rr(0.2, 0.8), 0.69];
      sc.feat.updrafts = [up1, up2];
      sc.feat.heart = [rr(0.3, 0.7), 0.84];
      sc.paths = [makePath(nPt, up1, 1), makePath(up2, sc.feat.heart, 0)];
      scatter(sc, 4, 'boulder', 0.7, 1.2, 1.6, [[...up1, 2.2]], [0.1, 0.9, 0.12, 0.34]);
      scatter(sc, 2, 'boulder', 0.6, 1.0, 1.6, [[...up2, 2.2], [...sc.feat.heart, 1.5]], [0.1, 0.9, 0.72, 0.88]);
    }
    for (let h = 0; h < HARES[i - 1]; h++) {
      const box = last ? [0.15, 0.85, 0.15, 0.34] : [0.15, 0.85, 0.3, 0.85];
      const p = freeSpot(sc, box, 1.2);
      sc.spawns.push({ type: 'hare', fx: p[0], fy: p[1] });
    }
    for (let t = 0; t < 90; t++) sc.deco.push({ kind: 'tuft', fx: rng(), fy: rng(), s: rr(0.6, 1.3), ph: rng() * 6 });
    if (south) north = south;
  }

  // ---------------- Cave: 7 screens east, boss at the falls ----------------
  const CAVE_SPAWNS = [
    ['stalker'],
    ['glowworm', 'glowworm', 'stalker'],
    ['diver', 'glowworm'],
    ['charger', 'diver'],
    ['stalker', 'diver', 'diver', 'glowworm'],
    ['charger', 'diver', 'diver', 'diver', 'glowworm'],
    ['warden'],
  ];
  const CAVE_MSG = ['Find the way out', 'Pale things crawl in the dark', 'Something skitters on the ceiling', 'Deeper still. Hooves scrape stone.', 'The ceiling is alive', 'The drips sound like footsteps', 'A roar of water ahead'];
  const CAVE_FLOOR = ['#1d1a22', '#1e1a21', '#201a21', '#211a1f', '#221a1e', '#231a1c', '#1c1d26'];
  let west = null;
  for (let i = 1; i <= 7; i++) {
    const boss = i === 7;
    const sc = add(newScene({
      id: 'c' + i, area: 'cave', depth: i, msg: CAVE_MSG[i - 1], dark: true,
      music: i <= 3 ? 'cave' : 'cave2', amb: boss ? 'falls' : 'none',
      floor: CAVE_FLOOR[i - 1], speed: 0.3, accel: 6, heroStart: [0.08, 0.5],
    }));
    const east = boss ? [0.4, 0.6] : gapAt(rr(0.25, 0.75), 0.09);
    if (west) sc.exits.push({ side: 'w', a: west[0], b: west[1], to: 'c' + (i - 1) });
    sc.exits.push({ side: 'e', a: east[0], b: east[1], to: boss ? 'm1' : 'c' + (i + 1), locked: boss ? () => !RT.c7 || !RT.c7.bossDead : null });
    edgeWall(sc, 'n', 'cavewall', 1.1, [], 1.4);
    edgeWall(sc, 's', 'cavewall', 1.1, [], 1.4);
    edgeWall(sc, 'w', 'cavewall', 1.1, west ? [west] : [[0.4, 0.6]], 1.4);
    if (!boss) edgeWall(sc, 'e', 'cavewall', 1.1, [east], 1.4);
    const wPt = west ? edgePoint('w', (west[0] + west[1]) / 2) : [0.06, 0.5];
    sc.paths = [makePath(wPt, boss ? [0.8, 0.5] : edgePoint('e', (east[0] + east[1]) / 2), 2)];
    if (!boss) scatter(sc, 1 + i, 'pillar', 0.8, 1.3, 2.2, [], [0.15, 0.85, 0.15, 0.85]);
    else sc.feat.falls = true;
    CAVE_SPAWNS[i - 1].forEach(type => {
      const p = type === 'warden' ? [0.62, 0.5] : freeSpot(sc, [0.35, 0.85, 0.2, 0.8], 1.3, [[...wPt, 6]]);
      sc.spawns.push({ type, fx: p[0], fy: p[1] });
    });
    for (let t = 0; t < 46; t++) sc.deco.push({ kind: 'pebble', fx: rng(), fy: rng(), s: rr(0.4, 1.6), shade: rng() });
    west = east;
  }

  // ---------------- Marsh: 3 screens beyond the falls ----------------
  const MARSH_MSG = ['Mist hangs over black water', 'The water ripples by itself', 'A lantern glows in the distance'];
  west = [0.4, 0.6];
  for (let i = 1; i <= 3; i++) {
    const endScene = i === 3;
    const sc = add(newScene({ id: 'm' + i, area: 'marsh', depth: i, msg: MARSH_MSG[i - 1], music: 'marsh', amb: 'marsh', floor: '#3a4a2d', speed: 0.34, accel: 7 }));
    const east = endScene ? null : gapAt(rr(0.25, 0.75), 0.1);
    sc.exits.push({ side: 'w', a: west[0], b: west[1], to: i === 1 ? 'c7' : 'm' + (i - 1) });
    if (east) sc.exits.push({ side: 'e', a: east[0], b: east[1], to: 'm' + (i + 1) });
    edgeWall(sc, 'n', 'deadtree', 1.0, [], 1.9);
    edgeWall(sc, 's', 'deadtree', 1.0, [], 1.9);
    const wPt = edgePoint('w', (west[0] + west[1]) / 2);
    const ePt = east ? edgePoint('e', (east[0] + east[1]) / 2) : [0.88, 0.5];
    if (endScene) sc.feat.lantern = [0.88, 0.5];
    sc.paths = [makePath(wPt, ePt, 2)];
    for (let p = 0; p < 3 + i; p++) {
      const q = freeSpot(sc, [0.2, 0.8, 0.2, 0.8], 2.2, [[...wPt, 4], [...ePt, 3], ...sc.pools.map(o => [o.fx, o.fy, o.r + 2])]);
      sc.pools.push({ fx: q[0], fy: q[1], r: rr(1.2, 2.1) });
    }
    scatter(sc, 2 + i, 'deadtree', 0.7, 1.0, 1.8, sc.pools.map(o => [o.fx, o.fy, o.r + 0.5]), [0.1, 0.9, 0.15, 0.85]);
    const lurkers = [1, 2, 2][i - 1];
    for (let l = 0; l < lurkers; l++) sc.spawns.push({ type: 'lurker', fx: sc.pools[l].fx, fy: sc.pools[l].fy, pool: l });
    for (let t = 0; t < 50; t++) sc.deco.push({ kind: 'reed', fx: rng(), fy: rng(), s: rr(0.6, 1.2), ph: rng() * 6 });
    west = east;
  }
  return S;
}

function decoFlowers(sc, n) {
  const cols = ['#f3e37a', '#f2f2f2', '#e98ac0', '#9fc6f5'];
  for (let i = 0; i < n; i++) sc.deco.push({ kind: 'flower', fx: rng(), fy: rng(), c: pick(cols) });
  for (let i = 0; i < 30; i++) sc.deco.push({ kind: 'grass', fx: rng(), fy: rng(), s: rr(0.5, 1) });
}

// =====================================================================
// State
// =====================================================================
let WORLD = {};
let RT = {};                   // runtime memory per scene: dead spawns, dropped items, pulled things
const rtFor = id => RT[id] || (RT[id] = { dead: new Set(), items: [], pulled: new Set(), bossDead: false, heartTaken: false });

function newHero() { return { x: W * 0.3, y: H * 0.6, vx: 0, vy: 0, z: 0, stun: 0, invuln: 0, fx: 1, fy: 0, hp: 5, maxHp: 5, dashT: 0, dashCool: 0, ride: null, falling: 0 }; }
function newInv() { return { sword: false, scalp: false, wing: false, horn: false, food: [], glow: 0, slime: 0 }; }
function newPull(id) { return { id, grip: false, wiggle: 0, lastSide: 0, tilt: 0, tries: 0, hinted: false }; }

const state = {
  scene: 'start', hero: null, inv: newInv(), pull: newPull(null),
  enemies: [], items: [], hazards: [], rings: [], fx: [], texts: [], solids: [], pools: [],
  drops: [], splashes: [], dripTimer: 1, bird: null, clouds: [], gust: 0, gustT: 0,
  atk: null, atkCool: 0, hold: { on: false, t: 0, charged: false },
  cut: null, title: null,
  cam: { z: 1, x: 0, y: 0, focus: null, pulses: [], ez: 1, ex: 0, ey: 0 },
  started: false, won: false, busy: false, fade: 0, fadeTarget: 0, fadeRate: 4,
  shake: 0, time: 0, keys: {}, prevKeys: {}, entry: null, area: null, seen: {},
};
state.hero = newHero();

// =====================================================================
// Input: arrows move. F sword/grab, D dash, S eat. A, E, R reserved.
// =====================================================================
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  begin();
  if (e.repeat) return;
  state.keys[k] = true;
  if (k === 'r' && state.won) newGame();
});
window.addEventListener('keyup', e => { state.keys[e.key.toLowerCase()] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const map = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright' };
  bindHold(b, map[b.dataset.dir]);
});
function bindHold(el, key) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); state.keys[key] = true; begin(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { state.keys[key] = false; }));
}
bindHold(document.getElementById('act'), 'btnact');
bindHold(document.getElementById('dash'), 'btndash');
bindHold(document.getElementById('eat'), 'btneat');

let audio, master, musicGain, noiseBuf, soundOn = true;

function initAudio() {
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
  master = audio.createGain(); master.gain.value = 0.9; master.connect(audio.destination);
  musicGain = audio.createGain(); musicGain.gain.value = 1; musicGain.connect(master);
  noiseBuf = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(freq, start, dur, { type = 'triangle', vol = 0.12, attack = 0.03, to = null, pan = 0, dest = master } = {}) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  const t = audio.currentTime + start;
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = o.connect(g);
  if (pan && audio.createStereoPanner) { const p = audio.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); node = g.connect(p); }
  node.connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(start, dur, { vol = 0.2, freq = 400, q = 1, type = 'lowpass', dest = master } = {}) {
  if (!audio) return;
  const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  const t = audio.currentTime + start;
  s.buffer = noiseBuf; s.loop = true;
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t, Math.random()); s.stop(t + dur + 0.05);
}

function scheduleMusic() {
  const m = MUSIC[currentMusic];
  while (nextNoteTime < audio.currentTime + 0.3) {
    const [mel, bass] = m.loop[noteIndex % m.loop.length];
    const s = Math.max(0, nextNoteTime - audio.currentTime);
    if (mel) tone(midiHz(mel + m.shift), s, m.step * m.lead.len, { type: m.lead.type, vol: m.lead.vol, attack: 0.05, dest: musicGain });
    if (mel && m.shimmer) tone(midiHz(mel) * 2, s, m.step * 0.9, { type: 'sine', vol: 0.025, attack: 0.02, dest: musicGain });
    if (bass) tone(midiHz(bass + m.shift), s, m.step * m.bass.len, { type: m.bass.type, vol: m.bass.vol, attack: m.bass.len < 2 ? 0.01 : 0.3, dest: musicGain });
    nextNoteTime += m.step;
    noteIndex++;
  }
  if (m.frogs && audio.currentTime > nextFrog) {
    const p = Math.random() * 1.6 - 0.8, f = 150 + Math.random() * 80;
    for (let i = 0; i < 2 + (Math.random() * 3 | 0); i++) tone(f, i * 0.13, 0.1, { type: 'square', vol: 0.03, attack: 0.005, to: f * 0.7, pan: p, dest: musicGain });
    nextFrog = audio.currentTime + 1.5 + Math.random() * 4;
  }
}
function setMusic(name) {
  if (!audio) { currentMusic = name; return; }
  if (name === currentMusic) return;
  const t = audio.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(0.0001, t + 0.6);
  currentMusic = name;
  setTimeout(() => {
    noteIndex = 0;
    nextNoteTime = audio.currentTime + 0.1;
    const t2 = audio.currentTime;
    musicGain.gain.cancelScheduledValues(t2);
    musicGain.gain.setValueAtTime(0.0001, t2);
    musicGain.gain.linearRampToValueAtTime(1, t2 + 1.5);
  }, 650);
}
function startMusic() {
  initAudio();
  if (audio.state === 'suspended') audio.resume();
  nextNoteTime = audio.currentTime + 0.1;
  clearInterval(musicTimer);
  musicTimer = setInterval(scheduleMusic, 100);
  setAmbience(pendingAmb);
}

// Ambience beds: wind, waterfall, marsh hum
function setAmbience(type) {
  pendingAmb = type;
  if (!audio) return;
  if (amb && amb.type === type) return;
  if (amb) { const a = amb; a.g.gain.setTargetAtTime(0.0001, audio.currentTime, 0.3); setTimeout(() => { try { a.src.stop(); } catch (e) {} }, 1500); }
  amb = null;
  if (type === 'none') return;
  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = noiseBuf; src.loop = true;
  if (type === 'wind') { f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.7; }
  if (type === 'falls') { f.type = 'lowpass'; f.frequency.value = 900; }
  if (type === 'marsh') { f.type = 'lowpass'; f.frequency.value = 260; }
  g.gain.value = 0.0001;
  src.connect(f).connect(g).connect(master);
  src.start();
  amb = { type, src, f, g, next: 0 };
}
function ambLevel(v, freq) {
  if (!amb || audio.currentTime < amb.next) return;
  amb.next = audio.currentTime + 0.1;
  amb.g.gain.setTargetAtTime(Math.max(0.0001, v), audio.currentTime, 0.25);
  if (freq) amb.f.frequency.setTargetAtTime(freq, audio.currentTime, 0.3);
}

// Camera: gentle focus zoom plus bouncing zoom ripples of varying size
// =====================================================================
const ZP = {          // amount, duration, bounces
  tap:    [0.015, 0.25, 1],
  hit:    [0.035, 0.35, 2],
  hurt:   [0.05, 0.45, 2],
  parry:  [0.07, 0.55, 3],
  kill:   [0.09, 0.8, 3],
  pickup: [0.05, 0.6, 2],
  land:   [0.12, 0.9, 4],
  boss:   [0.15, 1.5, 5],
  title:  [0.05, 1.1, 2],
};
function zoomPulse(x, y, preset) { const [a, d, b] = ZP[preset]; state.cam.pulses.push({ x, y, a, d, b, t: 0 }); }
function updateCam(dt) {
  const c = state.cam;
  let add = 0, wx = 0, wy = 0, ws = 0;
  for (let i = c.pulses.length - 1; i >= 0; i--) {
    const p = c.pulses[i]; p.t += dt;
    const k = p.t / p.d;
    if (k >= 1) { c.pulses.splice(i, 1); continue; }
    const v = p.a * (1 - k) * (1 - k) * Math.abs(Math.sin(Math.PI * p.b * k));
    add += v; wx += p.x * v; wy += p.y * v; ws += v;
  }
  const f = c.focus;
  const tz = f ? f.z : 1;
  const [tx, ty] = f ? f.at() : [W / 2, H / 2];
  const k = 1 - Math.exp(-(f ? 5 : 3) * dt);
  c.z += (tz - c.z) * k; c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
  c.ez = Math.max(1, c.z + add);
  const m = Math.min(1, ws * 5);
  c.ex = ws ? c.x + (wx / ws - c.x) * m : c.x;
  c.ey = ws ? c.y + (wy / ws - c.y) * m : c.y;
  const hw = W / (2 * c.ez), hh = H / (2 * c.ez);
  c.ex = Math.max(hw, Math.min(W - hw, c.ex));
  c.ey = Math.max(hh, Math.min(H - hh, c.ey));
}
const toScreen = (x, y) => [(x - state.cam.ex) * state.cam.ez + W / 2, (y - state.cam.ey) * state.cam.ez + H / 2];

function say(text, x, y, opts = {}) {
  const t = { text, x, y, t: 0, life: opts.life || 3.2, key: opts.key || null, follow: x == null, size: opts.size || 1, color: opts.color || '#fdf6e3' };
  if (t.key) state.texts = state.texts.filter(o => o.key !== t.key);
  if (t.follow) state.texts = state.texts.filter(o => !o.follow);
  state.texts.push(t);
  if (state.texts.length > 5) state.texts.shift();
}
function sayHero(text, opts) { say(text, null, null, opts); }
function unsay(key) { state.texts = state.texts.filter(o => o.key !== key); }
function showTitle(text, sub, style = 'area', life = 3) { state.title = { text, sub, style, t: 0, life }; }

const sceneDef = () => WORLD[state.scene];

function refreshSceneGeometry() {
  const sc = sceneDef();
  if (!sc) return;
  state.solids = sc.solids.map(s => ({ x: s.fx * W, y: s.fy * H, r: s.r * UNIT * ({ cavewall: 0.95, boulder: 0.95, pillar: 0.95, stump: 1, snag: 1 }[s.kind] || 0.45), vis: s.r * UNIT, kind: s.kind }));
  state.pools = sc.pools.map(p => ({ x: p.fx * W, y: p.fy * H, r: p.r * UNIT }));
  for (const e of state.enemies) if (e.poolIdx != null) e.pool = state.pools[e.poolIdx];
}

function saveScene() {
  const rt = rtFor(state.scene);
  rt.items = state.items.map(it => ({ type: it.type, fx: it.x / W, fy: it.y / H }));
}

function enterScene(id, fx, fy) {
  if (WORLD[state.scene]) saveScene();
  const sc = WORLD[id], rt = rtFor(id);
  state.scene = id;
  state.pull = newPull(null);
  state.atk = null; state.hold = { on: false, t: 0, charged: false };
  const h = state.hero;
  const pos = fx != null ? [fx, fy] : (sc.heroStart || [0.5, 0.5]);
  Object.assign(h, { x: pos[0] * W, y: pos[1] * H, vx: 0, vy: 0, z: 0, stun: 0, invuln: 0.6, ride: null, falling: 0, dashT: 0 });
  state.enemies = sc.spawns.map((s, i) => rt.dead.has(i) ? null : makeEnemy(s.type, s.fx * W, s.fy * H, i, s.pool)).filter(Boolean);
  state.items = rt.items.map(it => ({ type: it.type, x: it.fx * W, y: it.fy * H }));
  state.hazards = []; state.rings = []; state.fx = []; state.texts = [];
  state.drops.length = 0; state.splashes.length = 0; state.dripTimer = 1;
  state.bird = id === 'meadow' ? makeBird() : null;
  state.clouds = sc.area === 'field' ? Array.from({ length: 4 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: UNIT * (4 + Math.random() * 4) })) : [];
  refreshSceneGeometry();
  state.entry = { id, fx: pos[0], fy: pos[1] };

  if (state.area !== sc.area) {
    state.area = sc.area;
    showTitle(AREA_NAMES[sc.area], null, 'area', 2.8);
    zoomPulse(h.x, h.y, 'title');
  }
  if (sc.msg && !state.seen[id]) say(sc.msg, h.x, h.y - UNIT * 0.8, { key: 'scene', life: 3.5 });
  state.seen[id] = true;
  const bossAlive = id === 'c7' && !rt.bossDead;
  setMusic(bossAlive ? 'cave2' : sc.music);
  setAmbience(sc.amb);
}

function transitionTo(id, fx, fy, quick) {
  state.busy = true;
  state.fadeTarget = 1;
  state.fadeRate = quick ? 14 : 4;
  setTimeout(() => {
    enterScene(id, fx, fy);
    state.fadeTarget = 0;
    setTimeout(() => { state.busy = false; }, quick ? 150 : 500);
  }, quick ? 280 : 1000);
}

function checkEdges() {
  const sc = sceneDef(), h = state.hero, r = UNIT * 0.5 + 2;
  for (const ex of sc.exits) {
    if (ex.locked && ex.locked()) continue;
    let at = false, along = 0;
    if (ex.side === 'n') { at = h.y <= r && held.up(); along = h.x / W; }
    if (ex.side === 's') { at = h.y >= H - r && held.down(); along = h.x / W; }
    if (ex.side === 'w') { at = h.x <= r && held.left(); along = h.y / H; }
    if (ex.side === 'e') { at = h.x >= W - r && held.right(); along = h.y / H; }
    if (at && along >= ex.a - 0.03 && along <= ex.b + 0.03) {
      const tgt = WORLD[ex.to], back = tgt.exits.find(o => o.side === OPP[ex.side] && o.to === state.scene);
      const lo = back ? back.a + 0.02 : 0.1, hi = back ? back.b - 0.02 : 0.9;
      const al = Math.max(lo, Math.min(hi, along));
      const inX = 1.2 * UNIT / W, inY = 1.2 * UNIT / H;
      const side = OPP[ex.side];
      const [fx, fy] = side === 'n' ? [al, inY] : side === 's' ? [al, 1 - inY] : side === 'w' ? [inX, al] : [1 - inX, al];
      transitionTo(ex.to, fx, fy, true);
      return;
    }
  }
}

function newGame() {
  state.won = false;
  state.cut = null;
  state.title = null;
  state.cam.focus = null;
  state.busy = true;
  state.fadeTarget = 1; state.fadeRate = 4;
  setTimeout(() => {
    WORLD = buildWorld();
    RT = {};
    state.inv = newInv();
    state.hero = newHero();
    state.items = []; state.enemies = [];
    state.area = null; state.seen = {};
    refreshButtons();
    enterScene('start');
    state.fadeTarget = 0;
    setTimeout(() => { state.busy = false; }, 500);
  }, 900);
}

// =====================================================================
// Update
// =====================================================================
function update(dt) {
  state.time += dt;
  state.fade += (state.fadeTarget - state.fade) * (1 - Math.exp(-state.fadeRate * dt));
  state.shake = Math.max(0, state.shake - dt);
  updateCam(dt);
  updateTexts(dt);
  updateFx(dt);
  const sc = sceneDef();
  if (state.started && sc.dark) updateDrips(dt);
  if (state.bird) updateBird(dt);
  if (sc.area === 'field') updateWind(dt, sc);
  if (sc.id === 'c7' && amb) ambLevel(0.04 + 0.28 * Math.max(0, state.hero.x / W - 0.3), 900);
  if (sc.area === 'marsh') ambLevel(0.05);
  if (!state.started) return;
  readPresses();
  if (state.cut) { updateCut(dt); return; }
  if (state.won) return;

  const h = state.hero, inv = state.inv;
  if (!state.busy) { updatePull(dt); updateCombat(dt); updateAbilities(dt); }

  // withering items
  if (inv.glow > 0) inv.glow = Math.max(0, inv.glow - dt);
  if (inv.slime > 0) inv.slime = Math.max(0, inv.slime - dt);

  // movement
  const locked = h.stun > 0 || state.busy || state.pull.grip || h.ride || h.falling > 0;
  if (h.ride) updateRide(dt);
  else if (h.falling > 0) updateFall(dt);
  else if (h.dashT > 0) {
    h.dashT -= dt;
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (Math.random() < 0.6) state.fx.push({ x: h.x, y: h.y, vx: 0, vy: 0, t: 0, life: 0.2, color: 'rgba(245,208,111,.5)', size: UNIT * 0.8 });
  } else {
    const inp = locked ? { x: 0, y: 0 } : inputVector();
    if (inp.x || inp.y) { h.fx = inp.x; h.fy = inp.y; }
    let spd = sc.speed * (state.hold.charged ? 0.45 : 1);
    if (inPool(h.x, h.y)) spd *= 0.55;
    const k = 1 - Math.exp(-(h.stun > 0 ? 3 : sc.accel) * dt);
    h.vx += (inp.x * spd * L() - h.vx) * k;
    h.vy += (inp.y * spd * L() - h.vy) * k;
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (sc.wind) h.x += sc.wind.dir * sc.wind.strength * L() * (0.3 + state.gust) * dt;
  }
  if (!h.ride) { collideSolids(h, UNIT * 0.42); clampTo(h, UNIT * 0.5); }
  h.stun -= dt; h.invuln -= dt; h.dashCool -= dt;

  if (!state.busy && !h.ride && h.falling <= 0) { checkEdges(); updateFeatures(dt); }
  if (!state.busy) { updateEnemies(dt); updateHazards(dt); }

  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    if (!h.ride && Math.hypot(h.x - it.x, h.y - it.y) < UNIT * 0.9) { state.items.splice(i, 1); collect(it); }
  }
}

function clampTo(a, r) {
  let wall = false;
  if (a.x < r) { a.x = r; a.vx = Math.max(0, a.vx); wall = true; }
  if (a.x > W - r) { a.x = W - r; a.vx = Math.min(0, a.vx); wall = true; }
  if (a.y < r) { a.y = r; a.vy = Math.max(0, a.vy); wall = true; }
  if (a.y > H - r) { a.y = H - r; a.vy = Math.min(0, a.vy); wall = true; }
  return wall;
}
function collideSolids(a, r) {
  let hit = false;
  for (const o of state.solids) {
    const dx = a.x - o.x, dy = a.y - o.y, d = Math.hypot(dx, dy) || 0.001, min = r + o.r;
    if (d < min) {
      const nx = dx / d, ny = dy / d;
      a.x = o.x + nx * min; a.y = o.y + ny * min;
      const vn = a.vx * nx + a.vy * ny;
      if (vn < 0) { a.vx -= vn * nx; a.vy -= vn * ny; }
      hit = true;
    }
  }
  return hit;
}
const inPool = (x, y) => state.pools.some(p => Math.hypot(x - p.x, y - p.y) < p.r * 0.85);

// ---------------- scene features ----------------
function updateFeatures(dt) {
  const sc = sceneDef(), h = state.hero, f = sc.feat, rt = rtFor(sc.id);

  if (f.stone) {
    const sx = f.stone[0] * W, sy = f.stone[1] * H, d = Math.hypot(h.x - sx, h.y - sy);
    if (d < UNIT * 3 && !state.seen.stoneHint) { state.seen.stoneHint = true; say('The blue stone hums', sx, sy - UNIT * 0.9, { key: 'stone' }); }
    if (d < UNIT * 0.7) {
      say('The ground gives way...', h.x, h.y - UNIT, { key: 'fall' });
      sfx.fall();
      zoomPulse(sx, sy, 'land');
      transitionTo('c1', 0.08, 0.5);
    }
  }

  if (f.ravine) {
    const y0 = f.ravine[0] * H, y1 = f.ravine[1] * H;
    if (h.y > y0 + UNIT * 0.25 && h.y < y1 - UNIT * 0.25 && h.dashT <= 0) {
      h.falling = 0.8; h.vx = 0; h.vy = 0; sfx.plummet();
      say('Too far to jump', h.x, y0 - UNIT, { key: 'rav' });
    }
    f.updrafts.forEach((u, i) => {
      const ux = u[0] * W, uy = u[1] * H, d = Math.hypot(h.x - ux, h.y - uy);
      if (d < UNIT * 3 && !state.seen['up' + i]) { state.seen['up' + i] = true; say('Leaves swirl here when the wind gusts', ux, uy - UNIT * 1.2, { key: 'up', life: 4 }); }
      if (d < UNIT * 1.1 && state.gust > 0.6 && !(h.rideCool > state.time)) {
        const o = f.updrafts[1 - i];
        h.ride = { t: 0, dur: 1.9, x0: h.x, y0: h.y, x1: o[0] * W, y1: o[1] * H + (i === 0 ? UNIT * 1.6 : -UNIT * 1.6) };
        h.invuln = 2.2; sfx.whoosh();
        zoomPulse(h.x, h.y, 'pickup');
      }
    });
    if (!rt.heartTaken && Math.hypot(h.x - f.heart[0] * W, h.y - f.heart[1] * H) < UNIT * 0.9) {
      rt.heartTaken = true;
      collect({ type: 'maxheart', x: h.x, y: h.y });
      say('A sheltered hollow. The wind can\'t reach you here.', h.x, h.y + UNIT * 2.2, { key: 'hollow', life: 4 });
    }
  }

  if (f.falls) {
    const wx = W - UNIT * 2.3, lim = wx - UNIT * 0.45;
    const gap = sc.exits[sc.exits.length - 1];
    const open = rt.bossDead && h.y > gap.a * H + UNIT * 0.5 && h.y < gap.b * H - UNIT * 0.5;
    if (h.x > lim && !open) { h.x = lim; h.vx = Math.min(0, h.vx); }
  }

  if (f.lantern) {
    const lx = f.lantern[0] * W, ly = f.lantern[1] * H;
    if (Math.hypot(h.x - lx, h.y - ly) < UNIT * 1.1) {
      state.won = true;
      sfx.victory();
      zoomPulse(lx, ly, 'boss');
      showTitle('To be continued', TOUCH ? 'tap to begin a new adventure' : 'press R to begin a new adventure', 'end', 9999);
    }
  }
}

function updateRide(dt) {
  const h = state.hero, r = h.ride;
  r.t += dt;
  const p = Math.min(1, r.t / r.dur), e = p * p * (3 - 2 * p);
  h.x = r.x0 + (r.x1 - r.x0) * e;
  h.y = r.y0 + (r.y1 - r.y0) * e;
  h.z = Math.sin(Math.PI * p) * UNIT * 3.2;
  if (Math.random() < 0.5) state.fx.push({ x: h.x + (Math.random() - 0.5) * UNIT * 2, y: h.y + UNIT * 0.3, vx: (Math.random() - 0.5) * UNIT * 3, vy: -UNIT * 2, t: 0, life: 0.6, color: '#b7c46a' });
  if (p >= 1) {
    h.ride = null; h.z = 0; h.vx = 0; h.vy = 0; h.rideCool = state.time + 1.5;
    sfx.land(); zoomPulse(h.x, h.y, 'land'); state.shake = 0.2;
    spark(h.x, h.y + UNIT * 0.4, '#9a8a5a', 10, 3);
  }
}
function updateFall(dt) {
  const h = state.hero;
  h.falling -= dt;
  if (h.falling <= 0) {
    h.falling = 0;
    const e = state.entry;
    h.x = e.fx * W; h.y = e.fy * H; h.vx = 0; h.vy = 0;
    hurtHero(1, h.x, h.y, { noKnock: true, force: true });
  }
}

// ---------------- wind (field) ----------------
function updateWind(dt, sc) {
  state.gustT += dt;
  const ph = (state.gustT % sc.wind.period) / sc.wind.period;
  const target = ph > 0.62 ? Math.sin((ph - 0.62) / 0.38 * Math.PI) : 0;
  state.gust += (target - state.gust) * (1 - Math.exp(-5 * dt));
  if (state.gust > 0.5 && !state.gustSfx) { state.gustSfx = true; }
  if (state.gust < 0.2) state.gustSfx = false;
  ambLevel(0.04 + state.gust * (0.12 + sc.depth * 0.02), 380 + state.gust * 700);
  const n = 1 + Math.floor(state.gust * 4);
  for (let i = 0; i < n; i++) if (Math.random() < 0.4) {
    const dir = sc.wind.dir, x = dir > 0 ? -20 : W + 20;
    state.fx.push({ x, y: Math.random() * H, vx: dir * L() * (0.5 + state.gust), vy: (Math.random() - 0.5) * UNIT, t: 0, life: 2.5, color: 'streak', size: UNIT * (0.8 + state.gust * 1.6) });
  }
  if (Math.random() < 0.08 + state.gust * 0.3) {
    const dir = sc.wind.dir;
    state.fx.push({ x: dir > 0 ? -10 : W + 10, y: Math.random() * H, vx: dir * L() * (0.25 + state.gust * 0.5), vy: (Math.random() - 0.5) * UNIT * 2, t: 0, life: 4, color: 'leaf', spin: Math.random() * 6 });
  }
  for (const c of state.clouds) { c.x += sc.wind.dir * L() * 0.02 * dt; if (c.x > W + c.r) c.x = -c.r; if (c.x < -c.r) c.x = W + c.r; }
}

// =====================================================================
// Pulling things free: hold F, rock left/right, pull up
// =====================================================================
const PULL = {
  turnip: {
    approach: () => `A stubborn turnip. Hold ${K.act} to grab it`,
    fails: () => [`Rooted deep. Keep holding ${K.act} and rock it ${K.l} ${K.r}`, `Pulling straight won't work. Hold on and rock it ${K.l} ${K.r}`],
    rock: ['It wobbles.', 'The soil cracks.', 'Almost...', `Loose! Now pull ${K.u}`],
    notYet: () => `Not yet. Rock it more ${K.l} ${K.r}`,
  },
  sword: {
    approach: () => `A rusted sword, stuck fast in an old stump. ${K.act} to grab`,
    fails: () => ['You pull with everything you have. It won\'t budge.', 'The rust has welded blade to wood.', 'Your hands slip on the rust.', 'Like that turnip, only much worse.'],
    rock: ['It creaks.', 'It creaks.', 'Flakes of rust fall away.', 'Flakes of rust fall away.', 'The wood groans and gives.', 'It\'s loose. Now pull.'],
    notYet: () => 'Not yet. It needs more working.',
  },
};
function updatePull(dt) {
  const sc = sceneDef(), rt = rtFor(sc.id), h = state.hero;
  let near = null;
  for (const pl of sc.pullables) {
    if (rt.pulled.has(pl.id)) continue;
    if (Math.hypot(h.x - pl.fx * W, h.y - pl.fy * H) < UNIT * 1.7) near = pl;
  }
  let p = state.pull;
  p.tilt += (p.lastSide * Math.min(1, p.wiggle / (near ? near.need : 6)) * 0.35 - p.tilt) * (1 - Math.exp(-8 * dt));
  if (!near) {
    p.grip = false;
    p.wiggle = Math.max(0, p.wiggle - dt * 0.4);
    if (p.hinted) { p.hinted = false; unsay('pull'); }
    return;
  }
  if (p.id !== near.id) p = state.pull = newPull(near.id);
  const x = near.fx * W, y = near.fy * H, T = PULL[near.kind];
  const tell = s => say(s, x, y - UNIT * 1.3, { key: 'pull', life: 3.5 });
  if (!p.grip && !p.hinted) { p.hinted = true; tell(T.approach()); }
  if (pressedNow.act && !p.grip) {
    p.grip = true; sfx.strain();
    const f = T.fails();
    if (p.wiggle >= near.need) tell(`It's loose. Pull ${K.u}`);
    else tell(f[Math.min(p.tries++, f.length - 1)]);
    return;
  }
  if (p.grip && !held.act()) { p.grip = false; return; }
  if (!p.grip) return;
  if (pressedNow.left || pressedNow.right) {
    const side = pressedNow.left ? -1 : 1;
    if (side !== p.lastSide) {
      p.wiggle = Math.min(near.need, Math.floor(p.wiggle) + 1);
      p.lastSide = side;
      sfx.creak(side > 0);
      tell(T.rock[Math.min(T.rock.length - 1, Math.round(p.wiggle / near.need * T.rock.length) - 1)] || T.rock[0]);
      state.shake = 0.08;
      zoomPulse(x, y, 'tap');
    } else tell('It\'s already leaning that way.');
  }
  if (pressedNow.up) {
    if (p.wiggle >= near.need) freePullable(near, x, y);
    else { sfx.strain(); const f = T.fails(); tell(p.wiggle > 0 ? T.notYet() : f[Math.min(p.tries++, f.length - 1)]); }
  }
  if (pressedNow.down) tell('You brace your feet.');
}
function freePullable(pl, x, y) {
  rtFor(state.scene).pulled.add(pl.id);
  state.pull = newPull(null);
  unsay('pull');
  if (pl.kind === 'turnip') {
    sfx.pop();
    zoomPulse(x, y, 'pickup');
    spark(x, y, '#6a4a2a', 10, 3);
    state.inv.food.push('turnip');
    refreshButtons();
    say(`Got a turnip! ${K.eat} to eat, restores 1 heart.`, x, y - UNIT * 1.3, { key: 'pull', life: 4.5 });
  } else startSwordCut();
}

// =====================================================================
// Sword pulled free: fanfare, zoom in, heroic leap, QUEST
// =====================================================================
function startSwordCut() {
  const h = state.hero;
  state.inv.sword = true;
  state.cut = { type: 'sword', t: 0, landed: false, titled: false };
  h.vx = 0; h.vy = 0;
  sfx.shing(); sfx.fanfare();
  state.cam.focus = { z: 1.55, at: () => [state.hero.x, state.hero.y - UNIT] };
  state.shake = 0.2;
}
function updateCut(dt) {
  const c = state.cut, h = state.hero;
  c.t += dt;
  if (c.type === 'sword') {
    const a = 0.3, b = 1.35;
    h.z = c.t > a && c.t < b ? Math.sin(Math.PI * (c.t - a) / (b - a)) * UNIT * 2.4 : 0;
    if (c.t > a && c.t < b && Math.random() < 0.5) spark(h.x, h.y - h.z - UNIT, '#fff3c0', 1, 2);
    if (!c.landed && c.t >= b) {
      c.landed = true; h.z = 0;
      sfx.land(); state.shake = 0.3;
      zoomPulse(h.x, h.y, 'land');
      spark(h.x, h.y + UNIT * 0.4, '#8a7a5a', 14, 3.5);
    }
    if (!c.titled && c.t >= 1.5) {
      c.titled = true;
      sfx.flash();
      showTitle('QUEST', 'an epic adventure unfolds', 'quest', 2.6);
    }
    if (c.t >= 2.9) state.cam.focus = null;
    if (c.t >= 3.3) {
      state.cut = null;
      say(`Tap ${K.act} to slash. Hold and release to stab.`, h.x, h.y - UNIT * 1.2, { key: 'tip', life: 5 });
    }
  } else if (c.type === 'faint') {
    if (c.t > 1.3 && !c.moved) {
      c.moved = true;
      h.hp = h.maxHp;
      const e = state.entry;
      enterScene(e.id, e.fx, e.fy);
      state.fadeTarget = 0;
      sayHero('You come to, a little wiser.');
    }
    if (c.t > 2.2) state.cut = null;
  }
}

// =====================================================================
// Hero health
// =====================================================================
function hurtHero(dmg, fromX, fromY, opts = {}) {
  const h = state.hero;
  if (!opts.force && (h.invuln > 0 || h.ride || state.cut)) return false;
  h.hp = Math.max(0, h.hp - dmg);
  h.invuln = 1.2;
  sfx.hit();
  state.shake = 0.35;
  zoomPulse(h.x, h.y, 'hurt');
  state.hold.on = false; state.hold.charged = false; state.pull.grip = false;
  if (!opts.noKnock) {
    const e = state.entry;
    let ax = h.x - fromX, ay = h.y - fromY; const al = Math.hypot(ax, ay) || 1;
    let bx = e.fx * W - h.x, by = e.fy * H - h.y; const bl = Math.hypot(bx, by) || 1;
    let kx = ax / al + 0.6 * bx / bl, ky = ay / al + 0.6 * by / bl; const kl = Math.hypot(kx, ky) || 1;
    h.vx = kx / kl * 0.9 * L(); h.vy = ky / kl * 0.9 * L(); h.stun = 0.5;
  }
  if (h.hp <= 0) {
    state.cut = { type: 'faint', t: 0 };
    state.fadeTarget = 1; state.fadeRate = 3;
    sfx.death();
  }
  return true;
}

// =====================================================================
// Abilities and consumables
// =====================================================================
function updateAbilities(dt) {
  const h = state.hero, inv = state.inv;
  if (pressedNow.dash && inv.wing && h.dashCool <= 0 && !h.ride && !state.pull.grip) {
    h.dashT = 0.18; h.dashCool = 0.7; h.invuln = Math.max(h.invuln, 0.3);
    h.vx = h.fx * 1.15 * L(); h.vy = h.fy * 1.15 * L();
    sfx.dash();
  }
  if (pressedNow.eat) {
    if (!inv.food.length) return;
    if (h.hp >= h.maxHp) { sayHero('Not hungry right now.', { life: 1.5 }); return; }
    const miss = h.maxHp - h.hp;
    let i = inv.food.indexOf(miss >= 2 ? 'haunch' : 'turnip');
    if (i < 0) i = 0;
    const food = inv.food.splice(i, 1)[0], heal = food === 'haunch' ? 2 : 1;
    h.hp = Math.min(h.maxHp, h.hp + heal);
    sfx.munch();
    zoomPulse(h.x, h.y, 'tap');
    say('+' + heal, h.x, h.y - UNIT * 0.9, { key: 'heal', life: 1.2, color: '#ff8f8f' });
    refreshButtons();
  }
}

// =====================================================================
// Drops: every monster leaves something tied to what it was
// =====================================================================
const DROP_OF = { stalker: 'scalp', diver: 'wing', charger: 'horn', glowworm: 'glow', hare: 'haunch', lurker: 'slime', warden: 'warden' };
const UNIQUE = ['scalp', 'wing', 'horn', 'warden'];
function itemExists(type) {
  if (state.items.some(i => i.type === type)) return true;
  return Object.values(RT).some(rt => rt.items.some(i => i.type === type));
}
function dropFor(e) {
  let t = DROP_OF[e.type];
  if (UNIQUE.includes(t) && (state.inv[t] || itemExists(t))) t = 'heart';
  return t;
}
function collect(it) {
  const inv = state.inv, h = state.hero;
  const tell = (s, life = 4) => say(s, h.x, h.y - UNIT * 1.1, { key: 'item', life });
  zoomPulse(it.x, it.y, 'pickup');
  if (it.type === 'heart' || it.type === 'maxheart' || it.type === 'warden') sfx.heart(); else sfx.pickup();
  switch (it.type) {
    case 'scalp': inv.scalp = true; tell('A stalker scalp, ears and all. Anything that drops on your head will bounce off.', 5); break;
    case 'wing': inv.wing = true; tell(`A diver's leathery wing. ${K.dash} to dash through danger.`, 5); break;
    case 'horn': inv.horn = true; tell('You lash the charger\'s horn to your blade. Stabs hit harder and always knock back.', 5); break;
    case 'glow': inv.glow = 45; tell('A glow sac. Your light burns brighter, for now.'); break;
    case 'haunch':
      if (inv.food.length < 6) { inv.food.push('haunch'); tell(`A hare haunch. ${K.eat} to eat, restores 2 hearts.`); }
      else { h.hp = Math.min(h.maxHp, h.hp + 2); tell('Pack is full. You eat it on the spot.'); }
      break;
    case 'slime': inv.slime = 25; tell('Lurker slime coats your blade. Every hit stings harder until it dries.'); break;
    case 'heart': h.hp = Math.min(h.maxHp, h.hp + 1); say('+1', h.x, h.y - UNIT, { key: 'heal', life: 1.2, color: '#ff8f8f' }); break;
    case 'maxheart': h.maxHp += 1; h.hp = h.maxHp; tell('A heart container. You feel sturdier.'); break;
    case 'warden': h.maxHp += 2; h.hp = h.maxHp; tell('The Warden\'s heart. Your own grows stronger.', 5); break;
  }
  refreshButtons();
}

// =====================================================================
// Combat: tap F = slash (also blocks), hold then release = stab
// =====================================================================
const SLASH = { dur: 0.22, cool: 0.28, reach: 1.7 };
const STAB  = { dur: 0.22, cool: 0.35, reach: 2.2, charge: 0.35, knockChance: 0.6 };

function updateCombat(dt) {
  const inv = state.inv;
  if (!inv.sword || state.pull.grip || state.hero.ride) return;
  const h = state.hero, hold = state.hold;
  state.atkCool -= dt;
  const nearPullable = sceneDef().pullables.some(p => !rtFor(state.scene).pulled.has(p.id) && Math.hypot(h.x - p.fx * W, h.y - p.fy * H) < UNIT * 1.7);
  if (nearPullable) return;

  if (pressedNow.act) {
    hold.on = true; hold.t = 0; hold.charged = false;
    if (state.atkCool <= 0) {
      state.atk = { type: 'slash', t: 0, dur: SLASH.dur, hit: new Set(), ax: h.fx, ay: h.fy };
      state.atkCool = SLASH.cool;
      sfx.swoosh();
      if (state.bird) scareBird(h.x, h.y, 5);
    }
  }
  if (hold.on) {
    if (held.act()) {
      hold.t += dt;
      if (!hold.charged && hold.t > STAB.charge) { hold.charged = true; sfx.charge(); }
    } else {
      if (hold.charged) {
        state.atk = { type: 'stab', t: 0, dur: STAB.dur, hit: new Set(), ax: h.fx, ay: h.fy };
        state.atkCool = STAB.cool;
        h.vx += h.fx * 0.4 * L(); h.vy += h.fy * 0.4 * L();
        sfx.stab();
      }
      hold.on = false; hold.charged = false;
    }
  }
  const a = state.atk;
  if (!a) return;
  a.t += dt;
  for (const e of state.enemies) {
    if (a.hit.has(e) || !hittable(e)) continue;
    const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
    let hit;
    if (a.type === 'slash') hit = d < UNIT * SLASH.reach + e.r && ((dx * a.ax + dy * a.ay) / d > 0.2 || d < e.r + UNIT * 0.6);
    else {
      const along = dx * a.ax + dy * a.ay, perp = Math.abs(dx * a.ay - dy * a.ax);
      hit = along > -e.r && along < UNIT * (STAB.reach + (inv.horn ? 0.3 : 0)) + e.r && perp < e.r + UNIT * 0.35;
    }
    if (hit) {
      a.hit.add(e);
      let dmg = a.type === 'slash' ? 1 : 2;
      if (a.type === 'stab' && inv.horn) dmg += 1;
      if (inv.slime > 0) dmg += 1;
      damage(e, dmg, a.type, dx / d, dy / d);
    }
  }
  if (a.t >= a.dur) state.atk = null;
}
const slashActive = () => state.atk && state.atk.type === 'slash' && state.atk.t < state.atk.dur;

// =====================================================================
// Enemies
// =====================================================================
function makeEnemy(type, x, y, idx, poolIdx) {
  const b = { type, idx, x, y, vx: 0, vy: 0, t: 0, cool: 0, lx: 0, ly: 0, flash: 0, dead: false, hgt: 0, poolIdx: poolIdx == null ? null : poolIdx };
  const u = UNIT;
  switch (type) {
    case 'stalker':  return { ...b, r: u * 0.7, hp: 4, dmg: 1, mode: 'sleep', t: rr(1.5, 2.5) };
    case 'charger':  return { ...b, r: u * 0.75, hp: 5, dmg: 2, mode: 'sleep', t: 1.5 };
    case 'diver':    return { ...b, r: u * 0.55, hp: 3, dmg: 1, mode: 'ceiling', t: rr(1.5, 3.5), hgt: 1 };
    case 'glowworm': return { ...b, r: u * 0.4, hp: 1, dmg: 1, mode: 'crawl', t: 0, seg: Math.random() * 6 };
    case 'hare':     return { ...b, r: u * 0.45, hp: 2, dmg: 1, mode: 'idle', t: rr(0.3, 1) };
    case 'lurker':   return { ...b, r: u * 0.55, hp: 3, dmg: 1, mode: 'submerged', t: 0, cool: rr(0.5, 2) };
    case 'warden':   return { ...b, r: u * 1.3, hp: 18, maxHp: 18, dmg: 2, mode: 'dormant', t: 0 };
  }
}
function hittable(e) {
  if (e.dead) return false;
  if (e.type === 'diver') return ['floor', 'stunned', 'ascend'].includes(e.mode);
  if (e.type === 'lurker') return ['bite', 'risen', 'stunned'].includes(e.mode);
  if (e.type === 'warden') return e.mode !== 'dormant' && e.mode !== 'intro';
  return true;
}
function resumeMode(e) {
  const m = { stalker: ['stalk', 0], charger: ['aim', 0.8], diver: ['ascend', 0.6], glowworm: ['crawl', 0], hare: ['flee', 0.8], lurker: ['sink', 0.4], warden: ['prowl', 1.2] }[e.type];
  e.mode = m[0]; e.t = m[1];
}
function spark(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = UNIT * speed * (0.4 + Math.random());
    state.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.35 + Math.random() * 0.25, color });
  }
}
function updateFx(dt) {
  for (let i = state.fx.length - 1; i >= 0; i--) {
    const p = state.fx[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.color !== 'streak' && p.color !== 'leaf') { p.vx *= 0.9; p.vy *= 0.9; }
    if (p.t > p.life) state.fx.splice(i, 1);
  }
}

function damage(e, amount, kind, nx, ny) {
  e.hp -= amount;
  e.flash = 0.15;
  spark(e.x - nx * e.r * 0.6, e.y - ny * e.r * 0.6, '#ffe7b0', kind === 'stab' ? 8 : 5, 4);
  sfx.whack();
  zoomPulse(e.x, e.y, 'hit');
  if (e.hp <= 0) return kill(e);
  if (e.mode === 'sleep' || e.mode === 'dormant') resumeMode(e);
  if (e.type === 'warden') { if (e.hp <= e.maxHp / 2 && !e.enraged) { e.enraged = true; say('The Warden is enraged!', e.x, e.y - e.r - UNIT, { key: 'boss' }); sfx.roar(); zoomPulse(e.x, e.y, 'boss'); } return; }
  if (e.type === 'diver' || e.type === 'lurker') {
    if (kind === 'stab' && (state.inv.horn || Math.random() < STAB.knockChance)) { e.mode = 'stunned'; e.t = 1.0; }
    return;
  }
  const knock = kind === 'stab' && (state.inv.horn || Math.random() < STAB.knockChance);
  if (knock) { e.vx = nx * 0.9 * L(); e.vy = ny * 0.9 * L(); e.mode = 'stunned'; e.t = 0.7; state.shake = 0.2; }
  else { e.vx += nx * 0.2 * L(); e.vy += ny * 0.2 * L(); }
}

function kill(e) {
  e.dead = true; e.mode = 'dead'; e.t = 0.9; e.vx = 0; e.vy = 0;
  sfx.death();
  state.shake = 0.3;
  spark(e.x, e.y, '#6b1a1a', 14, 3);
  rtFor(state.scene).dead.add(e.idx);
  const t = dropFor(e);
  const dy = e.type === 'diver' || e.type === 'lurker' ? 0 : 0;
  state.items.push({ type: t, x: e.x, y: e.y + dy });
  if (e.type === 'warden') {
    rtFor(state.scene).bossDead = true;
    zoomPulse(e.x, e.y, 'boss');
    state.shake = 0.8;
    setMusic('cave');
    say('Behind the falls, a passage opens.', W - UNIT * 4, H * 0.5 - UNIT * 2, { key: 'falls', life: 5 });
  } else zoomPulse(e.x, e.y, 'kill');
}

function parry(e) {
  const h = state.hero;
  const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
  sfx.clang();
  spark((e.x + h.x) / 2, (e.y + h.y) / 2, '#ffd23a', 12, 5);
  state.shake = 0.15;
  zoomPulse((e.x + h.x) / 2, (e.y + h.y) / 2, 'parry');
  h.vx -= dx / d * 0.25 * L(); h.vy -= dy / d * 0.25 * L();
  h.invuln = Math.max(h.invuln, 0.35);
  if (e.type === 'warden' && e.mode !== 'charge') return;      // blocked, but it shrugs it off
  e.mode = 'stunned';
  e.t = { diver: 1.6, lurker: 1.6, warden: 1.8 }[e.type] || 1.2;
  if (!['diver', 'lurker'].includes(e.type)) { e.vx = dx / d * 0.7 * L(); e.vy = dy / d * 0.7 * L(); }
}

const TOUCHES = {
  stalker: e => ['stalk', 'windup', 'lunge', 'recover'].includes(e.mode),
  charger: e => ['aim', 'charge', 'recover'].includes(e.mode),
  glowworm: e => e.mode === 'crawl' && e.cool <= 0,
  hare: e => e.mode === 'dart',
  warden: e => ['prowl', 'aim', 'charge', 'rear', 'recover'].includes(e.mode),
};

function updateEnemies(dt) {
  const h = state.hero;
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    const dx = h.x - e.x, dy = h.y - e.y, dist = Math.hypot(dx, dy) || 1;
    const ease = (tx, ty, rate) => { const k = 1 - Math.exp(-rate * dt); e.vx += (tx - e.vx) * k; e.vy += (ty - e.vy) * k; };
    e.t -= dt; e.cool -= dt; e.flash -= dt;
    if (e.mode === 'dead') { if (e.t <= 0) state.enemies.splice(i, 1); continue; }
    if (e.mode === 'stunned') { ease(0, 0, 4); if (e.t <= 0) resumeMode(e); }
    else AI[e.type](e, dx, dy, dist, ease, dt);

    if (e.type !== 'lurker') { e.x += e.vx * dt; e.y += e.vy * dt; }
    const ground = !(e.type === 'diver' && e.mode === 'ceiling') && e.type !== 'lurker';
    let bump = false;
    if (ground) bump = collideSolids(e, e.r * 0.85);
    bump = clampTo(e, e.r) || bump;
    if (sceneDef().feat.falls && e.x > W - UNIT * 2.3 - e.r) { e.x = W - UNIT * 2.3 - e.r; bump = true; }
    if (bump && e.mode === 'charge') {
      e.mode = 'stunned'; e.t = e.type === 'warden' ? 2.0 : 1.2;
      state.shake = e.type === 'warden' ? 0.5 : 0.2; sfx.crash();
      zoomPulse(e.x, e.y, e.type === 'warden' ? 'kill' : 'hit');
      spark(e.x, e.y, '#8a7a6a', 10, 3);
    }

    const touch = TOUCHES[e.type];
    if (touch && touch(e) && h.invuln <= 0 && h.z < UNIT * 0.5 && dist < (e.r + UNIT * 0.45) * 0.95) {
      const facing = (-dx * h.fx - dy * h.fy) / dist;
      if (slashActive() && facing > 0.2) parry(e);
      else if (hurtHero(e.dmg, e.x, e.y)) afterHit(e);
    }
  }
}
function afterHit(e) {
  if (e.type === 'stalker' || e.type === 'charger') { e.mode = 'recover'; e.t = 1.1; e.cool = 1.8; e.vx *= -0.3; e.vy *= -0.3; }
  if (e.type === 'hare') { e.mode = 'flee'; e.t = 1.0; e.cool = 2; }
  if (e.type === 'glowworm') e.cool = 1.5;
  if (e.type === 'warden') { e.mode = 'recover'; e.t = 1.0; }
}

const AI = {
  stalker(e, dx, dy, dist, ease) {
    switch (e.mode) {
      case 'sleep':
        if (e.t <= 0) { e.mode = 'stalk'; sfx.growl(); say('Something stirs in the dark', e.x, e.y - UNIT * 1.3, { key: 'wake' }); state.shake = 0.3; zoomPulse(e.x, e.y, 'hit'); }
        break;
      case 'stalk':
        ease(dx / dist * 0.22 * L(), dy / dist * 0.22 * L(), 3);
        if (dist < UNIT * 6 && e.cool <= 0) { e.mode = 'windup'; e.t = 0.45; e.lx = dx / dist; e.ly = dy / dist; sfx.windup(); }
        break;
      case 'windup': ease(0, 0, 10); if (e.t <= 0) { e.mode = 'lunge'; e.t = 0.45; e.vx = e.lx * 0.8 * L(); e.vy = e.ly * 0.8 * L(); } break;
      case 'lunge': if (e.t <= 0) { e.mode = 'recover'; e.t = 0.7; e.cool = 1.4; } break;
      case 'recover': ease(0, 0, 5); if (e.t <= 0) e.mode = 'stalk'; break;
    }
  },
  charger(e, dx, dy, dist, ease) {
    switch (e.mode) {
      case 'sleep': if (e.t <= 0) { e.mode = 'aim'; e.t = 0.9; sfx.growl(); state.shake = 0.3; } break;
      case 'aim':
        ease(0, 0, 8);
        if (e.t > 0.25) { e.lx = dx / dist; e.ly = dy / dist; }
        if (e.t <= 0) { e.mode = 'charge'; e.t = 1.2; e.vx = e.lx * 0.85 * L(); e.vy = e.ly * 0.85 * L(); sfx.snort(); }
        break;
      case 'charge': if (e.t <= 0) { e.mode = 'recover'; e.t = 0.9; } break;
      case 'recover': ease(0, 0, 5); if (e.t <= 0) { e.mode = 'aim'; e.t = 0.9 + Math.random() * 0.6; } break;
    }
  },
  glowworm(e, dx, dy, dist, ease) {
    e.seg += 0.1;
    if (dist < UNIT * 5 && e.cool <= 0) ease(dx / dist * 0.07 * L(), dy / dist * 0.07 * L(), 2);
    else { if (e.t <= 0) { e.t = 2; const a = Math.random() * 6.28; e.lx = Math.cos(a); e.ly = Math.sin(a); } ease(e.lx * 0.03 * L(), e.ly * 0.03 * L(), 2); }
  },
  hare(e, dx, dy, dist, ease) {
    switch (e.mode) {
      case 'idle':
        ease(0, 0, 4);
        if (e.t <= 0) { e.t = rr(0.5, 1.2); const a = Math.random() * 6.28; e.vx = Math.cos(a) * 0.3 * L(); e.vy = Math.sin(a) * 0.3 * L(); }
        if (dist < UNIT * 5 && e.cool <= 0) { e.mode = 'dart'; e.t = 1.1; }
        break;
      case 'dart': {
        const zig = Math.sin(state.time * 14) * 0.7, px = -dy / dist, py = dx / dist;
        ease((dx / dist + px * zig) * 0.6 * L(), (dy / dist + py * zig) * 0.6 * L(), 8);
        if (e.t <= 0) { e.mode = 'flee'; e.t = 0.8; e.cool = 1.5; }
        break;
      }
      case 'flee': ease(-dx / dist * 0.45 * L(), -dy / dist * 0.45 * L(), 6); if (e.t <= 0) { e.mode = 'idle'; e.t = 0.5; } break;
    }
  },
  diver(e, dx, dy, dist, ease, dt) {
    const h = state.hero;
    switch (e.mode) {
      case 'ceiling':
        e.hgt = 1;
        ease(dx / dist * 0.22 * L(), dy / dist * 0.22 * L(), 2);
        if (e.t <= 0 && dist < UNIT * 3) {
          e.mode = 'descend'; e.t = 0.9;
          e.lx = h.x + h.vx * 0.25; e.ly = h.y + h.vy * 0.25;
          e.vx = 0; e.vy = 0; e.parried = false;
          sfx.skitter(panOf(e.x));
        }
        break;
      case 'descend':
        e.x += (e.lx - e.x) * (1 - Math.exp(-10 * dt)); e.y += (e.ly - e.y) * (1 - Math.exp(-10 * dt));
        e.hgt = Math.max(0, e.t / 0.9);
        if (!e.parried && e.t < 0.28 && slashActive() && dist < UNIT * 1.9 && !state.inv.scalp) { e.parried = true; e.hgt = 0; parry(e); break; }
        if (e.t <= 0) {
          e.hgt = 0;
          spark(e.x, e.y, '#4b3558', 8, 3);
          if (dist < UNIT * 1.1 && h.z < UNIT * 0.5) {
            if (state.inv.scalp) {
              sfx.boing(); e.mode = 'stunned'; e.t = 1.6;
              zoomPulse(h.x, h.y, 'parry');
              say('Bonk! The scalp takes it.', h.x, h.y - UNIT * 1.2, { key: 'bonk', life: 1.8 });
              break;
            }
            hurtHero(e.dmg, e.x, e.y);
          }
          e.mode = 'floor'; e.t = 1.3;
        }
        break;
      case 'floor': ease(0, 0, 4); if (e.t <= 0) { e.mode = 'ascend'; e.t = 0.6; } break;
      case 'ascend': e.hgt = 1 - Math.max(0, e.t) / 0.6; ease(0, 0, 6); if (e.t <= 0) { e.mode = 'ceiling'; e.t = rr(2, 3.5); } break;
    }
    if (e.mode === 'stunned') e.hgt = 0;
  },
  lurker(e, dx, dy, dist) {
    const p = e.pool, h = state.hero;
    if (!p) return;
    switch (e.mode) {
      case 'submerged': {
        e.x = p.x; e.y = p.y;
        if (e.cool <= 0 && Math.hypot(h.x - p.x, h.y - p.y) < p.r + UNIT * 2.6) {
          const a = Math.atan2(h.y - p.y, h.x - p.x);
          e.x = p.x + Math.cos(a) * p.r * 0.7; e.y = p.y + Math.sin(a) * p.r * 0.7;
          e.mode = 'ripple'; e.t = 0.8; sfx.bubble();
        }
        break;
      }
      case 'ripple': if (e.t <= 0) { e.mode = 'bite'; e.t = 0.3; e.parried = false; sfx.splash(); spark(e.x, e.y, '#6a8a8a', 10, 3); } break;
      case 'bite':
        if (!e.parried && slashActive() && dist < UNIT * 1.9) { e.parried = true; parry(e); break; }
        if (e.t <= 0) { if (dist < UNIT * 1.5) hurtHero(e.dmg, e.x, e.y); e.mode = 'risen'; e.t = 1.2; }
        break;
      case 'risen': if (e.t <= 0) { e.mode = 'sink'; e.t = 0.4; } break;
      case 'sink': if (e.t <= 0) { e.mode = 'submerged'; e.cool = rr(1.5, 3); } break;
    }
  },
  warden(e, dx, dy, dist, ease) {
    const h = state.hero, fast = e.enraged ? 1.25 : 1;
    switch (e.mode) {
      case 'dormant':
        if (h.x > W * 0.3) {
          e.mode = 'intro'; e.t = 2.2;
          sfx.roar(); state.shake = 0.7; zoomPulse(e.x, e.y, 'boss');
          state.cam.focus = { z: 1.3, at: () => [e.x, e.y] };
          say('The Falls Warden', e.x, e.y - e.r - UNIT * 0.8, { key: 'boss', life: 2.6, size: 1.5, color: '#9fd4ff' });
          setMusic('boss');
        }
        break;
      case 'intro': if (e.t <= 0) { state.cam.focus = null; e.mode = 'prowl'; e.t = 1.2; } break;
      case 'prowl':
        ease(dx / dist * 0.16 * fast * L(), dy / dist * 0.16 * fast * L(), 3);
        if (e.t <= 0) {
          if (dist > UNIT * 5 || Math.random() < 0.5) { e.mode = 'aim'; e.t = 0.8 / fast; sfx.snort(); }
          else { e.mode = 'rear'; e.t = 0.7 / fast; sfx.growl(); }
        }
        break;
      case 'aim':
        ease(0, 0, 8);
        if (e.t > 0.25) { e.lx = dx / dist; e.ly = dy / dist; }
        if (e.t <= 0) { e.mode = 'charge'; e.t = 1.1; e.vx = e.lx * 0.9 * fast * L(); e.vy = e.ly * 0.9 * fast * L(); }
        break;
      case 'charge': if (e.t <= 0) { e.mode = 'recover'; e.t = 0.9; } break;
      case 'rear':
        ease(0, 0, 8);
        if (e.t <= 0) {
          sfx.crash(); state.shake = 0.6; zoomPulse(e.x, e.y, 'kill');
          state.rings.push({ x: e.x, y: e.y, t: 0, dur: 0.9, r0: e.r, r1: e.r + UNIT * 6, hit: false });
          const n = e.enraged ? 5 : 3;
          for (let i = 0; i < n; i++) {
            const a = Math.random() * 6.28, d = i === 0 ? 0 : UNIT * rr(1, 3.2);
            state.hazards.push({ x: Math.max(UNIT, Math.min(W - UNIT * 3, h.x + Math.cos(a) * d)), y: Math.max(UNIT, Math.min(H - UNIT, h.y + Math.sin(a) * d)), t: -i * 0.15, dur: 1.0, r: UNIT * 0.8 });
          }
          e.mode = 'recover'; e.t = 1.1;
        }

// falling rocks and shockwaves from the boss
function updateHazards(dt) {
  const h = state.hero;
  for (let i = state.hazards.length - 1; i >= 0; i--) {
    const z = state.hazards[i];
    z.t += dt;
    if (z.t >= z.dur) {
      state.hazards.splice(i, 1);
      sfx.crash(); spark(z.x, z.y, '#7a6a5a', 8, 3); state.shake = Math.max(state.shake, 0.15);
      if (Math.hypot(h.x - z.x, h.y - z.y) < z.r + UNIT * 0.4 && h.z < UNIT * 0.5) {
        if (state.inv.scalp) { sfx.boing(); say('Bonk! The scalp takes it.', h.x, h.y - UNIT * 1.2, { key: 'bonk', life: 1.8 }); zoomPulse(h.x, h.y, 'parry'); }
        else hurtHero(1, z.x, z.y);

  }
  for (let i = state.rings.length - 1; i >= 0; i--) {
    const g = state.rings[i];

    if (!g.hit && h.dashT <= 0 && h.z < UNIT * 0.3 && Math.abs(Math.hypot(h.x - g.x, h.y - g.y) - rad) < UNIT * 0.45) { g.hit = true; hurtHero(1, g.x, g.y); }
    if (g.t >= g.dur) state.rings.splice(i, 1);

}

// =====================================================================
// Water drips (cave)
// =====================================================================
function updateDrips(dt) {
  state.dripTimer -= dt;
  if (state.dripTimer <= 0) {
    state.dripTimer = 0.5 + Math.random() * 1.8;
    const x = Math.random() * W, landY = H * (0.08 + Math.random() * 0.9);
    state.drops.push({ x, y: landY - H * (0.25 + Math.random() * 0.45), landY, vy: H * 0.2 });
  }
  const g = H * 2.6;
  for (let i = state.drops.length - 1; i >= 0; i--) {
    const d = state.drops[i];
    d.vy += g * dt; d.y += d.vy * dt;
    if (d.y >= d.landY) {
      state.drops.splice(i, 1);
      const bits = Array.from({ length: 3 + (Math.random() * 3 | 0) }, () => {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, sp = UNIT * (1.5 + Math.random() * 2.5);
        return { x: d.x, y: d.landY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
      });
      state.splashes.push({ x: d.x, y: d.landY, t: 0, bits });
      sfx.drip(panOf(d.x));
    }
  }
  for (let i = state.splashes.length - 1; i >= 0; i--) {
    const s = state.splashes[i];
    s.t += dt;
    for (const b of s.bits) { b.vy += UNIT * 14 * dt; b.x += b.vx * dt; b.y += b.vy * dt; }
    if (s.t > 0.7) state.splashes.splice(i, 1);

}

// =====================================================================
// The meadow bird: calls now and then, always flies off when you come near
// =====================================================================
function perchPoint(i) { const p = WORLD.meadow.feat.perches[i]; return [p[0] * W, p[1] * H - UNIT * 1.05]; }
function makeBird() { const i = Math.floor(Math.random() * 3), [x, y] = perchPoint(i); return { mode: 'perch', p: i, x, y, z: 0, vx: 0, vy: 0, t: rr(1.5, 4), gx: 0, gy: 0 }; }

  const b = state.bird;

  const a = Math.atan2(b.y - y, b.x - x) + rr(-0.5, 0.5);

}
function updateBird(dt) {
  const b = state.bird, h = state.hero;
  b.t -= dt;
  if (b.mode === 'perch') {
    if (b.t <= 0) {
      b.t = rr(3, 8);
      sfx.chirp(panOf(b.x));
      state.fx.push({ x: b.x + UNIT * 0.3, y: b.y - UNIT * 0.4, vx: UNIT * 0.4, vy: -UNIT * 0.8, t: 0, life: 1.4, color: 'note' });
    }
    scareBird(h.x, h.y, 3.5);
  } else if (b.mode === 'fly') {
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += UNIT * 4 * dt;
    if (b.z > UNIT * 8 || b.x < -UNIT * 4 || b.x > W + UNIT * 4 || b.y < -UNIT * 6 || b.y > H + UNIT * 4) { b.mode = 'away'; b.t = rr(6, 10); }
  } else if (b.mode === 'away') {
    if (b.t <= 0) {
      b.p = Math.floor(Math.random() * 3);
      const [gx, gy] = perchPoint(b.p);
      if (Math.hypot(h.x - gx, h.y - gy) < UNIT * 4.5) { b.t = 2; return; }
      b.gx = gx; b.gy = gy;
      const side = Math.random() < 0.5 ? -UNIT * 3 : W + UNIT * 3;
      b.x = side; b.y = Math.random() * H * 0.6; b.z = UNIT * 6; b.mode = 'return';
      b.sx = b.x; b.sy = b.y; b.t = 2.2; b.dur = 2.2;

    if (b.t <= 0) { b.mode = 'perch'; b.z = 0; b.t = rr(1, 3); sfx.chirp(panOf(b.x)); }
  }
}

// floating text timers
function updateTexts(dt) {

// =====================================================================
// Drawing

  ctx.translate(W / 2, H / 2); ctx.scale(c.ez, c.ez); ctx.translate(-c.ex, -c.ey);

// ---------- hero ----------
function drawHero() {
  const h = state.hero;
  if (h.falling > 0) {
    const k = h.falling / 0.8;
    ctx.fillStyle = '#f5d06f';
    const s = UNIT * k;
    ctx.fillRect(h.x - s / 2, h.y - s / 2 + (1 - k) * UNIT, s, s);
    return;
  }

  const pw = UNIT * (1 + stretch * Math.abs(h.vx) / (sp || 1));
  const ph = UNIT * (1 + stretch * Math.abs(h.vy) / (sp || 1));

  ctx.beginPath(); ctx.ellipse(h.x + 2, h.y + ph * 0.45, pw * 0.55 * sh, pw * 0.2 * sh, 0, 0, 6.28); ctx.fill();

    ctx.fillStyle = `rgba(255,240,180,${0.35 + 0.25 * Math.sin(state.time * 30)})`;
    ctx.fillRect(h.x - pw / 2 - 3, y - ph / 2 - 3, pw + 6, ph + 6);

    ctx.save(); ctx.translate(h.x, y); ctx.rotate(state.time * 0.8);

    ctx.restore();
  }
  ctx.fillStyle = h.stun > 0 ? '#ffffff' : '#f5d06f';
  ctx.fillRect(h.x - pw / 2, y - ph / 2, pw, ph);
