    ctx.rotate(ang); ctx.translate(UNIT * 0.5, 0);
    drawBlade(UNIT * 1.15, UNIT * 0.12);
    ctx.fillStyle = hilt; ctx.fillRect(-UNIT * 0.06, -UNIT * 0.2, UNIT * 0.08, UNIT * 0.4);
  } else {
    const ext = Math.sin(p * Math.PI);
    ctx.rotate(ab); ctx.translate(UNIT * (0.4 + ext * 0.7), 0);
    drawBlade(UNIT * 1.2, UNIT * 0.12);
    ctx.fillStyle = hilt; ctx.fillRect(-UNIT * 0.06, -UNIT * 0.2, UNIT * 0.08, UNIT * 0.4);
    ctx.strokeStyle = `rgba(255,250,230,${0.5 * ext})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(UNIT * 0.2, 0); ctx.lineTo(UNIT * (1.4 + ext * 0.8), 0); ctx.stroke();
  }
  ctx.restore();
}

// ---------- pullables ----------
function drawPullables(sc) {
  const rt = rtFor(sc.id);
  for (const pl of sc.pullables) {
    const x = pl.fx * W, y = pl.fy * H, done = rt.pulled.has(pl.id);
    const p = state.pull.id === pl.id ? state.pull : null;
    const tilt = p ? p.tilt + (p.grip ? Math.sin(state.time * 60) * 0.02 : 0) : 0;
    if (pl.kind === 'turnip') {
      ctx.fillStyle = '#5a4028'; ctx.beginPath(); ctx.ellipse(x, y + UNIT * 0.1, UNIT * 0.5, UNIT * 0.22, 0, 0, 6.28); ctx.fill();
      if (done) continue;
      ctx.save(); ctx.translate(x, y + UNIT * 0.05); ctx.rotate(tilt);
      ctx.fillStyle = '#9b4f9e'; ctx.beginPath(); ctx.arc(0, 0, UNIT * 0.26, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#5aa04a';
      for (const a of [-0.45, 0, 0.45]) { ctx.save(); ctx.rotate(a); ctx.fillRect(-UNIT * 0.05, -UNIT * 0.75, UNIT * 0.1, UNIT * 0.55); ctx.beginPath(); ctx.ellipse(0, -UNIT * 0.75, UNIT * 0.14, UNIT * 0.22, 0, 0, 6.28); ctx.fill(); ctx.restore(); }
      ctx.restore();
    } else {
      if (done) { ctx.fillStyle = '#3a2614'; ctx.fillRect(x - UNIT * 0.08, y - UNIT * 0.14, UNIT * 0.16, UNIT * 0.06); continue; }
      ctx.save(); ctx.translate(x, y - UNIT * 0.1); ctx.rotate(tilt);
      ctx.fillStyle = '#8a5a3a'; ctx.fillRect(-UNIT * 0.07, -UNIT * 0.9, UNIT * 0.14, UNIT * 0.9);
      ctx.fillStyle = '#a4683f'; ctx.fillRect(-UNIT * 0.07, -UNIT * 0.6, UNIT * 0.06, UNIT * 0.2);
      ctx.fillStyle = '#5b3b22'; ctx.fillRect(-UNIT * 0.26, -UNIT * 1.0, UNIT * 0.52, UNIT * 0.1);
      ctx.fillStyle = '#4a2f1a'; ctx.fillRect(-UNIT * 0.06, -UNIT * 1.35, UNIT * 0.12, UNIT * 0.35);
      ctx.fillStyle = '#6b4a2b'; ctx.beginPath(); ctx.arc(0, -UNIT * 1.38, UNIT * 0.09, 0, 6.28); ctx.fill();
      ctx.restore();
    }
  }
}

// ---------- areas ----------
function drawForest(sc) {
  ctx.fillStyle = sc.floor; ctx.fillRect(0, 0, W, H);
  for (const d of sc.deco) {
    if (d.kind === 'flower') { ctx.fillStyle = d.c; ctx.fillRect(d.fx * W, d.fy * H, 3, 3); }
    if (d.kind === 'grass') { ctx.strokeStyle = '#357a40'; ctx.lineWidth = 1.5; const x = d.fx * W, y = d.fy * H, s = UNIT * 0.3 * d.s; ctx.beginPath(); ctx.moveTo(x - s * 0.4, y); ctx.lineTo(x - s * 0.6, y - s); ctx.moveTo(x, y); ctx.lineTo(x, y - s * 1.2); ctx.moveTo(x + s * 0.4, y); ctx.lineTo(x + s * 0.6, y - s); ctx.stroke(); }
  }
  drawTreeShadows();
  if (sc.feat.stone) {
    const g = sc.feat.stone, s = UNIT * (1 + 0.06 * Math.sin(state.time * 3));
    ctx.fillStyle = '#6fc3f5'; ctx.fillRect(g[0] * W - s / 2, g[1] * H - s / 2, s, s);
  }
  for (const s of state.solids) drawSolid(s);
  drawPullables(sc);
  drawItems();
  drawHero();
  if (state.bird) drawBird();
  for (const s of state.solids) drawCanopy(s);
  drawFx();
}

function drawField(sc) {
  const depth = sc.depth;
  ctx.fillStyle = sc.floor; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {                   // rolling swells
    const y = H * (i / 4) + Math.sin(i * 1.7) * UNIT;
    const g = ctx.createLinearGradient(0, y - UNIT * 3, 0, y + UNIT * 3);
    g.addColorStop(0, 'rgba(255,255,200,0)'); g.addColorStop(0.5, i % 2 ? 'rgba(255,250,190,.10)' : 'rgba(30,50,20,.12)'); g.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - UNIT * 3, W, UNIT * 6);
  }
  const f = sc.feat;
  if (f.ravine) {
    const y0 = f.ravine[0] * H, y1 = f.ravine[1] * H;
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, '#2a2418'); g.addColorStop(0.5, '#07060a'); g.addColorStop(1, '#1d1a14');
    ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0);
    ctx.fillStyle = '#5e6b3a';
    for (let x = 0; x < W; x += UNIT * 0.6) {
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + UNIT * 0.3, y0 + UNIT * (0.2 + 0.2 * Math.sin(x))); ctx.lineTo(x + UNIT * 0.6, y0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x + UNIT * 0.3, y1 - UNIT * (0.2 + 0.2 * Math.cos(x))); ctx.lineTo(x + UNIT * 0.6, y1); ctx.fill();
    }
    for (const u of f.updrafts) {
      const ux = u[0] * W, uy = u[1] * H, on = state.gust;
      ctx.strokeStyle = `rgba(230,240,200,${0.25 + on * 0.55})`; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(ux, uy, UNIT * (0.5 + i * 0.35), UNIT * (0.2 + i * 0.12), 0, state.time * (2 + i) + i, state.time * (2 + i) + i + 4); ctx.stroke(); }
      if (Math.random() < 0.15 + on * 0.6) state.fx.push({ x: ux + (Math.random() - 0.5) * UNIT * 1.4, y: uy, vx: (Math.random() - 0.5) * UNIT, vy: -UNIT * (1 + on * 3), t: 0, life: 0.9, color: 'leaf', spin: Math.random() * 6 });
    }
    if (!rtFor(sc.id).heartTaken) drawItemIcon('maxheart', f.heart[0] * W, f.heart[1] * H + Math.sin(state.time * 3) * 3, UNIT * 0.9);
  }
  const bend = (sc.wind.dir) * (0.25 + state.gust * 0.9);
  ctx.strokeStyle = depth > 4 ? '#6d7f3e' : '#5f8a3a'; ctx.lineWidth = 1.6;
  for (const d of sc.deco) {
    const x = d.fx * W, y = d.fy * H, s = UNIT * 0.45 * d.s, sw = bend + Math.sin(state.time * 3 + d.ph) * 0.15;
    ctx.beginPath();
    for (const o of [-0.35, 0, 0.35]) { ctx.moveTo(x + o * s, y); ctx.quadraticCurveTo(x + o * s + sw * s * 0.3, y - s * 0.6, x + o * s + sw * s, y - s); }
    ctx.stroke();
  }
  for (const s of state.solids) drawSolid(s);
  drawItems();
  for (const e of state.enemies) drawEnemy(e);
  drawEyesDaylight();
  drawHero();
  drawFx();
  for (const c of state.clouds) {                 // passing cloud shadows
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    g.addColorStop(0, `rgba(20,25,35,${0.12 + depth * 0.02})`); g.addColorStop(1, 'rgba(20,25,35,0)');
    ctx.fillStyle = g; ctx.fillRect(c.x - c.r, c.y - c.r, c.r * 2, c.r * 2);
  }
  ctx.fillStyle = `rgba(40,50,70,${0.03 * depth})`; ctx.fillRect(0, 0, W, H);
}

function drawCave(sc) {
  const h = state.hero, rt = rtFor(sc.id);
  ctx.fillStyle = sc.floor; ctx.fillRect(0, 0, W, H);
  for (const r of sc.deco) {
    ctx.fillStyle = r.shade > 0.5 ? '#26222c' : '#15131a';
    ctx.beginPath(); ctx.ellipse(r.fx * W, r.fy * H, UNIT * r.s * 0.7, UNIT * r.s * 0.42, 0, 0, 6.28); ctx.fill();
  }
  if (sc.feat.falls) drawFalls(rt.bossDead);
  for (const s of state.solids) drawSolid(s);
  drawItems();
  for (const z of state.hazards) {                // shadows of falling rocks
    const k = Math.max(0, z.t / z.dur);
    ctx.fillStyle = `rgba(0,0,0,${0.2 + k * 0.4})`;
    ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r * k, z.r * 0.5 * k, 0, 0, 6.28); ctx.fill();
  }
  for (const e of state.enemies) drawEnemy(e);
  drawHero();
  for (const z of state.hazards) {
    const k = Math.max(0, z.t / z.dur); if (k <= 0) continue;
    const yy = z.y - (1 - k) * H * 0.6;
    ctx.fillStyle = '#5a5248'; ctx.beginPath(); ctx.ellipse(z.x, yy, z.r * 0.7, z.r * 0.55, 0, 0, 6.28); ctx.fill();
  }
  for (const g of state.rings) {
    const rad = g.r0 + (g.r1 - g.r0) * (g.t / g.dur);
    ctx.strokeStyle = `rgba(200,190,170,${0.7 * (1 - g.t / g.dur)})`; ctx.lineWidth = UNIT * 0.3;
    ctx.beginPath(); ctx.ellipse(g.x, g.y, rad, rad * 0.8, 0, 0, 6.28); ctx.stroke();
  }
  drawDiverThreads();

  // lighting: darkness with holes for each light source
  lctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, W, H);
  lctx.fillStyle = 'rgba(4,2,8,0.96)'; lctx.fillRect(0, 0, W, H);
  lctx.globalCompositeOperation = 'destination-out';
  const flicker = 1 + 0.03 * Math.sin(state.time * 11) + 0.02 * Math.sin(state.time * 23);
  const light = (x, y, r, a = 1) => {
    const g = lctx.createRadialGradient(x, y, r * 0.2, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  light(h.x, h.y - h.z, UNIT * 5.5 * flicker * (1 + 0.8 * state.inv.glow / 45));
  for (const e of state.enemies) if (e.type === 'glowworm' && !e.dead) light(e.x, e.y, UNIT * 2.2, 0.8);
  for (const it of state.items) light(it.x, it.y, UNIT * 1.3, 0.7);
  for (const ex of sc.exits) {
    const c = (ex.a + ex.b) / 2, [px, py] = edgePoint(ex.side, c);
    if (!(ex.locked && ex.locked())) light(px * W, py * H, UNIT * 3, 0.5);
  }
  if (sc.feat.falls) for (let y = 0; y < H; y += UNIT * 2) light(W - UNIT, y, UNIT * 4, 0.55);
  if (!sceneDef().exits.some(e => e.side === 'w')) light(0, H * 0.5, UNIT * 2.5, 0.3);
  ctx.drawImage(lightCv, 0, 0, W, H);

  drawDrips();
  for (const e of state.enemies) drawEnemyEyes(e);
  drawFx();
}

function drawFalls(open) {
  const x0 = W - UNIT * 2.3;
  ctx.fillStyle = '#3d6680'; ctx.fillRect(x0, 0, W - x0, H);
  ctx.strokeStyle = 'rgba(210,235,255,.45)'; ctx.lineWidth = 2;
  for (let i = 0; i < 16; i++) {
    const x = x0 + (i / 16) * (W - x0) + 3, off = (state.time * UNIT * 9 + i * 57) % (UNIT * 3);
    for (let y = -UNIT * 3 + off; y < H; y += UNIT * 3) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + UNIT * 1.4); ctx.stroke(); }
  }
  const g = ctx.createLinearGradient(x0 - UNIT * 3, 0, x0, 0);
  g.addColorStop(0, 'rgba(200,225,240,0)'); g.addColorStop(1, 'rgba(200,225,240,.3)');
  ctx.fillStyle = g; ctx.fillRect(x0 - UNIT * 3, 0, UNIT * 3, H);
  if (open) {
    const ex = sceneDef().exits.find(e => e.side === 'e');
    ctx.fillStyle = '#0c1014';
    ctx.beginPath(); ctx.ellipse(W - UNIT * 0.6, (ex.a + ex.b) / 2 * H, UNIT * 1.6, (ex.b - ex.a) / 2 * H, 0, 0, 6.28); ctx.fill();
  }
  if (Math.random() < 0.4) state.fx.push({ x: x0 + Math.random() * UNIT, y: Math.random() * H, vx: -UNIT * (1 + Math.random() * 2), vy: (Math.random() - 0.5) * UNIT, t: 0, life: 1.2, color: 'rgba(220,240,255,.5)', size: UNIT * 0.25 });
}

function drawMarsh(sc) {
  ctx.fillStyle = sc.floor; ctx.fillRect(0, 0, W, H);
  for (const p of state.pools) {
    ctx.fillStyle = '#1c2a24'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.7, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,160,.25)'; ctx.lineWidth = 1.5;
    const k = (state.time * 0.4 + p.x) % 1;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 0.5 * (0.5 + k), p.r * 0.35 * (0.5 + k), 0, 0, 6.28); ctx.stroke();
    ctx.fillStyle = '#4c6b3a'; ctx.beginPath(); ctx.ellipse(p.x - p.r * 0.4, p.y + p.r * 0.2, UNIT * 0.3, UNIT * 0.2, 0, 0.3, 6); ctx.fill();
  }
  ctx.strokeStyle = '#6b7a40'; ctx.lineWidth = 2;
  for (const d of sc.deco) {
    const x = d.fx * W, y = d.fy * H, s = UNIT * 0.7 * d.s, sw = Math.sin(state.time * 1.5 + d.ph) * s * 0.1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sw, y - s); ctx.moveTo(x + 4, y); ctx.lineTo(x + 4 + sw, y - s * 0.8); ctx.stroke();
    ctx.fillStyle = '#5a3a22'; ctx.fillRect(x + sw - 2, y - s - 4, 4, 8);
  }
  drawTreeShadows();
  if (sc.feat.lantern) {
    const [lx, ly] = [sc.feat.lantern[0] * W, sc.feat.lantern[1] * H];
    const g = ctx.createRadialGradient(lx, ly - UNIT, 0, lx, ly - UNIT, UNIT * 3);
    g.addColorStop(0, 'rgba(255,200,110,.5)'); g.addColorStop(1, 'rgba(255,200,110,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - UNIT * 3, ly - UNIT * 4, UNIT * 6, UNIT * 6);
    ctx.fillStyle = '#3a2a1a'; ctx.fillRect(lx - 3, ly - UNIT * 1.4, 6, UNIT * 1.6);
    ctx.fillStyle = '#ffd27a'; ctx.fillRect(lx - UNIT * 0.2, ly - UNIT * 1.7, UNIT * 0.4, UNIT * 0.4);
  }
  drawItems();
  for (const e of state.enemies) drawEnemy(e);
  drawEyesDaylight();
  drawHero();
  for (const s of state.solids) drawCanopy(s);
  drawFx();
  for (let i = 0; i < 5; i++) {                   // drifting fog
    const x = ((state.time * 12 + i * 300) % (W + 400)) - 200, y = H * (0.15 + i * 0.18);
    const g = ctx.createRadialGradient(x, y, 0, x, y, UNIT * 6);
    g.addColorStop(0, 'rgba(200,210,190,.13)'); g.addColorStop(1, 'rgba(200,210,190,0)');
    ctx.fillStyle = g; ctx.fillRect(x - UNIT * 6, y - UNIT * 6, UNIT * 12, UNIT * 12);
  }
  for (let i = 0; i < 12; i++) {                  // fireflies
    const x = (Math.sin(state.time * 0.3 + i * 2.1) * 0.5 + 0.5) * W, y = (Math.cos(state.time * 0.23 + i * 1.3) * 0.5 + 0.5) * H;
    ctx.fillStyle = `rgba(230,255,140,${0.4 + 0.4 * Math.sin(state.time * 3 + i)})`; ctx.fillRect(x, y, 3, 3);
  }
}

// ---------- enemies ----------
function drawEnemy(e) {
  const alpha = e.mode === 'dead' ? Math.max(0, e.t / 0.9) : 1;
  const scale = e.mode === 'dead' ? 0.5 + 0.5 * alpha : 1;
  const white = e.flash > 0;
  ctx.save(); ctx.globalAlpha = alpha;
  const C = (c) => white ? '#fff' : c;
  switch (e.type) {
    case 'stalker': {
      const bs = UNIT * 1.4 * scale * (e.mode === 'windup' ? 1.12 : 1);
      ctx.fillStyle = C('#4a1414'); ctx.fillRect(e.x - bs / 2, e.y - bs / 2, bs, bs);
      for (const s of [-1, 1]) {                  // ears, the same ones the scalp keeps
        ctx.fillStyle = C('#4a1414'); ctx.beginPath(); ctx.moveTo(e.x + s * bs * 0.2, e.y - bs / 2); ctx.lineTo(e.x + s * bs * 0.48, e.y - bs * 0.95); ctx.lineTo(e.x + s * bs * 0.5, e.y - bs / 2); ctx.fill();
        ctx.fillStyle = C('#b8736a'); ctx.beginPath(); ctx.moveTo(e.x + s * bs * 0.28, e.y - bs / 2); ctx.lineTo(e.x + s * bs * 0.45, e.y - bs * 0.82); ctx.lineTo(e.x + s * bs * 0.46, e.y - bs / 2); ctx.fill();
      }
      ctx.fillStyle = C('#2a0b0b');
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(e.x + i * bs * 0.14 - bs * 0.06, e.y - bs / 2); ctx.lineTo(e.x + i * bs * 0.14, e.y - bs * 0.72); ctx.lineTo(e.x + i * bs * 0.14 + bs * 0.06, e.y - bs / 2); ctx.fill(); }
      break;
    }
    case 'charger': {
      const bw = UNIT * 1.6 * scale, bh = UNIT * 1.25 * scale;
      ctx.fillStyle = C('#3b2a18'); ctx.fillRect(e.x - bw / 2, e.y - bh / 2, bw, bh);
      ctx.fillStyle = C('#e6dcc0');
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(e.x + s * bw * 0.3, e.y - bh / 2); ctx.lineTo(e.x + s * bw * 0.62, e.y - bh / 2 - bh * 0.45); ctx.lineTo(e.x + s * bw * 0.45, e.y - bh / 2); ctx.fill(); }
      if (e.mode === 'aim' && Math.random() < 0.3) spark(e.x - e.lx * bw * 0.6, e.y + bh * 0.4, '#5a4a3a', 1, 1.2);
      break;
    }
    case 'glowworm': {
      for (let i = 3; i >= 0; i--) {
        const ox = Math.cos(e.seg + i * 0.8) * UNIT * 0.1 - i * UNIT * 0.22 * Math.sign(e.vx || 1), oy = Math.sin(e.seg * 1.3 + i) * UNIT * 0.08;
        ctx.fillStyle = C(i === 0 ? '#d8f58a' : '#9ec65a'); ctx.beginPath(); ctx.arc(e.x + ox, e.y + oy, e.r * (1 - i * 0.15), 0, 6.28); ctx.fill();
      }
      break;
    }
    case 'hare': {
      const hop = e.mode === 'idle' ? Math.abs(Math.sin(state.time * 8)) * UNIT * 0.15 : Math.abs(Math.sin(state.time * 16)) * UNIT * 0.25;
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.8, e.r, e.r * 0.3, 0, 0, 6.28); ctx.fill();
      const y = e.y - hop;
      ctx.fillStyle = C('#a88a60'); ctx.beginPath(); ctx.ellipse(e.x, y, e.r, e.r * 0.8, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = C('#8a6e48');
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(e.x + s * e.r * 0.3, y - e.r * 1.1, e.r * 0.18, e.r * 0.55, s * 0.2, 0, 6.28); ctx.fill(); }
      ctx.fillStyle = C('#f2eee4'); ctx.beginPath(); ctx.arc(e.x - Math.sign(e.vx || 1) * e.r * 0.9, y, e.r * 0.25, 0, 6.28); ctx.fill();
      ctx.fillStyle = e.mode === 'dart' ? '#ff5a3a' : '#1a1410';
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(e.x + s * e.r * 0.3, y - e.r * 0.2, UNIT * 0.06, 0, 6.28); ctx.fill(); }
      break;
    }
    case 'diver': {
      const hgt = e.hgt || 0, y = e.y - hgt * UNIT * 6;
      if (e.mode !== 'ceiling') {
        const k = 1 - hgt;
        ctx.fillStyle = `rgba(0,0,0,${0.15 + 0.35 * k})`; ctx.beginPath(); ctx.ellipse(e.x, e.y + UNIT * 0.2, e.r * (0.4 + k * 0.8), e.r * (0.2 + k * 0.35), 0, 0, 6.28); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r * 0.4, e.r * 0.2, 0, 0, 6.28); ctx.fill();
        break;
      }
      const r = e.r * scale;
      ctx.strokeStyle = C('#2a1c33'); ctx.lineWidth = Math.max(1.5, UNIT * 0.06);
      for (let i = 0; i < 4; i++) for (const s of [-1, 1]) {
        const a = (i - 1.5) * 0.45, wig = Math.sin(state.time * 12 + i) * 0.1;
        ctx.beginPath(); ctx.moveTo(e.x, y); ctx.lineTo(e.x + s * r * 1.2 * Math.cos(a + wig), y + r * 0.9 * Math.sin(a + wig) - r * 0.3); ctx.lineTo(e.x + s * r * 1.5, y + r * (0.3 + i * 0.2)); ctx.stroke();
      }
      ctx.fillStyle = C('#4b3558'); ctx.beginPath(); ctx.ellipse(e.x, y, r * 0.7, r * 0.6, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = C('#362640'); ctx.beginPath(); ctx.ellipse(e.x, y + r * 0.5, r * 0.5, r * 0.4, 0, 0, 6.28); ctx.fill();
      break;
    }
    case 'lurker': {
      const p = e.pool; if (!p) break;
      if (e.mode === 'submerged' || e.mode === 'ripple') {
        const k = e.mode === 'ripple' ? 1 - e.t / 0.8 : 0.2;
        ctx.strokeStyle = `rgba(170,200,190,${0.2 + k * 0.5})`; ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) { const rr_ = UNIT * (0.3 + i * 0.3) * (0.6 + k); ctx.beginPath(); ctx.ellipse(e.x, e.y, rr_, rr_ * 0.6, 0, 0, 6.28); ctx.stroke(); }
        if (Math.random() < 0.05 + k * 0.3) state.fx.push({ x: e.x + (Math.random() - 0.5) * UNIT, y: e.y, vx: 0, vy: -UNIT * 0.5, t: 0, life: 0.4, color: 'rgba(200,230,220,.6)' });
        break;
      }
      const rise = e.mode === 'bite' ? 1 - Math.max(0, e.t) / 0.3 : e.mode === 'sink' ? Math.max(0, e.t) / 0.4 : 1;
      const r = e.r * scale * (0.4 + 0.6 * rise), y = e.y - UNIT * 0.3 * rise;
      ctx.fillStyle = C('#2f4a3e'); ctx.beginPath(); ctx.ellipse(e.x, y, r, r * 1.1, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = C('#4d6d52');
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(e.x + s * r * 0.8, y); ctx.lineTo(e.x + s * r * 1.5, y - r * 0.3); ctx.lineTo(e.x + s * r * 0.9, y + r * 0.4); ctx.fill(); }
      ctx.fillStyle = C('#d8e0c8');
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(e.x + i * r * 0.22 - r * 0.08, y + r * 0.3); ctx.lineTo(e.x + i * r * 0.22, y + r * 0.6); ctx.lineTo(e.x + i * r * 0.22 + r * 0.08, y + r * 0.3); ctx.fill(); }
      ctx.fillStyle = '#e9ff6a'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(e.x + s * r * 0.35, y - r * 0.3, UNIT * 0.08, 0, 6.28); ctx.fill(); }
      break;
    }
    case 'warden': {
      if (e.mode === 'dormant') { ctx.globalAlpha = 0.85; }
      const rear = e.mode === 'rear' ? 1 + 0.15 * (1 - e.t / 0.7) : 1;
      const bw = UNIT * 2.8 * scale * rear, bh = UNIT * 2.2 * scale * rear;
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + bh * 0.45, bw * 0.55, bh * 0.2, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = C('#3a4c4a'); ctx.beginPath(); ctx.ellipse(e.x, e.y, bw / 2, bh / 2, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = C('#4f6b3e');
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(e.x + (i - 2) * bw * 0.18, e.y - bh * 0.32 + Math.abs(i - 2) * bh * 0.06, bw * 0.12, bh * 0.1, 0, 0, 6.28); ctx.fill(); }
      ctx.fillStyle = C('#e9e2d0');
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(e.x + s * bw * 0.18, e.y + bh * 0.15); ctx.quadraticCurveTo(e.x + s * bw * 0.36, e.y + bh * 0.3, e.x + s * bw * 0.3, e.y - bh * 0.05); ctx.lineTo(e.x + s * bw * 0.22, e.y + bh * 0.08); ctx.fill(); }
      break;
    }
  }
  ctx.restore();
}
function drawDiverThreads() {
  for (const e of state.enemies) if (e.type === 'diver' && e.mode !== 'ceiling' && e.mode !== 'dead') {
    const y = e.y - (e.hgt || 0) * UNIT * 6;
    ctx.strokeStyle = 'rgba(210,210,230,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(e.x, y); ctx.lineTo(e.x, -10); ctx.stroke();
  }
}
function drawEnemyEyes(e) {
  if (e.mode === 'dead') return;
  const h = state.hero, look = Math.atan2(h.y - e.y, h.x - e.x);
  const ox = Math.cos(look) * UNIT * 0.1, oy = Math.sin(look) * UNIT * 0.08;
  const glow = (col, pts, r) => { ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = UNIT * 0.6; for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill(); } ctx.shadowBlur = 0; };
  if (e.type === 'stalker' || e.type === 'charger') {
    const eyeY = e.y - UNIT * 0.2, d = UNIT * 0.28;
    if (e.mode === 'sleep') { ctx.fillStyle = 'rgba(255,60,40,.35)'; for (const s of [-1, 1]) ctx.fillRect(e.x + s * d - UNIT * 0.1, eyeY, UNIT * 0.2, UNIT * 0.04); }
    else {
      const warn = e.mode === 'windup' || e.mode === 'aim';
      glow(warn ? '#ffd23a' : e.type === 'charger' ? '#ff8a2a' : '#ff3b2a', [[e.x - d + ox, eyeY + oy], [e.x + d + ox, eyeY + oy]], UNIT * (warn ? 0.13 : 0.09));
    }
  }
  if (e.type === 'diver') {
    const y = e.y - (e.hgt || 0) * UNIT * 6;
    if (e.mode === 'ceiling') {                   // tiny glints up in the dark
      if (Math.sin(state.time * 2 + e.idx) > 0.6) glow('rgba(200,150,255,.6)', [[e.x - 4, e.y - UNIT * 0.2], [e.x + 4, e.y - UNIT * 0.2]], 1.5);
    } else glow('#c89bff', [[e.x - UNIT * 0.15, y - UNIT * 0.1], [e.x + UNIT * 0.15, y - UNIT * 0.1], [e.x - UNIT * 0.06, y - UNIT * 0.2], [e.x + UNIT * 0.06, y - UNIT * 0.2]], UNIT * 0.05);
  }
  if (e.type === 'warden' && e.mode !== 'dormant') {
    const warn = e.mode === 'aim' || e.mode === 'rear';
    glow(warn ? '#e8f8ff' : '#6fc3f5', [[e.x - UNIT * 0.45 + ox, e.y - UNIT * 0.3 + oy], [e.x + UNIT * 0.45 + ox, e.y - UNIT * 0.3 + oy]], UNIT * (warn ? 0.16 : 0.12));
  }
  if (e.mode === 'stunned') {
    ctx.fillStyle = '#ffe36a';
    for (let i = 0; i < 3; i++) { const a = state.time * 6 + i * 2.1; ctx.fillRect(e.x + Math.cos(a) * UNIT * 0.5 - 2, e.y - e.r - UNIT * 0.4 + Math.sin(a) * UNIT * 0.15 - 2, 4, 4); }
  }
}
function drawEyesDaylight() { for (const e of state.enemies) if (e.mode === 'stunned') drawEnemyEyes(e); }

// ---------- bird ----------
function drawBird() {
  const b = state.bird;
  if (b.mode === 'away') return;
  const s = UNIT * 0.35 * (1 + b.z / (UNIT * 4));
  const y = b.y - b.z;
  if (b.z > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.max(0.05, 0.2 - b.z / (UNIT * 40))})`; ctx.beginPath(); ctx.ellipse(b.x, b.y + UNIT, s * 0.6, s * 0.25, 0, 0, 6.28); ctx.fill(); }
  ctx.fillStyle = '#8a4a2a';
  if (b.mode === 'perch') {
    const bob = Math.sin(state.time * 5) * 1.5;
    ctx.beginPath(); ctx.ellipse(b.x, b.y + bob, s * 0.55, s * 0.45, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#d86a3a'; ctx.beginPath(); ctx.ellipse(b.x + s * 0.1, b.y + bob + s * 0.1, s * 0.3, s * 0.25, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#5a3a22'; ctx.fillRect(b.x - s * 0.8, b.y + bob - s * 0.1, s * 0.35, s * 0.15);
    ctx.fillStyle = '#e8c04a'; ctx.beginPath(); ctx.moveTo(b.x + s * 0.5, b.y + bob - s * 0.1); ctx.lineTo(b.x + s * 0.8, b.y + bob); ctx.lineTo(b.x + s * 0.5, b.y + bob + s * 0.05); ctx.fill();
  } else {
    const flap = Math.sin(state.time * 30) * s * 0.8;
    ctx.beginPath(); ctx.ellipse(b.x, y, s * 0.4, s * 0.3, 0, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x, y); ctx.lineTo(b.x - s * 1.2, y - flap); ctx.lineTo(b.x - s * 0.3, y + s * 0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x, y); ctx.lineTo(b.x + s * 1.2, y - flap); ctx.lineTo(b.x + s * 0.3, y + s * 0.1); ctx.fill();
  }
}

// ---------- particles, drips ----------
function drawFx() {
  for (const p of state.fx) {
    const a = Math.max(0, 1 - p.t / p.life);
    if (p.color === 'streak') {
      ctx.strokeStyle = `rgba(240,245,230,${0.18 * a})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.sign(p.vx) * p.size * 2, p.y); ctx.stroke();
    } else if (p.color === 'leaf') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin + p.t * 6); ctx.globalAlpha = a;
      ctx.fillStyle = '#9aa84a'; ctx.fillRect(-UNIT * 0.12, -UNIT * 0.05, UNIT * 0.24, UNIT * 0.1); ctx.restore();
    } else if (p.color === 'note') {
      ctx.globalAlpha = a; ctx.fillStyle = '#fdf6e3'; ctx.font = `${Math.round(UNIT * 0.5)}px serif`; ctx.fillText('\u266A', p.x, p.y);
    } else if (p.life > 0) {
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      const s = p.size || Math.max(2, UNIT * 0.08);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}
function drawDrips() {
  const h = state.hero, reach = UNIT * 6;
  const lit = (x, y) => 0.3 + 0.7 * Math.max(0, 1 - Math.hypot(x - h.x, y - h.y) / reach);
  ctx.lineCap = 'round';
  for (const d of state.drops) {
    const len = Math.min(UNIT * 0.9, d.vy * 0.03);
    ctx.strokeStyle = `rgba(170,205,230,${0.8 * lit(d.x, d.y)})`; ctx.lineWidth = Math.max(1, UNIT * 0.05);
    ctx.beginPath(); ctx.moveTo(d.x, d.y - len); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
  for (const s of state.splashes) {
    const k = s.t / 0.7, a = (1 - k) * lit(s.x, s.y);
    ctx.strokeStyle = `rgba(170,205,230,${0.7 * a})`; ctx.lineWidth = Math.max(1, UNIT * 0.04);
    ctx.beginPath(); ctx.ellipse(s.x, s.y, UNIT * 0.7 * k + 1, UNIT * 0.25 * k + 0.5, 0, 0, 6.28); ctx.stroke();
    ctx.fillStyle = `rgba(190,220,240,${0.9 * a})`;
    const r = Math.max(1, UNIT * 0.05);
    for (const b of s.bits) if (b.y <= s.y + 1) ctx.fillRect(b.x - r / 2, b.y - r / 2, r, r);
  }
  ctx.lineCap = 'butt';
}

// ---------- screen space: HUD, floating text, titles ----------
function drawHUD() {
  if (!state.started) return;
  const h = state.hero, inv = state.inv, s = Math.min(24, UNIT * 0.6);
  let x = 14 + s / 2, y = 14 + s / 2;
  for (let i = 0; i < h.maxHp; i++) {
    heartPath(x + i * (s + 4), y, s);
    ctx.fillStyle = i < h.hp ? '#e03a3a' : 'rgba(0,0,0,.35)'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  y += s + 10;
  const slot = (type, label, bar) => {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - s * 0.6, y - s * 0.6, s * 1.2, s * 1.2);
    drawItemIcon(type, x, y, s * 0.8);
    if (label) { ctx.font = `bold ${Math.round(s * 0.45)}px "Courier New", monospace`; ctx.fillStyle = '#fdf6e3'; ctx.textAlign = 'center'; ctx.fillText(label, x, y + s * 0.95); ctx.textAlign = 'left'; }
    if (bar != null) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - s * 0.55, y + s * 0.62, s * 1.1, 4); ctx.fillStyle = '#c9f27a'; ctx.fillRect(x - s * 0.55, y + s * 0.62, s * 1.1 * bar, 4); }
    x += s * 1.5;
  };
  if (inv.scalp) slot('scalp');
  if (inv.horn) slot('horn');
  if (inv.wing) slot('wing', K.dash);
  if (inv.food.length) { const top = inv.food.includes('haunch') ? 'haunch' : 'turnip'; slot(top, `${K.eat} x${inv.food.length}`); }
  if (inv.glow > 0) slot('glow', null, inv.glow / 45);
  if (inv.slime > 0) slot('slime', null, inv.slime / 25);

  const boss = state.enemies.find(e => e.type === 'warden' && e.mode !== 'dormant' && !e.dead);
  if (boss) {
    const bw = Math.min(W * 0.6, 420), bx = (W - bw) / 2, by = H - 34;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
    ctx.fillStyle = boss.enraged ? '#e0603a' : '#6fc3f5'; ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), 8);
  }
}
function wrap(text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function drawTexts() {
  const h = state.hero;
  for (const t of state.texts) {
    const size = Math.round(Math.max(13, Math.min(19, UNIT * 0.52)) * t.size);
    ctx.font = `bold ${size}px "Courier New", monospace`;
    const lines = wrap(t.text, Math.min(W * 0.8, UNIT * 11 * t.size));
    const wx = t.follow ? h.x : t.x, wy = t.follow ? h.y - h.z - UNIT * 1.1 : t.y;
    let [sx, sy] = toScreen(wx, wy);
    const lh = size * 1.25, bh = lines.length * lh + 10;
    const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 18;
    sy -= bh;
    if (sy < 50) sy = Math.min(H - bh - 10, toScreen(wx, wy)[1] + UNIT * 1.8);
    sx = Math.max(bw / 2 + 8, Math.min(W - bw / 2 - 8, sx));
    const a = Math.min(1, t.t / 0.15) * Math.min(1, (t.life - t.t) / 0.5);
    const rise = (1 - Math.min(1, t.t / 0.25)) * 6;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,8,14,.55)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(sx - bw / 2, sy + rise, bw, bh, 6) : ctx.rect(sx - bw / 2, sy + rise, bw, bh); ctx.fill();
    ctx.fillStyle = t.color; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, sx, sy + rise + 5 + i * lh));
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = 1;
}
function drawTitle() {
  const T = state.title;
  if (!T) return;
  const k = T.t, fadeOut = Math.min(1, (T.life - k) / 0.6);
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (T.style === 'quest') {
    const pop = k < 0.35 ? 2.2 - 1.2 * (k / 0.35) : 1 + 0.04 * Math.sin(k * 6) * Math.max(0, 1 - k);
    const size = Math.min(W / 4.2, UNIT * 3.4) * pop;
    ctx.globalAlpha = Math.min(1, k / 0.1) * fadeOut;
    if (k < 0.3) { ctx.fillStyle = `rgba(255,255,240,${0.6 * (1 - k / 0.3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.font = `900 ${Math.round(size)}px Georgia, "Times New Roman", serif`;
    ctx.shadowColor = '#ffcf5a'; ctx.shadowBlur = size * 0.25;
    ctx.lineWidth = Math.max(3, size * 0.06); ctx.strokeStyle = '#3a2410';
    const y = H * 0.36;
    ctx.strokeText(T.text, W / 2, y);
    const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
    g.addColorStop(0, '#fff6c8'); g.addColorStop(0.55, '#f2c94c'); g.addColorStop(1, '#b8792a');
    ctx.fillStyle = g; ctx.fillText(T.text, W / 2, y);
    ctx.shadowBlur = 0;
    if (k > 0.5) {
      ctx.globalAlpha = Math.min(1, (k - 0.5) / 0.4) * fadeOut;
      ctx.font = `italic ${Math.round(Math.max(14, size * 0.16))}px Georgia, serif`;
      ctx.fillStyle = '#fdf6e3'; ctx.fillText(T.sub, W / 2, y + size * 0.62);
    }
  } else {
    const size = Math.min(W / 12, UNIT * (T.style === 'end' ? 1.6 : 1.1));
    ctx.globalAlpha = Math.min(1, k / 0.4) * fadeOut;
    ctx.font = `bold ${Math.round(size)}px Georgia, serif`;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(T.text, W / 2 + 2, H * 0.22 + 2);
    ctx.fillStyle = '#fdf6e3'; ctx.fillText(T.text, W / 2, H * 0.22);
    if (T.sub) { ctx.font = `${Math.round(size * 0.45)}px "Courier New", monospace`; ctx.fillText(T.sub, W / 2, H * 0.22 + size * 1.1); }
  }
  ctx.restore();
}

// =====================================================================
// Start
// =====================================================================
const startEl = document.getElementById('start');
function begin() {
  if (state.started) return;
  state.started = true;
  startEl.remove();
  startMusic();
  const sc = sceneDef(), h = state.hero;
  showTitle(AREA_NAMES[sc.area], null, 'area', 2.8);
  zoomPulse(h.x, h.y, 'title');
  if (sc.msg) say(sc.msg, h.x, h.y - UNIT * 0.8, { key: 'scene', life: 4 });
}
startEl.addEventListener('pointerdown', begin);
window.addEventListener('resize', resize);

function resizeCanvasOnly() {
  canvas.width = W * DPR; canvas.height = H * DPR;
  lightCv.width = Math.ceil(W / 2); lightCv.height = Math.ceil(H / 2);
}
function resize() {
  const oW = W, oH = H;
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  resizeCanvasOnly();
  computeUnit();
  const sx = W / oW, sy = H / oH;
  for (const a of [state.hero, ...state.enemies, ...state.items, ...state.hazards, ...state.rings, state.bird].filter(Boolean)) { a.x *= sx; a.y *= sy; }
  refreshSceneGeometry();
}

resizeCanvasOnly();
WORLD = buildWorld();
enterScene('start');
state.cam.x = W / 2; state.cam.y = H / 2;

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
