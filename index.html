<style>
  :root { --ink: #fdf6e3; }

  #dash { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #slotd { right: calc(190px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; font-size: .8rem; }
  #eat  { right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #jump { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; font-size: .85rem; }
  #throw { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .75rem; }
  #fire { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(164px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #menubtn { left: calc(12px + env(safe-area-inset-left, 0px)); top: auto; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 10px; font-size: 1.2rem; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #3f8f4c; font-size: 1.4rem; letter-spacing: 2px; cursor: pointer; text-align: center; padding: 20px; }
  #start small { font-size: .9rem; letter-spacing: 1px; opacity: .85; }

<script>
// ===== world.js: World generation: scenes (WORLD), solids, exits, features, patches, the overview renderer. Runs at load: builds every screen.
'use strict';
// =====================================================================
// Screen
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
// Keys are remappable from the menu. K holds the on-screen names used in hints.
const DEFAULT_KEYS = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', act: 'f', jump: ' ', swap: 'r', dash: 'a', eat: 's', slotd: 'd', fire: 'e', menu: 'm' };
const ACTION_NAMES = { up: 'Move up', down: 'Move down', left: 'Move left', right: 'Move right', act: 'Use weapon / grab / talk / throw', jump: 'Jump', swap: 'Swap weapon', dash: 'Slot A (dodge)', eat: 'Slot S (eat)', slotd: 'Slot D (plant)', fire: 'Marsh fire', menu: 'Menu' };
const K = {};
function keyName(k) { return { ' ': 'Space', arrowup: '\u2191', arrowdown: '\u2193', arrowleft: '\u2190', arrowright: '\u2192', escape: 'Esc', enter: 'Enter' }[k] || (k.length === 1 ? k.toUpperCase() : k); }
function refreshK() {
  if (TOUCH) Object.assign(K, { act: 'A', jump: 'jump', swap: 'swap', dash: 'dodge', eat: 'eat', slotd: 'D', fire: 'fire', menu: 'menu', l: '\u25C0', r: '\u25B6', u: '\u25B2' });
  else { const m = (state && state.settings && state.settings.keys) || DEFAULT_KEYS; for (const a in DEFAULT_KEYS) K[a] = keyName(m[a]); K.l = K.left; K.r = K.right; K.u = K.up; }
}
var state;                                           // declared here (refreshK reads it at load); built in engine.js beside resetRun
refreshK();
document.getElementById('startHint').textContent = TOUCH ? 'd-pad to move, A to act' : 'arrow keys to move, F to act, Space to jump, M for menu';
let W = window.innerWidth, H = window.innerHeight, UNIT = 32, DPR = window.devicePixelRatio || 1;
let SW = W, SH = H;                                  // the screen: W and H are the current scene's size (the same, except on the rise)
const computeUnit = () => { UNIT = Math.max(20, Math.min(W, H) / 14); };
computeUnit();
const L = () => Math.max(SW, SH);                    // walking pace and the like come from the screen, not the scene

// =====================================================================
// Random (seeded per adventure; the seed is what a save file stores)
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;
const rr = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp01 = v => Math.max(0.04, Math.min(0.96, v));

// =====================================================================
// World generation (done at a fixed virtual size so a seed always
// produces the same world on any screen)
// =====================================================================
const AREA_NAMES = { peak: 'The High Crags', indoor: 'Old Wick\'s Shack', river: 'The Gleaming River', forest: 'The Glade', woods: 'The Deep Woods', field: 'The Windswept Field', cave: 'The Dank Cave', marsh: 'The Marsh', swamp: 'The Sunken Swamp', hollow: 'The Hollow Beneath' };
const SHROOM_NAMES = { camp: 'Home camp', w2: 'Deep Woods', foot: 'Foothill Farm', c4: 'Dank Cave', m1: 'Marsh edge', sw2: 'Sunken Swamp' };
const OPP = { n: 's', s: 'n', e: 'w', w: 'e' };
// after the rescue: a gremlin fled with Pip's journal, back through the glade and the woods to where the sword was
const THIEF_ROUTE = ['start', 'w1', 'w2', 'w3'];
const BEANS = 7;              // always lying about: 1 on the toad's screen, 2 on each other marsh screen, 1 on each of the first two swamp screens

function edgePoint(side, along) {
  if (side === 'n') return [along, 0.03];
  if (side === 's') return [along, 0.97];
  if (side === 'w') return [0.03, along];
  return [0.97, along];
}
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function makePath(a, b, bends) {
  const pts = [a];
  for (let i = 1; i <= bends; i++) {
    const t = i / (bends + 1);
    pts.push([clamp01(a[0] + (b[0] - a[0]) * t + rr(-0.22, 0.22)), clamp01(a[1] + (b[1] - a[1]) * t + rr(-0.2, 0.2))]);
  }
  pts.push(b);
  return pts;
}
// A river is a centreline (upstream first) with a width, plus optional stepping stones of dry rock.
function riverHit(sc, x, y, pad = 0, stonesCount = true) {
  const r = sc.river; if (!r) return false;
  const half = (r.wH ? r.wH * H : r.w * UNIT) / 2 + pad;
  let d = Infinity;
  for (let i = 0; i < r.pts.length - 1; i++) d = Math.min(d, distSeg(x, y, r.pts[i][0] * W, r.pts[i][1] * H, r.pts[i + 1][0] * W, r.pts[i + 1][1] * H));
  if (d > half) return false;
  if (stonesCount && (r.stones || []).some(s => Math.hypot(x - s[0] * W, y - s[1] * H) < s[2] * UNIT * 0.9)) return false;
  return true;
}
function inRects(rects, fx, fy, pad = 0) { return rects.some(([x0, y0, x1, y1]) => fx > x0 - pad && fx < x1 + pad && fy > y0 - pad && fy < y1 + pad); }
function clearSpot(sc, fx, fy, rU, pathW, keep) {
  const x = fx * W, y = fy * H, r = rU * UNIT;
  for (const p of sc.paths) for (let i = 0; i < p.length - 1; i++)
    if (distSeg(x, y, p[i][0] * W, p[i][1] * H, p[i + 1][0] * W, p[i + 1][1] * H) < pathW * UNIT + r) return false;
  for (const k of keep) if (Math.hypot(x - k[0] * W, y - k[1] * H) < k[2] * UNIT + r) return false;
  for (const s of sc.solids) if (Math.hypot(x - s.fx * W, y - s.fy * H) < (s.r + rU) * UNIT * 0.85) return false;
  if (sc.chasms && inRects(sc.chasms, fx, fy, 0.04)) return false;
  if (riverHit(sc, x, y, r + UNIT * 0.5, false)) return false;
  if (onClaim(sc, fx, fy, rU * 0.6)) return false;          // no tree or boulder on top of something you use
  return true;
}
// Every solid carries a look: variant (branch pattern), flip, palette.
function solid(fx, fy, r, kind, pal, extra) { return Object.assign({ fx, fy, r, kind, v: Math.floor(rng() * 3), flip: rng() < 0.5, pal: pal || null }, extra); }
function scatter(sc, n, kind, rMin, rMax, pathW, keep = [], box = [0.06, 0.94, 0.08, 0.92], pal) {
  let placed = 0;
  for (let tries = 0; tries < n * 60 && placed < n; tries++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]), r = rr(rMin, rMax);
    if (clearSpot(sc, fx, fy, r, pathW, keep)) { sc.solids.push(solid(fx, fy, r, kind, pal)); placed++; }
  }
}
function edgeWall(sc, side, kind, rU, gaps, density = 1.6, pal) {
  const horiz = side === 'n' || side === 's', len = horiz ? W : H;
  const step = rU * UNIT * density, n = Math.ceil(len / step) + 1;
  for (let i = 0; i < n; i++) {
    const along = (i * step + rr(-0.15, 0.15) * step) / len;
    if (along < -0.02 || along > 1.02) continue;
    const margin = rU * UNIT * 1.2 / len;
    if (gaps.some(([a, b]) => along > a - margin && along < b + margin)) continue;
    const inset = rU * UNIT * 0.45, r = rU * rr(0.85, 1.2);
    const [fx, fy] = side === 'n' ? [along, inset / H] : side === 's' ? [along, 1 - inset / H]
      : side === 'w' ? [inset / W, along] : [1 - inset / W, along];
    sc.solids.push(solid(fx, fy, r, kind, pal));
  }
}
// A barrier is a line of solids sharing an id; breaking it removes them all.
function barrier(sc, id, kind, x0, y0, x1, y1, rU = 0.6) {
  const n = Math.max(2, Math.ceil(Math.hypot((x1 - x0) * W, (y1 - y0) * H) / (rU * UNIT * 1.2)));
  for (let i = 0; i <= n; i++) sc.solids.push(solid(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, rU, kind, null, { bar: id }));
}
function ringBarrier(sc, id, kind, cx, cy, radU, rU = 0.5) {
  for (let a = 0; a < 6.28; a += 0.55) sc.solids.push(solid(cx + Math.cos(a) * radU * UNIT / W, cy + Math.sin(a) * radU * UNIT / H, rU, kind, null, { bar: id }));
}
function gapAt(c, half = 0.09) { return [Math.max(0.1, c - half), Math.min(0.9, c + half)]; }
// every interactable (mushroom, plot, rock, character, pickup) claims a patch of ground;
// nothing else may be placed on a claim, so no two ever share a spot
function claim(sc, fx, fy, rU) { sc.claims.push([fx, fy, rU]); }
const onClaim = (sc, fx, fy, rU) => sc.claims.some(c => Math.hypot((fx - c[0]) * W, (fy - c[1]) * H) < (c[2] + rU) * UNIT);
function pullable(sc, o) { sc.pullables.push(o); claim(sc, o.fx, o.fy, 1.4); }
function npc(sc, o) { sc.npcs.push(o); claim(sc, o.fx, o.fy, 1.5); }
function item(sc, ...os) { for (const o of os) { sc.initItems.push(o); claim(sc, o.fx, o.fy, 0.6); } }
function freeSpot(sc, box, rU, keep = []) {
  // first spot that clears everything; if the screen is too crowded, the spot that comes closest,
  // treating claims as the thing that must never be broken
  let best = null, bestScore = -Infinity;
  for (let i = 0; i < 400; i++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]);
    if (sc.chasms && inRects(sc.chasms, fx, fy, 0.05)) continue;
    const x = fx * W, y = fy * H;
    if (riverHit(sc, x, y, rU * UNIT, false)) continue;
    let score = Infinity;
    for (const c of sc.claims) score = Math.min(score, (Math.hypot(x - c[0] * W, y - c[1] * H) - (c[2] + rU) * UNIT) * 4);
    for (const s of sc.solids) score = Math.min(score, Math.hypot(x - s.fx * W, y - s.fy * H) - (s.r + rU) * UNIT);
    for (const k of keep) score = Math.min(score, Math.hypot(x - k[0] * W, y - k[1] * H) - k[2] * UNIT);
    if (score > 0) return [fx, fy];
    if (score > bestScore) { bestScore = score; best = [fx, fy]; }
  }
  return best || [rr(box[0], box[1]), rr(box[2], box[3])];
}
function decoFlowers(sc, n) {
  const cols = ['#f3e37a', '#f2f2f2', '#e98ac0', '#9fc6f5'];
  for (let i = 0; i < n; i++) sc.deco.push({ kind: 'flower', fx: rng(), fy: rng(), c: pick(cols) });
  for (let i = 0; i < 30; i++) sc.deco.push({ kind: 'grass', fx: rng(), fy: rng(), s: rr(0.5, 1) });
}
// farm patches: a few patches of rich soil near the path; what grows depends on the region
// spots other things already claim (puzzles, people) so farms and mushrooms keep their distance
const claimed = sc => sc.pullables.map(p => [p.fx, p.fy, 3]).concat(sc.npcs.map(n => [n.fx, n.fy, 3]), sc.pools.map(o => [o.fx, o.fy, o.r + 2]));
// Patches are never packed side by side: two of them sit either diagonally touching or with one empty tile between.
// plotPattern gives n spots around a centre in tiles (converted to fractions of this screen).
function plotPattern(c, n, kind) {
  const tx = UNIT / W, ty = UNIT / H;
  if (n === 2) return kind === 'diag' ? [[c[0] - tx * 0.5, c[1] - ty * 0.5], [c[0] + tx * 0.5, c[1] + ty * 0.5]] : [[c[0] - tx, c[1]], [c[0] + tx, c[1]]];
  const cols = Math.ceil(Math.sqrt(n)), out = [];
  for (let i = 0; i < n; i++) out.push([c[0] + ((i % cols) - (cols - 1) / 2) * 2 * tx, c[1] + (Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2) * 2 * ty]);
  return out;
}
function addPlots(sc, n, box) {
  sc.feat.plots = sc.feat.plots || [];
  // try a few spots and keep the one with room for the most plots; test the whole row against what
  // was already there, then claim it (so plots don't block their neighbours)
  let row = [];
  for (let t = 0; t < 8 && row.length < n; t++) {
    const c = freeSpot(sc, t < 4 ? box : [0.12, 0.88, 0.15, 0.85], 2.2, claimed(sc));
    const r2 = plotPattern(c, n, rng() < 0.5 ? 'diag' : 'gap')
      .filter(q => !onClaim(sc, q[0], q[1], 0.6) && !sc.pools.some(o => Math.hypot((q[0] - o.fx) * W, (q[1] - o.fy) * H) < (o.r + 0.9) * UNIT) && sc.solids.every(s => Math.hypot((q[0] - s.fx) * W, (q[1] - s.fy) * H) > (s.r * 0.6 + 0.6) * UNIT));
    if (r2.length > row.length) row = r2;
  }
  row.forEach(q => { sc.feat.plots.push(q); claim(sc, q[0], q[1], 0.7); });
}
// a traveler's mushroom, with a little farm beside it
function addShroom(sc, spot, plots = 2) {                 // travel mushrooms are where patches are found: two nearby
  const p = spot || freeSpot(sc, [0.2, 0.8, 0.2, 0.8], 2.6, claimed(sc));
  sc.feat.shroom = p;
  sc.solids.push(solid(p[0], p[1], 0.7, 'shroom'));
  claim(sc, p[0], p[1], 1.8);
  if (plots) {
    sc.feat.plots = sc.feat.plots || [];
    let row = [];
    for (let t = 0; t < 8 && row.length < plots; t++) {
      const spread = 0.2 + t * 0.05;
      const c = freeSpot(sc, [Math.max(0.12, p[0] - spread), Math.min(0.88, p[0] + spread), Math.max(0.15, p[1] - spread), Math.min(0.85, p[1] + spread)], 1.8, [[...p, 2], ...claimed(sc)]);
      const r2 = plotPattern(c, plots, rng() < 0.5 ? 'diag' : 'gap')
        .filter(q => !sc.pools.some(o => Math.hypot((q[0] - o.fx) * W, (q[1] - o.fy) * H) < (o.r + 0.9) * UNIT) && !onClaim(sc, q[0], q[1], 0.6) && sc.solids.every(s => Math.hypot((q[0] - s.fx) * W, (q[1] - s.fy) * H) > (s.r * 0.6 + 0.6) * UNIT));   // never in the water, under anything, or in a trunk
      if (r2.length > row.length) row = r2;
    }
    row.forEach(q => { sc.feat.plots.push(q); claim(sc, q[0], q[1], 0.7); });
  }
}
// ---- rock puzzle pieces: rings of stones ----
// a cracked stone: a thrown rock knocks it apart. Some hold something; some are the keystone of a wedged boulder pile (rope unused now)
// breakable stones are drawn bigger than a thrown rock (0.6), so they read as the thing to hit
// a single breakable boulder: size in tiles (1-5) is its width and the number of rock hits it takes; its colour varies
function crag(sc, id, at, size, extra = {}) {
  const tint = ['#8a8478', '#7f7a72', '#8c8272', '#77807e', '#857c70'][Math.floor(rng() * 5)];
  sc.solids.push(solid(at[0], at[1], size / 2, 'crag', null, { bar: id, size, hp: size, tint, ...extra })); claim(sc, at[0], at[1], size / 2 + 0.6);
}
function keystone(sc, bar, at, rope, rU = 1.0, stone = null) { sc.solids.push(solid(at[0], at[1], rU, 'cracked', null, { bar, rope, stone })); claim(sc, at[0], at[1], rU + 0.8); }
// breakable stones: how many good hits they take, and what's inside
const STONES = {
  sandstone: { name: 'Sandstone', dur: 1, tint: '#c9a878', inside: [['stone', 0.8], ['seed', 0.3]] },   // 'seed' here means the local vegetable's seed
  granite: { name: 'Granite', dur: 2, tint: '#8f8a86', inside: [['stone', 1], ['stone', 0.6], ['ironseed', 0.12]] },
  geode: { name: 'Geode', dur: 3, tint: '#7a6a8a', inside: [['emberseed', 0.5], ['starseed', 0.08], ['thornseed', 0.4]] },
};
function newScene(o) {
  return Object.assign({ claims: [], solids: [], deco: [], spawns: [], pullables: [], exits: [], pools: [], paths: [], feat: {}, npcs: [], initItems: [], speed: 0.5, accel: 10, shade: 0 }, o);
}

const GEN = { W: 1280, H: 800 };
function buildWorld(seed) {
  const saved = [W, H, UNIT];
  W = GEN.W; H = GEN.H; computeUnit();
  rng = mulberry32(seed >>> 0);
  try { return genWorld(); } finally { [W, H, UNIT] = saved; rng = mulberry32((seed ^ 0x9e3779b9) >>> 0); }
}

function genWorld() {
  const S = {};
  const add = sc => (S[sc.id] = sc);
  // one function per region, called in this order: every region draws from the one seeded rng, so the order is the world
  genCamp(add); genStart(add); genMeadow(add); genRiver(add); genShack(add); genDownriver(add); genWoods(add);

    const sc = add(newScene({
      id: 'w' + i, area: 'woods', depth: i, msg: ['Drag marks lead deeper', 'Cackling, somewhere ahead', 'The woods hold their breath here'][i - 1],

    edgeWall(sc, 'w', 'tree', 1.2, [west], 1.3, 'deep');

    sc.feat.pageSpots = [0, 1].map(() => { const q = freeSpot(sc, [0.15, 0.85, 0.15, 0.85], 0.8); claim(sc, q[0], q[1], 0.6); return q; });
    if (i === 2) addShroom(sc);

function genField(add) {
  // ---------------- Windswept field (south of the glade): where the wind is learned ----------------
  // a = angle (0 blows south, + toward east, PI blows north), s = strength (1 strong, .5 weak). Ride a gust by jumping
  // while it blows. The tall grass by the path leans the way the next one will blow. The way south leads onto the rise.
  const sc = add(newScene({
    id: 'f1', area: 'field', depth: 1, msg: 'The mountain path begins', music: 'field', amb: 'wind', floor: '#7d9a4c', speed: 0.45, accel: 8,
    gusts: [{ a: -0.3, s: 1 }, { a: Math.PI + 0.3, s: 1 }, { a: 0.3, s: 1 }, { a: Math.PI - 0.3, s: 1 }], chasms: [], feat: { plants: [[0.5, 0.4]] },
  }));
  const north = [0.42, 0.58], south = gapAt(rr(0.22, 0.78), 0.08);
  sc.exits.push({ side: 'n', a: north[0], b: north[1], to: 'start' });
  sc.exits.push({ side: 's', a: south[0], b: south[1], to: 'rise' });     // the rise's finish sets where you arrive
  sc.exits.push({ side: 'w', a: 0.4, b: 0.6, to: 'foot' });

  edgeWall(sc, 'n', 'boulder', 1.0, [north]);
  edgeWall(sc, 's', 'boulder', 1.0, [south]);
  const keep = sc.feat.plants.map(s => [...s, 1.2]);

  sc.paths = [makePath(edgePoint('n', (north[0] + north[1]) / 2), edgePoint('s', (south[0] + south[1]) / 2), 2)];
  scatter(sc, 4, 'boulder', 0.7, 1.3, 1.8, keep, [0.1, 0.9, 0.12, 0.88]);
  for (let t = 0; t < 90; t++) sc.deco.push({ kind: 'tuft', fx: rng(), fy: rng(), s: rr(0.6, 1.3), ph: rng() * 6 });
  for (let t = 0; t < 2; t++) { const q = freeSpot(sc, [0.2, 0.8, 0.35, 0.65], 0.6); item(sc, { type: 'fluff', fx: q[0], fy: q[1] }); }   // at most two tufts lying about, and the wind moves them; the rest is on the rabbits
  sc.rocks = [];
  sc.windLedges = true; sc.ledgeSeed = rng();          // landing ledges, laid out in tiles on arrival; the wind can't move you on them
}

function genCrags(add) {
  // ---------------- The High Crags: above the climb. Stone, cliffs, ravines you can jump, rocky outcrops ----------------
  const CRAGS = [
    { id: 'peak1', msg: 'The grass gives out. Only stone from here up.', ravines: [0.28], cliffs: [[0.47, 0.42, 1]], from: 'w' },
    { id: 'peak2', msg: 'Cliffs and cracks all the way up', ravines: [0.2, 0.58], cliffs: [[0.4, 0.35, 1], [0.76, 0, 0.62]], from: 's' },
    { id: 'peak3', msg: 'The old summit. A path climbs on, into the cloud.', ravines: [0.72], cliffs: [], from: 's', top: true },
  ];
  CRAGS.forEach((C, k) => {
    const sc = add(newScene({ id: C.id, area: 'peak', depth: 8 + k, msg: C.msg, music: 'field', amb: 'wind', floor: '#8b8680', speed: 0.42, accel: 8, chasms: [] }));
    sc.ravines = C.ravines.map(y => ({ y, hU: 1.7 }));                       // sized in tiles when you arrive, so they're always jumpable
    sc.exits = [];
    const DIAG_UP = ['peak1', 'peak3'], DIAG_IN = ['peak2'];                   // diagonal steps: out at the top-right corner, in at the bottom-left
    if (C.from === 'w') sc.exits.push({ side: 'w', a: 0.4, b: 0.6, to: 'climb5' });   // back down the last ledges (build 203) else sc.exits.push({ side: 's', a: DIAG_IN.includes(C.id) ? 0.08 : 0.42, b: DIAG_IN.includes(C.id) ? 0.24 : 0.58, to: CRAGS[k - 1].id });
    const up = DIAG_UP.includes(C.id) ? [0.76, 0.92] : [0.42, 0.58];
    if (!C.top) sc.exits.push({ side: 'n', a: up[0], b: up[1], to: CRAGS[k + 1].id }); else sc.exits.push({ side: 'n', a: up[0], b: up[1], to: 'hr1' });   // the summit was never the top
    for (const side of ['n', 's', 'w', 'e']) { const ex = sc.exits.find(e => e.side === side); edgeWall(sc, side, 'cliff', 1.1, ex ? [[ex.a, ex.b]] : [], 1.3); }
    for (const [y, x0, x1] of C.cliffs) for (let x = x0; x <= x1; x += 0.045) sc.solids.push(solid(x, y, 0.75, 'cliff'));
    const band = y => C.ravines.some(r => Math.abs(y - r) < 0.08) || C.cliffs.some(c => Math.abs(y - c[0]) < 0.06);
    for (let t = 0; t < 7; t++) { const q = freeSpot(sc, [0.1, 0.9, 0.12, 0.88], 1.3); if (!band(q[1])) sc.solids.push(solid(q[0], q[1], rr(0.7, 1.2), 'boulder')); }
    for (let t = 0; t < 14; t++) { const fx = rng(), fy = rng(); if (!band(fy)) sc.deco.push({ kind: 'tuft', fx, fy, s: rr(0.5, 0.9), ph: rng() * 6 }); }
    sc.rocks = [];
    if (C.top) { sc.solids.push(solid(0.5, 0.33, 0.9, 'cairn')); item(sc, { type: 'starseed', fx: 0.5, fy: 0.42 }); }
  });
}

    if (!boss) scatter(sc, 1 + i, 'stalagmite', 0.8, 1.2, 2.2, sc.feat.shroom ? [[...sc.feat.shroom, 3]] : [], [0.15, 0.85, 0.15, 0.85]);

    for (let p = 0; p < i; p++) {

function renderOverview(seed) {
  const TW = 256, TH = 160, GAP = 40, M = 60, HEAD = 110;
  const cols = 15, rows = 13;
  resetRun(seed);
  W = GEN.W; H = GEN.H; computeUnit();
  lightCv.width = W / 2; lightCv.height = H / 2;
  const OW = M * 2 + cols * TW + (cols - 1) * GAP, OH = M * 2 + HEAD + rows * TH + (rows - 1) * GAP;
  canvas.width = OW; canvas.height = OH;
  const at = id => { const [c, r] = MAP_LAYOUT[id]; return [M + c * (TW + GAP), M + HEAD + r * (TH + GAP)]; };
  const center = id => { const [x, y] = at(id); return [x + TW / 2, y + TH / 2]; };

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#14121a'; ctx.fillRect(0, 0, OW, OH);
  ctx.fillStyle = '#fdf6e3'; ctx.font = 'bold 44px Georgia, serif'; ctx.fillText('Quest: world overview', M, M + 40);
  ctx.font = '22px "Courier New", monospace'; ctx.fillStyle = '#d8d0c0';
  ctx.fillText(`seed ${seed}   ·   ${Object.keys(MAP_LAYOUT).length} screens   ·   lines are walkable, dashed purple is the sinkhole, dashed blue the raft and the tunnel`, M, M + 80);
  let lx = M + 1900;
  for (const [area, col] of Object.entries(REGION_COLOR)) { ctx.fillStyle = col; ctx.fillRect(lx, M + 62, 22, 22); ctx.fillStyle = '#d8d0c0'; ctx.fillText(AREA_NAMES[area].replace('The ', ''), lx + 30, M + 80); lx += 30 + ctx.measureText(AREA_NAMES[area].replace('The ', '')).width + 34; }

  // connections first, underneath the screens
  const drawn = new Set();
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const [id, sc] of Object.entries(WORLD)) for (const ex of sc.exits) {
    const key = [id, ex.to].sort().join('-');
    if (drawn.has(key) || !MAP_LAYOUT[ex.to] || !MAP_LAYOUT[id]) continue;
    drawn.add(key);
    const [ax, ay] = center(id), [bx, by] = center(ex.to);
    ctx.strokeStyle = ex.locked ? '#a0885a' : '#6a6478';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }
  ctx.setLineDash([14, 12]); ctx.strokeStyle = '#8a7aa8';
  { const [ax, ay] = center('w3'), [bx, by] = center('c1'); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
  ctx.strokeStyle = '#5ab0c8';                                                          // downriver by raft, and the tunnel
  { const [ax, ay] = center('riverbank'), [bx, by] = center('rapids'); ctx.beginPath(); ctx.moveTo(ax, ay - 40); ctx.quadraticCurveTo((ax + bx) / 2, ay - 120, bx, by); ctx.stroke(); }
  { const [ax, ay] = center('gleampool'), [bx, by] = center('fallsbank'); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2, by + 260, bx, by); ctx.stroke(); }
  ctx.setLineDash([]);

  // each screen, drawn by the game's own painter at thumbnail scale
  const s = TW / W;
  for (const id of Object.keys(MAP_LAYOUT)) {
    const sc = WORLD[id];
    enterScene(id);
    if (sc.virt) { state.mtn = null; refreshSceneGeometry(); }   // the rise, as a flat thumbnail: its tiles squeezed into the frame
    const h = state.hero; h.x = -9999; h.y = -9999;
    state.texts = []; state.title = null; state.fx = []; state.glimpse = null;
    const shade = sc.shade; sc.shade = Math.min(shade || 0, 0.35);   // dim, not black, so dark screens can be read
    const [x, y] = at(id);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, TW, TH); ctx.clip();
    ctx.setTransform(s, 0, 0, s, x, y);
    try { drawScene(sc); } catch (e) { console.error('overview', id, e); }
    ctx.restore();
    sc.shade = shade;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.strokeStyle = REGION_COLOR[sc.area] || '#888'; ctx.lineWidth = 4; ctx.strokeRect(x - 2, y - 2, TW + 4, TH + 4);
    // label and notes
    const notes = [];
    if (sc.feat.shroom) notes.push('mushroom');
    if (sc.feat.plots && sc.feat.plots.length) notes.push(`${sc.feat.plots.length} plots`);
    const beans = sc.initItems.filter(i => i.type === 'bean').length; if (beans) notes.push(`${beans} bean${beans > 1 ? 's' : ''}`);
    if (sc.spawns.length) notes.push(`${sc.spawns.length} foe${sc.spawns.length > 1 ? 's' : ''}`);
    ctx.fillStyle = 'rgba(10,8,14,.78)'; ctx.fillRect(x, y + TH - 26, TW, 26);
    ctx.fillStyle = '#fdf6e3'; ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(`${id}  ${MAP_NAMES[id] || ''}`.trim(), x + 6, y + TH - 9);
    ctx.fillStyle = '#c9c0a8'; ctx.font = '12px "Courier New", monospace';
    const n = notes.join(', '); ctx.fillText(n, x + TW - 6 - ctx.measureText(n).width, y + TH - 9);
  }
  return { width: OW, height: OH };
}

// in the browser: ?overview shows the map instead of the game

// ---------- the world: three screens north of the summit (peak3) ----------
function genHighlands(S, add) {
  const HR = [

    { id: 'hr2', msg: 'The Crossing. Keep to the ridge.', vista: 'both', drop: null, ridge: true, statues: 4, insects: 1, hawks: 2, beetle: true },
    { id: 'hr3', msg: 'Above the Clouds', vista: 'clouds', drop: [0, 0, 0.18, 1], statues: 2, insects: 0, hawks: 1, worms: true },
  ];
  HR.forEach((C, k) => {
    const sc = add(newScene({ id: C.id, area: 'high', depth: 11 + k, msg: C.msg, music: 'field', amb: 'wind', floor: k === 2 ? '#a9a4a8' : '#948e88', speed: 0.42, accel: 8, chasms: [] }));
    sc.region = 'high'; sc.vista = C.vista;
    sc.exits = [{ side: 's', a: k ? 0.42 : 0.08, b: k ? 0.58 : 0.24, to: k ? HR[k - 1].id : 'peak3' }];   // hr1 is a diagonal step up from the old summit: you come in at its bottom-left
    if (k < HR.length - 1) sc.exits.push({ side: 'n', a: 0.42, b: 0.58, to: HR[k + 1].id });
    else sc.exits.push({ side: 'n', a: 0.42, b: 0.58, to: 'hrtop', locked: () => true });            // the peak: nothing has gone up and come back
    sc.gusts = [{ a: Math.PI / 2 * (k % 2 ? 1 : -1), s: 1 }, { a: 0, s: 0.6 }];
    // the drops: where the ledge ends and the view begins (fall = back down, a little hurt)
    if (C.drop) sc.chasms.push(C.drop);
    if (C.ridge) { sc.chasms.push([0, 0.22, 0.36, 0.78], [0.64, 0.22, 1, 0.78]); }                     // a ridge crossing with sky on both sides
    for (const side of ['n', 's', 'w', 'e']) {
      const ex = sc.exits.find(e => e.side === side);

    const spot = r => { for (let t = 0; t < 40; t++) { const q = freeSpot(sc, [0.12, 0.88, 0.14, 0.86], r); if (!inDrop(q[0], q[1])) return q; } return null; };

    for (let t = 0; t < C.insects; t++) { const q = spot(1); if (q) sc.spawns.push({ type: 'mantis', fx: q[0], fy: q[1] }); }
    for (let t = 0; t < C.hawks; t++) sc.spawns.push({ type: 'hawk', fx: 0.3 + t * 0.4, fy: 0.3 });

// ---------- what lives up here (hawk and mantis: MONSTERS in critters.js) ----------
function updateGrab(dt) {
  const g = state.grab, h = state.hero; if (!g) return false;
  g.t += dt; const e = g.e; e.mode = 'carry';
  const k = g.t / g.dur; h.x += g.dx * UNIT * 2.6 * dt; h.y += g.dy * UNIT * 2.6 * dt - UNIT * 0.2 * dt; h.z = UNIT * 1.4 * Math.sin(Math.min(1, k) * Math.PI * 0.9);
  h.x = Math.max(UNIT, Math.min(W - UNIT, h.x)); h.y = Math.max(UNIT, Math.min(H - UNIT, h.y)); e.x = h.x; e.y = h.y - UNIT * 0.6;
  if (pressedNow.act && g.t > 0.3) g.t = g.dur;                   // strike the legs: it lets go early
  if (g.t >= g.dur) {
    state.grab = null; e.mode = 'climb'; e.t = 0.75; h.z = 0;
    if (isChasm(h.x, h.y)) {                                       // dropped over the edge: down a screen, hurt
      const sc = sceneDef(), down = (sc.exits.find(x => x.side === 's') || {}).to;
      hurtHero(1, 0, 1); if (down) { heroNote('Dropped! Down the mountain...', 1, { key: 'fall', life: 2 }); transitionTo(down, 0.5, 0.2); }
    } else { hurtHero(1, 0, 1); heroNote('Dropped!', 1, { key: 'hurt', life: 1.2, color: '#ffb080' }); }
  }
  return true;
}
// ---------- the red crystal beetle ----------
// Found on the Crossing. It doesn't want to come; it comes anyway, riding on you and clambering about. Near crystal
// or out in the wind it hums and gives back a little vigor; when you're low it will shove one of your snacks at you.
function interactBeetle(sc, h) {

  const x = b[0] * W, y = b[1] * H; if (Math.hypot(h.x - x, h.y - y) > UNIT * 1.6 || !pressedNow.act) return;

  say('A tiny red beetle, glittering like cut glass. It clicks at you. Unimpressed. You hold out a hand. It looks at the hand. It looks at you. Then it climbs aboard anyway, muttering all the way up to your shoulder.', x, y - UNIT * 1.2, { key: 'npc', color: '#ff9aa6' });
  showScroll('A red crystal beetle', 'It rides along now, whether it likes it or not.'); return true;
}
function updateBeetle(dt) {
  const B = state.inv.beetle, h = state.hero; if (!B || !h) return;
  B.t = (B.t || 0) + dt; B.feedCd = Math.max(0, (B.feedCd || 0) - dt);
  const mv = maxVig(), sc = sceneDef();
  const nearCrystal = state.solids.some(s => s.kind === 'crystalbug' && Math.hypot(s.x - h.x, s.y - h.y) < UNIT * 3);
  const windy = sc.gusts && (state.gustPhase === 'blow' || state.gustPhase === 'gentle');
  if ((nearCrystal || windy) && h.vig < mv) { h.vig = Math.min(mv, h.vig + 0.25 * dt); if (Math.random() < dt * 3) state.fx.push({ x: h.x + (Math.random() - 0.5) * UNIT, y: h.y - UNIT * 0.6, vx: 0, vy: -UNIT * 0.8, t: 0, life: 0.6, color: '#ff6a7a', size: UNIT * 0.06 }); }

    notice(`The beetle shoves a ${foodName ? foodName(f) : f} at you.`, '#ff9aa6');
  }
}
function drawBeetleOnHero(x, top, pw, ph) {
  if (!state.inv.beetle) return;
  const t = state.time, a = t * 0.7, bx = x + Math.cos(a) * pw * 0.45, by = top + ph * 0.3 + Math.sin(a * 1.3) * ph * 0.25, u = UNIT;

  gremlin: {

  thief: {                                          // the gremlin with Pip's journal: runs a route, fights when cornered

    draw: drawGremlin,
    ai(e, dx, dy, dist, ease, dt) {

          e.lx = fx * W + (fx > 0.9 ? UNIT * 3 : fx < 0.1 ? -UNIT * 3 : 0); e.ly = fy * H + (fy > 0.9 ? UNIT * 3 : fy < 0.1 ? -UNIT * 3 : 0);

          heroNote('Gone again. Follow the dropped pages.', 1.2, { key: 'thief', life: 2.5 });
        }
      }
    },
  },
  lurker: {
    stats: u => ({ r: u * 0.55, hp: 3, dmg: 1, mode: 'submerged', t: 0, cool: rr(0.5, 2) }),
    small: true, water: true, rooted: true, resume: ['sink', 0.4], parryStun: 1.6,
    hittable: e => ['bite', 'risen', 'stunned'].includes(e.mode),
    onHit: stunOnStab,
    drop: [['slime', 0.25], ['emberseed', 0.08], ['wisp', 0.2]],
    draw: drawLurker,
    ai(e, dx, dy, dist) {
      const p = e.pool, h = state.hero;
      if (!p) return;
      switch (e.mode) {
        case 'submerged': {
          e.x = p.x; e.y = p.y;
          if (e.cool <= 0 && Math.hypot(h.x - p.x, h.y - p.y) < p.r + UNIT * 2.6) {
            const a = Math.atan2(h.y - p.y, h.x - p.x);

        case 'bite':
          if (!e.parried && slashActive() && dist < UNIT * 1.9) { e.parried = true; parry(e); break; }
          if (e.t <= 0) { if (dist < UNIT * 1.5 && state.hero.z < UNIT * 0.5) hurtHero(e.dmg, e.x, e.y); e.mode = 'risen'; e.t = 1.2; }
          break;
        case 'risen': if (e.t <= 0) { e.mode = 'sink'; e.t = 0.4; } break;

    },

  warden: {                                         // the boss behind the falls
    stats: u => ({ r: u * 1.3, hp: 18, maxHp: 18, dmg: 2, mode: 'dormant', t: 0 }),
    boss: true, resume: ['prowl', 1.2], parryStun: 1.8,
    hittable: e => !['dormant', 'intro', 'talk'].includes(e.mode),
    onParry: e => e.mode !== 'charge',              // blocked, but it shrugs it off
    touches: e => ['prowl', 'aim', 'charge', 'rear', 'recover'].includes(e.mode),
    afterHit: e => { e.mode = 'recover'; e.t = 1.0; },
    onHit: e => { if (e.hp <= e.maxHp / 2 && !e.enraged) { e.enraged = true; say('The Warden is enraged!', e.x, e.y - e.r - UNIT, { key: 'boss' }); sfx.roar(); zoomPulse(e.x, e.y, 'boss'); } return true; },
    onKill: e => {

    },
    drop: [['warden', 1]],
    draw: drawWarden, eyes: eyesWarden,
    ai(e, dx, dy, dist, ease) {
      const h = state.hero, fast = e.enraged ? 1.25 : 1;
      switch (e.mode) {
        case 'dormant':

        case 'intro': if (e.t <= 0) { state.cam.focus = null; e.mode = 'prowl'; e.t = 1.2; } break;

          if (e.t <= 0) { e.mode = 'charge'; e.t = 1.1; e.vx = e.lx * 0.9 * fast * L(); e.vy = e.ly * 0.9 * fast * L(); }
          break;
        case 'charge': if (e.t <= 0) { e.mode = 'recover'; e.t = 0.9; } break;
        case 'rear':
          ease(0, 0, 8);
          if (e.t <= 0) {
            sfx.crash(); state.shake = 0.6; zoomPulse(e.x, e.y, 'kill');
            state.rings.push({ x: e.x, y: e.y, t: 0, dur: 0.9, r0: e.r, r1: e.r + UNIT * 6, hit: false });
            const n = e.enraged ? 5 : 3;
            for (let i = 0; i < n; i++) {
              const a = Math.random() * 6.28, d = i === 0 ? 0 : UNIT * rr(1, 3.2);
              state.hazards.push({ x: Math.max(UNIT, Math.min(W - UNIT * 3, h.x + Math.cos(a) * d)), y: Math.max(UNIT, Math.min(H - UNIT, h.y + Math.sin(a) * d)), t: -i * 0.15, dur: 1.0, r: UNIT * 0.8 });

  // the High Reaches
  hawk: {                                           // circles high, its shadow on the ground; then a dive (the shadow shrinks to a dot, a shriek);
    // it strikes you and knocks you back, or sometimes grabs you, carries you off and drops you (over a drop: you land a screen lower; updateGrab)
    stats: (u, b) => ({ r: u * 0.55, hp: 3, dmg: 1, mode: 'circle', t: rr(1, 2), fly: true, ang: rng() * 6, cx: b.x, cy: b.y }),

    draw: drawHawk,
    ai(e, dx, dy, dist, ease, dt) {

        e.x = e.cx + Math.cos(e.ang) * UNIT * 3; e.y = e.cy + Math.sin(e.ang) * UNIT * 2; e.alt = UNIT * 3;
        if (e.t <= 0 && !state.grab) { e.mode = 'dive'; e.t = 0.45; e.tx = h.x; e.ty = h.y; e.x0 = e.x; e.y0 = e.y; sfx.shriek ? sfx.shriek() : sfx.cackle(); }
      } else if (e.mode === 'dive') {
        const k = 1 - Math.max(0, e.t) / 0.45; e.x = e.x0 + (e.tx - e.x0) * k; e.y = e.y0 + (e.ty - e.y0) * k; e.alt = UNIT * 3 * (1 - k);
        if (e.t <= 0) {
          if (Math.hypot(h.x - e.x, h.y - e.y) < UNIT * 0.9 && h.z <= UNIT * 0.3 && !(h.invuln > 0)) {
            if (Math.random() < 0.35) { state.grab = { e, t: 0, dur: 1.6, dx: (Math.random() - 0.5) * 2, dy: (Math.random() - 0.5) * 2 }; heroNote('Talons!', 1.2, { key: 'hurt', life: 1.2, color: '#ffb080' }); }
            else { const d = Math.hypot(h.x - e.x0, h.y - e.y0) || 1; hurtHero(1, (h.x - e.x0) / d, (h.y - e.y0) / d); }
          }
          e.mode = 'climb'; e.t = 0.6;
        }
      } else if (e.mode === 'climb') { e.alt = Math.min(UNIT * 3, (e.alt || 0) + UNIT * 3 * dt); e.cx = e.x; e.cy = e.y; if (e.t <= 0) { e.mode = 'circle'; e.t = rr(1.5, 3); } }
      else if (e.mode === 'carry') { e.alt = UNIT * 1.6; }

  },
  mantis: {                                         // a big mountain mantis: stalks, rears up, lunges
    stats: u => ({ r: u * 0.7, hp: 4, dmg: 1, mode: 'idle', t: 1 }),
    resume: ['stalk', 1],
    draw: drawMantis,
    ai(e, dx, dy, dist, ease) {
      if (e.mode === 'idle') { ease(0, 0, 4); if (dist < UNIT * 5) { e.mode = 'stalk'; e.t = 1.5; } }
      else if (e.mode === 'stalk') { ease(dx / dist * UNIT * 1.4, dy / dist * UNIT * 1.4, 3); if (e.t <= 0 && dist < UNIT * 2.6) { e.mode = 'rear'; e.t = 0.5; } else if (e.t <= 0) e.t = 1.2; }
      else if (e.mode === 'rear') { ease(0, 0, 10); if (e.t <= 0) { e.mode = 'lunge'; e.t = 0.35; e.vx = dx / dist * UNIT * 9; e.vy = dy / dist * UNIT * 9; } }
      else if (e.mode === 'lunge') { if (e.t <= 0) { e.mode = 'stalk'; e.t = 1.4; } }

// shared bits of the table
function fleeAfterHit(e) { e.mode = 'flee'; e.t = 1.0; e.cool = 2; }
function stunOnStab(e, kind) { if (kind === 'stab' && (state.inv.horn || Math.random() < STAB.knockChance)) { e.mode = 'stunned'; e.t = 1.0; } return true; }
const monster = e => MONSTERS[e.type] || {};        // the entry (empty for anything that isn't a monster: the hero, Pip)

function makeEnemy(type, x, y, idx, poolIdx) {
  const b = { type, idx, x, y, vx: 0, vy: 0, t: 0, cool: 0, lx: 0, ly: 0, flash: 0, dead: false, hgt: 0, poolIdx: poolIdx == null ? null : poolIdx };
  return { ...b, ...MONSTERS[type].stats(UNIT, b) };
}
function hittable(e) {
  if (e.dead || e.taunter) return false;                 // the taunting gremlin is never where your blade is
  const M = monster(e);
  return M.hittable ? M.hittable(e) : true;
}
function resumeMode(e) {
  const m = monster(e).resume || ['idle', 1];         // anything without an entry picks itself back up (this was the High Reaches freeze)
  e.mode = m[0]; e.t = m[1];
}
function spark(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = UNIT * speed * (0.4 + Math.random());
    state.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.35 + Math.random() * 0.25, color });
  }
}
function updateFx(dt) {
  for (let i = state.fx.length - 1; i >= 0; i--) {
    const p = state.fx[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.color !== 'streak' && p.color !== 'leaf') { p.vx *= 0.9; p.vy *= 0.9; }
    if (p.t > p.life) state.fx.splice(i, 1);
  }
}

function damage(e, amount, kind, nx, ny, bowl) {
  e.hp -= amount; e.hitT = state.time;
  e.flash = kind === 'fire' ? 0.06 : 0.15;
  if (kind !== 'fire') { spark(e.x - nx * e.r * 0.6, e.y - ny * e.r * 0.6, '#ffe7b0', kind === 'stab' ? 8 : 5, 4); sfx.whack(); zoomPulse(e.x, e.y, 'hit'); }
  if (e.hp <= 0) return kill(e);
  if (e.mode === 'sleep' || e.mode === 'dormant') resumeMode(e);
  const M = monster(e);
  if (M.onHit && M.onHit(e, kind, nx, ny, bowl)) return;
  const knock = bowl || (kind === 'stab' && (state.inv.horn || Math.random() < STAB.knockChance));
  if (knock) { e.vx = nx * 0.9 * L(); e.vy = ny * 0.9 * L(); e.mode = 'stunned'; e.t = 0.7; state.shake = 0.2; }
  else { e.vx += nx * 0.2 * L(); e.vy += ny * 0.2 * L(); }
}

function kill(e) {
  e.dead = true; e.mode = 'dead'; e.t = 0.9; e.vx = 0; e.vy = 0;
  sfx.death();
  state.shake = 0.3;
  spark(e.x, e.y, '#6b1a1a', 14, 3);
  if (e.idx >= 0) rtFor(state.scene).deadAt[e.idx] = state.playTime;
  const t = dropFor(e);
  if (t) {
    state.items.push({ type: t, x: e.x, y: e.y });
    if (RELICS[t] || t === 'scalp' || t === 'warden') relicMoment(t, e.x, e.y);
  }
  const M = monster(e);
  if (M.onKill && M.onKill(e)) return;
  zoomPulse(e.x, e.y, 'kill');
}

function parry(e) {
  const h = state.hero, M = monster(e);
  const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
  sfx.clang();
  spark((e.x + h.x) / 2, (e.y + h.y) / 2, '#ffd23a', 12, 5);
  state.shake = 0.15;
  zoomPulse((e.x + h.x) / 2, (e.y + h.y) / 2, 'parry');
  h.vx -= dx / d * 0.25 * L(); h.vy -= dy / d * 0.25 * L();
  h.invuln = Math.max(h.invuln, 0.35);
  if (M.onParry && M.onParry(e)) return;
  e.mode = 'stunned';
  e.t = M.parryStun || 1.2;
  if (!M.rooted) { e.vx = dx / d * 0.7 * L(); e.vy = dy / d * 0.7 * L(); }
}

function updateEnemies(dt) {
  const h = state.hero;
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i], M = monster(e);
    const dx = h.x - e.x, dy = h.y - e.y, dist = Math.hypot(dx, dy) || 1;
    const ease = (tx, ty, rate) => { const k = 1 - Math.exp(-rate * dt); e.vx += (tx - e.vx) * k; e.vy += (ty - e.vy) * k; };
    e.t -= dt; e.cool -= dt; e.flash -= dt;
    if (e.mode === 'dead') { if (e.t <= 0) state.enemies.splice(i, 1); continue; }
    if (e.falling > 0) {                                // tumbling into a ravine or the river
      e.falling -= dt;
      if (e.falling <= 0) { e.mode = 'dead'; e.dead = true; e.t = 0; if (e.idx >= 0) rtFor(state.scene).deadAt[e.idx] = state.playTime; }
      continue;
    }
    const ox = e.x, oy = e.y;
    const burning = (e.burn || 0) > 0;
    if (burning) {
      e.burn -= dt;
      e.burnTick = (e.burnTick || 0) - dt;
      if (e.burnTick <= 0) { e.burnTick = 0.6; damage(e, 0.5, 'fire', 0, 0); if (Math.random() < 0.4) sfx.sizzle(); if (e.dead) continue; }
      if (Math.random() < dt * 14) state.fx.push({ x: e.x + (Math.random() - 0.5) * e.r, y: e.y - e.r * 0.3, vx: 0, vy: -UNIT * 1.4, t: 0, life: 0.5, color: Math.random() < 0.5 ? '#ffb347' : '#ff6a2a' });
    }
    if (burning && !M.boss && !['ceiling', 'submerged', 'ripple', 'sink'].includes(e.mode)) {
      // too busy being on fire to fight: runs about wildly
      if ((e.panicT || 0) <= 0) { e.panicT = 0.35; const a = Math.random() * 6.28; e.lx = Math.cos(a); e.ly = Math.sin(a); }
      e.panicT -= dt;
      ease(e.lx * 0.35 * L(), e.ly * 0.35 * L(), 6);
      if (M.water) { e.x += e.vx * dt; e.y += e.vy * dt; }
    }
    else if (e.mode === 'stunned') { ease(0, 0, 4); if (e.t <= 0) resumeMode(e); }
    else if (e.taunter) { tauntAI(e, dx, dy, dist, dt); continue; }
    else if (M.flies) { M.ai(e, dx, dy, dist, ease, dt); continue; }   // its own movement, no walls
    else M.ai(e, dx, dy, dist, ease, dt);

    if (!M.water) { e.x += e.vx * dt; e.y += e.vy * dt; }
    const ground = !(M.airborne && M.airborne(e)) && !M.water;
    let bump = false;
    const escaping = !!(M.slips && M.slips(e));
    if (ground && !escaping) bump = collideSolids(e, e.r * 0.85);
    const lunging = e.mode === 'lunge' || e.mode === 'charge';
    if (bump && bump.kind === 'stalagmite' && lunging) quake(bump, e);
    if (!escaping) bump = clampTo(e, e.r) || bump;
    const scn = sceneDef();
    if (ground && !escaping && !M.boss && (scn.chasms || scn.river || scn.deep) && isChasm(e.x, e.y)) {
      const carried = ['dart', 'charge', 'lunge', 'flee'].includes(e.mode) || state.time - (e.hitT || -9) < 0.8 || (e.panicT || 0) > 0;
      if (carried) {                                   // no stopping at that speed: over the edge
        e.falling = 0.7; e.vx *= 0.3; e.vy *= 0.3; sfx.plummet(); spark(e.x, e.y, 'rgba(160,140,110,.8)', 6, 2);
        say('Over the edge!', e.x, e.y - UNIT, { key: 'fallen', life: 1.2, color: '#b8f28a' });
      } else { e.x = ox; e.y = oy; e.vx *= -0.3; e.vy *= -0.3; }   // walking, it stops at the lip
    }
    if (lunging && h.dashT > 0 && !state.dodged && dist < e.r + UNIT * 1.3) {
      state.dodged = true; state.slowmo = state.inv.step >= 2 ? 0.7 : 0.45;
      zoomPulse(h.x, h.y, 'parry'); sfx.flip();
      heroNote('Perfect dodge!', 1.2, { key: 'dodge', life: 1, color: '#ffe38a' });
    }
    if (sceneDef().feat.falls && e.x > W - UNIT * 2.3 - e.r) { e.x = W - UNIT * 2.3 - e.r; bump = true; }
    if (bump && lunging && M.crash !== false) {         // into a wall at full tilt
      e.mode = 'stunned'; e.t = M.boss ? 2.0 : 1.2;
      state.shake = M.boss ? 0.5 : 0.2; sfx.crash();
      zoomPulse(e.x, e.y, M.boss ? 'kill' : 'hit');
      spark(e.x, e.y, '#8a7a6a', 10, 3);
    }

    if (M.touches && M.touches(e) && !burning && h.invuln <= 0 && h.z < UNIT * 0.5 && dist < (e.r + UNIT * 0.45) * 0.95) {
      const facing = (-dx * h.fx - dy * h.fy) / dist;
      if (slashActive() && facing > 0.2) parry(e);
      else if (hurtHero(e.dmg, e.x, e.y) && M.afterHit) M.afterHit(e);
    }
  }
}

// something lunging into a stalagmite shakes the stalactites above loose
function quake(sg, e) {
  if ((state.stalCool[sg.key] || 0) > state.time) return;
  state.stalCool[sg.key] = state.time + 6;
  sfx.crash(); state.shake = 0.5;
  const n = monster(e).boss ? 3 : 1;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, d = i ? UNIT * rr(0.2, 0.7) : 0;
    state.hazards.push({ x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d, t: -0.25 - i * 0.12, dur: 0.75, r: UNIT * 0.75, edmg: 3, kind: 'stalactite' });
  }
  say('The ceiling shakes loose!', sg.x, sg.y - UNIT * 1.6, { key: 'quake', tip: 'quake', life: 2.5 });
}
// falling rocks and shockwaves from the boss
function updateHazards(dt) {
  const h = state.hero;
  for (let i = state.hazards.length - 1; i >= 0; i--) {

  const lvl = skillLevel('acorn'), sp = Math.hypot(s.vx, s.vy);

// a proper kit for testing: sword, acorns, fire, the relics at level I, food; seeds, materials and every recipe once
function arenaKit() {
  const inv = state.inv;

  if (!inv.arenaStocked) {
    inv.arenaStocked = true;
    for (const f of FORGE) inv.recipes[f.k] = true;
    Object.assign(inv.bag, { seed: 6, thornseed: 3, emberseed: 2, ironseed: 2, starseed: 1 });
    Object.assign(inv.mats, { thorn: 4, ember: 2, ironwood: 3, starpetal: 1, ear: 2, hide: 1 });
  }
  while (inv.food.length < 6) inv.food.push(['squash', 'carrot', 'fish', 'turnip'][inv.food.length % 4]);
  setEquip('sword');

}
function startArena() {
  state.cut = null; state.night = 0; state.rain = 0; state.arena = null;

function enterZone(key) {

}
function arenaEnter(id) {
  if (id === 'arena') { state.arena = null; arenaKit(); say('Rested and restocked.', null, null, { key: 'arena', life: 1.6, color: '#b8f28a' }); return; }
  const a = state.arena;

  if (id !== a.scene) { state.arena = null; return; }  // walked off the zone's screen: the waves stop
  state.enemies = [];                               // only the waves fight you here
  a.wave = 0; a.phase = 'ready'; a.t = 2.5;

function arenaSpawnWave() {
  const a = state.arena, h = state.hero, sc = sceneDef(), spec = a.zone.waves[a.wave];
  let pool = 0;
  for (const [type, count] of spec) for (let k = 0; k < count; k++) {
    let x, y, tries = 0;
    do { x = W * rr(0.15, 0.85); y = H * rr(0.2, 0.8); tries++; }
    while (tries < 60 && (Math.hypot(x - h.x, y - h.y) < UNIT * 5 || isChasm(x, y, UNIT) || state.solids.some(s => Math.hypot(x - s.x, y - s.y) < s.r + UNIT)));

    if (type === 'lurker') { const p = state.pools[pool % state.pools.length]; e = makeEnemy('lurker', p.x, p.y, -1, pool % state.pools.length); e.pool = p; pool++; }

function updateArena(dt) {
  const a = state.arena;
  if (!a) return;
  a.t -= dt;
  const alive = state.enemies.filter(e => !e.dead).length;
  if (a.phase === 'ready' && a.t <= 0) { a.phase = 'fight'; arenaSpawnWave(); zoomPulse(state.hero.x, state.hero.y, 'title'); }

      const recs = puzzleRecords(); const r = recs['zone:' + a.key] || (recs['zone:' + a.key] = { clears: 0 }); r.clears = (r.clears || 0) + 1; savePuzzleRecords(recs);

// wave status, top centre, kept out of the text layout
function drawArenaBanner() {

// ===== puzzles.js: ?puzzle mode: the puzzle hub and runs.

// =====================================================================
// Puzzle test mode: index.html?puzzle. A hub of portal stones, one per puzzle in the real world.

var PUZZLE = typeof location !== 'undefined' && /(^|[?&])puzzle(=|&|$)/.test(location.search);
const PUZZLES = [
  { id: 'thicket', name: 'Glade brambles', scene: 'start', at: [0.2, 0.5], solved: () => broken('start', 'thicket') },
  { id: 'gate', name: 'Knock the prop', scene: 'w1', at: [0.06, 0.5], solved: () => broken('w1', 'crack1') },
  { id: 'ring', name: 'Mud wallow', scene: 'w2', at: [0.06, 0.5], solved: () => broken('w2', 'crack2') },
  { id: 'sword', name: 'Sword clearing', scene: 'w3', at: [0.06, 0.5], solved: () => !!state.inv.sword },
  { id: 'crags', name: 'The crags', scene: 'peak1', at: [0.06, 0.5], solved: () => state.scene === 'peak3' },
  { id: 'ford', name: 'Stepping stones', scene: 'ford', at: [0.5, 0.95], solved: () => state.scene === 'farbank' || (state.scene === 'ford' && state.hero.y < H * (0.5 - WORLD.ford.river.wH / 2)) },
  { id: 'rapids', name: 'Rapids', scene: 'rapids', raft: true, solved: () => state.scene === 'gleampool' },
  { id: 'reeds', name: 'Marsh reeds', scene: 'm3', at: [0.06, 0.5], fire: true, solved: () => broken('m3', 'reeds') },
  { id: 'webs', name: 'Web wall', scene: 'h2', at: [0.06, 0.5], fire: true, solved: () => broken('h2', 'webs') },

function puzzleRecords() { try { return JSON.parse(localStorage.getItem('quest-puzzles') || '{}'); } catch (e) { return {}; } }
function savePuzzleRecords(r) { try { localStorage.setItem('quest-puzzles', JSON.stringify(r)); } catch (e) {} }
function genPuzzleHub(seed) {

function startPuzzleHub() {

function enterPuzzle(p) {

function updatePuzzle(dt) {

function drawPuzzlePortals(sc) {
