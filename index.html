<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest</title>
<style>
  :root { --ink: #fdf6e3; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: "Courier New", monospace; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #sound { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: rgba(0,0,0,.35); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: .9rem; }
  #pad { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; opacity: .85; }
  #pad button, .abtn { background: rgba(0,0,0,.38); color: var(--ink); border: 0; touch-action: none; font: inherit; }
  #pad button { font-size: 1.3rem; border-radius: 8px; }
  #pad button:active, .abtn:active { background: rgba(0,0,0,.65); }
  .abtn { position: fixed; border-radius: 50%; font-weight: bold; opacity: .85; }
  #act  { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; font-size: 1.5rem; }
  #dash { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #eat  { right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #jump { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; font-size: .85rem; }
  #throw { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .75rem; }
  #fire { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(164px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #menubtn { left: calc(12px + env(safe-area-inset-left, 0px)); top: auto; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 10px; font-size: 1.2rem; }
  .hidden { display: none; }
  @media (pointer: fine) and (min-width: 900px) { #pad, .abtn { display: none !important; } }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #3f8f4c; font-size: 1.4rem; letter-spacing: 2px; cursor: pointer; text-align: center; padding: 20px; }
  #start small { font-size: .9rem; letter-spacing: 1px; opacity: .85; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="sound">sound: on</button>
<div id="pad">
  <span></span><button data-dir="up">&#9650;</button><span></span>
  <button data-dir="left">&#9664;</button><span></span><button data-dir="right">&#9654;</button>
  <span></span><button data-dir="down">&#9660;</button><span></span>
</div>
<button id="act" class="abtn">A</button>
<button id="jump" class="abtn">jump</button>
<button id="throw" class="abtn hidden">throw</button>
<button id="dash" class="abtn hidden">dash</button>
<button id="eat" class="abtn hidden">eat</button>
<button id="fire" class="abtn hidden">fire</button>
<button id="menubtn" class="abtn">&#9776;</button>
<div id="start"><div>tap to begin</div><small id="startHint"></small></div>
<script>
'use strict';
// =====================================================================
// Screen
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
// Keys are remappable from the menu. K holds the on-screen names used in hints.
const DEFAULT_KEYS = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', act: 'f', jump: ' ', throw: 'd', dash: 'a', eat: 's', fire: 'e', menu: 'm' };
const ACTION_NAMES = { up: 'Move up', down: 'Move down', left: 'Move left', right: 'Move right', act: 'Sword / grab / talk', jump: 'Jump', throw: 'Throw', dash: 'Dodge', eat: 'Eat', fire: 'Marsh fire', menu: 'Menu' };
const K = {};
function keyName(k) { return { ' ': 'Space', arrowup: '\u2191', arrowdown: '\u2193', arrowleft: '\u2190', arrowright: '\u2192', escape: 'Esc', enter: 'Enter' }[k] || (k.length === 1 ? k.toUpperCase() : k); }
function refreshK() {
  if (TOUCH) Object.assign(K, { act: 'A', jump: 'jump', throw: 'throw', dash: 'dodge', eat: 'eat', fire: 'fire', menu: 'menu', l: '\u25C0', r: '\u25B6', u: '\u25B2' });
  else { const m = (state && state.settings && state.settings.keys) || DEFAULT_KEYS; for (const a in DEFAULT_KEYS) K[a] = keyName(m[a]); K.l = K.left; K.r = K.right; K.u = K.up; }
}
var state;
refreshK();
document.getElementById('startHint').textContent = TOUCH ? 'd-pad to move, A to act' : 'arrow keys to move, F to act, Space to jump, M for menu';
let W = window.innerWidth, H = window.innerHeight, UNIT = 32, DPR = window.devicePixelRatio || 1;
const computeUnit = () => { UNIT = Math.max(20, Math.min(W, H) / 14); };
computeUnit();
const L = () => Math.max(W, H);

// =====================================================================
// Random (seeded per adventure; the seed is what a save file stores)
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;
const rr = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp01 = v => Math.max(0.04, Math.min(0.96, v));

// =====================================================================
// World generation (done at a fixed virtual size so a seed always
// produces the same world on any screen)
// =====================================================================
const AREA_NAMES = { forest: 'The Glade', woods: 'The Deep Woods', field: 'The Windswept Field', cave: 'The Dank Cave', marsh: 'The Marsh', hollow: 'The Hollow Beneath' };
const OPP = { n: 's', s: 'n', e: 'w', w: 'e' };
const BEANS = 6;              // one lies about early; the rest turn up once you've met the one who lost them

function edgePoint(side, along) {
  if (side === 'n') return [along, 0.03];
  if (side === 's') return [along, 0.97];
  if (side === 'w') return [0.03, along];
  return [0.97, along];
}
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function makePath(a, b, bends) {
  const pts = [a];
  for (let i = 1; i <= bends; i++) {
    const t = i / (bends + 1);
    pts.push([clamp01(a[0] + (b[0] - a[0]) * t + rr(-0.22, 0.22)), clamp01(a[1] + (b[1] - a[1]) * t + rr(-0.2, 0.2))]);
  }
  pts.push(b);
  return pts;
}
function inRects(rects, fx, fy, pad = 0) { return rects.some(([x0, y0, x1, y1]) => fx > x0 - pad && fx < x1 + pad && fy > y0 - pad && fy < y1 + pad); }
function clearSpot(sc, fx, fy, rU, pathW, keep) {
  const x = fx * W, y = fy * H, r = rU * UNIT;
  for (const p of sc.paths) for (let i = 0; i < p.length - 1; i++)
    if (distSeg(x, y, p[i][0] * W, p[i][1] * H, p[i + 1][0] * W, p[i + 1][1] * H) < pathW * UNIT + r) return false;
  for (const k of keep) if (Math.hypot(x - k[0] * W, y - k[1] * H) < k[2] * UNIT + r) return false;
  for (const s of sc.solids) if (Math.hypot(x - s.fx * W, y - s.fy * H) < (s.r + rU) * UNIT * 0.85) return false;
  if (sc.chasms && inRects(sc.chasms, fx, fy, 0.04)) return false;
  return true;
}
// Every solid carries a look: variant (branch pattern), flip, palette.
function solid(fx, fy, r, kind, pal, extra) { return Object.assign({ fx, fy, r, kind, v: Math.floor(rng() * 3), flip: rng() < 0.5, pal: pal || null }, extra); }
function scatter(sc, n, kind, rMin, rMax, pathW, keep = [], box = [0.06, 0.94, 0.08, 0.92], pal) {
  let placed = 0;
  for (let tries = 0; tries < n * 60 && placed < n; tries++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]), r = rr(rMin, rMax);
    if (clearSpot(sc, fx, fy, r, pathW, keep)) { sc.solids.push(solid(fx, fy, r, kind, pal)); placed++; }
  }
}
function edgeWall(sc, side, kind, rU, gaps, density = 1.6, pal) {
  const horiz = side === 'n' || side === 's', len = horiz ? W : H;
  const step = rU * UNIT * density, n = Math.ceil(len / step) + 1;
  for (let i = 0; i < n; i++) {
    const along = (i * step + rr(-0.15, 0.15) * step) / len;
    if (along < -0.02 || along > 1.02) continue;
    const margin = rU * UNIT * 1.2 / len;
    if (gaps.some(([a, b]) => along > a - margin && along < b + margin)) continue;
    const inset = rU * UNIT * 0.45, r = rU * rr(0.85, 1.2);
    const [fx, fy] = side === 'n' ? [along, inset / H] : side === 's' ? [along, 1 - inset / H]
      : side === 'w' ? [inset / W, along] : [1 - inset / W, along];
    sc.solids.push(solid(fx, fy, r, kind, pal));
  }
}
// A barrier is a line of solids sharing an id; breaking it removes them all.
function barrier(sc, id, kind, x0, y0, x1, y1, rU = 0.6) {
  const n = Math.max(2, Math.ceil(Math.hypot((x1 - x0) * W, (y1 - y0) * H) / (rU * UNIT * 1.2)));
  for (let i = 0; i <= n; i++) sc.solids.push(solid(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, rU, kind, null, { bar: id }));
}
function ringBarrier(sc, id, kind, cx, cy, radU, rU = 0.5) {
  for (let a = 0; a < 6.28; a += 0.55) sc.solids.push(solid(cx + Math.cos(a) * radU * UNIT / W, cy + Math.sin(a) * radU * UNIT / H, rU, kind, null, { bar: id }));
}
function gapAt(c, half = 0.09) { return [Math.max(0.1, c - half), Math.min(0.9, c + half)]; }
function freeSpot(sc, box, rU, keep = []) {
  for (let i = 0; i < 200; i++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]);
    if (sc.chasms && inRects(sc.chasms, fx, fy, 0.05)) continue;
    if (sc.solids.every(s => Math.hypot(fx * W - s.fx * W, fy * H - s.fy * H) > (s.r + rU) * UNIT) &&
        keep.every(k => Math.hypot(fx * W - k[0] * W, fy * H - k[1] * H) > k[2] * UNIT)) return [fx, fy];
  }
  return [rr(box[0], box[1]), rr(box[2], box[3])];
}
function decoFlowers(sc, n) {
  const cols = ['#f3e37a', '#f2f2f2', '#e98ac0', '#9fc6f5'];
  for (let i = 0; i < n; i++) sc.deco.push({ kind: 'flower', fx: rng(), fy: rng(), c: pick(cols) });
  for (let i = 0; i < 30; i++) sc.deco.push({ kind: 'grass', fx: rng(), fy: rng(), s: rr(0.5, 1) });
}
// farm patches: a few tilled plots near the path; what grows depends on the region
function addPlots(sc, n, box) {
  sc.feat.plots = sc.feat.plots || [];
  const c = freeSpot(sc, box, 2.2);
  for (let i = 0; i < n; i++) sc.feat.plots.push([c[0] + (i % 3) * 0.035 - 0.035, c[1] + Math.floor(i / 3) * 0.06]);
}
function newScene(o) {
  return Object.assign({ solids: [], deco: [], spawns: [], pullables: [], exits: [], pools: [], paths: [], feat: {}, npcs: [], initItems: [], speed: 0.5, accel: 10, shade: 0 }, o);
}

const GEN = { W: 1280, H: 800 };
function buildWorld(seed) {
  const saved = [W, H, UNIT];
  W = GEN.W; H = GEN.H; computeUnit();
  rng = mulberry32(seed >>> 0);
  try { return genWorld(); } finally { [W, H, UNIT] = saved; rng = mulberry32((seed ^ 0x9e3779b9) >>> 0); }
}

function genWorld() {
  const S = {};
  const add = sc => (S[sc.id] = sc);

  // ---------------- Camp (north of start): home, fire, tent, farm plots ----------------
  const camp = add(newScene({ id: 'camp', area: 'forest', msg: '', music: 'forest', amb: 'none', floor: '#4a8f4c', heroStart: [0.44, 0.5] }));
  camp.exits = [{ side: 's', a: 0.4, b: 0.6, to: 'start' }];
  camp.feat.fire = [0.5, 0.45];
  camp.feat.plots = [[0.2, 0.68], [0.28, 0.68], [0.36, 0.68], [0.2, 0.8], [0.28, 0.8], [0.36, 0.8]];
  camp.feat.pip = [0.58, 0.44];
  camp.solids.push(solid(0.5, 0.45, 0.45, 'campfire'), solid(0.33, 0.33, 1.1, 'tent'), solid(0.64, 0.34, 0.6, 'bench'));
  camp.feat.bench = [0.64, 0.34];
  camp.paths = [makePath([0.5, 0.97], [0.5, 0.55], 1), makePath([0.45, 0.55], [0.28, 0.74], 0)];
  edgeWall(camp, 'n', 'tree', 1.1, [], 1.5, 'green');
  edgeWall(camp, 'w', 'tree', 1.1, [], 1.6, 'green');
  edgeWall(camp, 'e', 'tree', 1.1, [], 1.6, 'green');
  scatter(camp, 6, 'tree', 0.9, 1.2, 1.4, [[0.45, 0.5, 5], [0.28, 0.74, 4]], undefined, 'green');
  decoFlowers(camp, 20);

  // ---------------- Start glade: the big rock, the thicket into the woods ----------------
  const start = add(newScene({ id: 'start', area: 'forest', msg: '', music: 'forest', amb: 'none', floor: '#3f8f4c', heroStart: [0.5, 0.12] }));
  start.feat.pip = [0.84, 0.5];
  start.exits = [
    { side: 'n', a: 0.4, b: 0.6, to: 'camp' },
    { side: 'w', a: 0.38, b: 0.62, to: 'meadow' },
    { side: 's', a: 0.42, b: 0.58, to: 'f1' },
    { side: 'e', a: 0.4, b: 0.6, to: 'w1', locked: () => !broken('start', 'thicket') },
  ];
  const rock = [rr(0.58, 0.7), rr(0.3, 0.7)];
  start.pullables.push({ id: 'rock', kind: 'rock', fx: rock[0], fy: rock[1], need: 5 });
  start.feat.scarf = [0.93, 0.47];
  barrier(start, 'thicket', 'bramble', 0.955, 0.36, 0.955, 0.64, 0.65);
  start.solids.forEach(s => { if (s.bar === 'thicket') s.showFlag = 'ambush'; });
  start.paths = [[0.5, 0.03], [0.03, 0.5], [0.5, 0.97], [0.93, 0.5], rock].map(p => makePath([0.5, 0.5], p, 1));
  scatter(start, 11, 'tree', 0.9, 1.3, 1.5, [[...rock, 3], [0.9, 0.5, 3]], undefined, 'green');
  addPlots(start, 2, [0.15, 0.4, 0.6, 0.85]);
  decoFlowers(start, 26);

  // ---------------- Meadow (west): the robin's dead tree ----------------
  const meadow = add(newScene({ id: 'meadow', area: 'forest', msg: 'Birdsong drifts over the meadow', music: 'forest', amb: 'none', floor: '#4a9650' }));
  meadow.exits = [{ side: 'e', a: 0.38, b: 0.62, to: 'start' }];
  meadow.paths = [makePath([0.97, 0.5], [0.3, 0.5], 2)];
  meadow.feat.perches = [];
  for (let i = 0; i < 3; i++) {
    const p = freeSpot(meadow, [0.12, 0.8, 0.18, 0.85], 2.8);
    meadow.solids.push(solid(p[0], p[1], 0.9, 'deadtree', 'grey'));
    meadow.feat.perches.push(p);
  }
  scatter(meadow, 7, 'tree', 0.9, 1.3, 1.4, meadow.feat.perches.map(p => [...p, 2.2]), undefined, 'green');
  addPlots(meadow, 3, [0.5, 0.85, 0.2, 0.8]);
  decoFlowers(meadow, 60);

  // ---------------- Deep woods (east): denser, darker, the sword in the shadows ----------------
  let west = [0.4, 0.6];
  for (let i = 1; i <= 3; i++) {
    const last = i === 3;
    const sc = add(newScene({
      id: 'w' + i, area: 'woods', depth: i, msg: ['Drag marks lead deeper', 'Cackling, somewhere ahead', 'Something glints in the shadows'][i - 1],
      music: 'woods', amb: 'none', floor: ['#35743e', '#2d6436', '#26552f'][i - 1], shade: [0.3, 0.5, 0.68][i - 1], speed: 0.48,
    }));
    const east = last ? null : gapAt(rr(0.25, 0.75), 0.1);
    sc.exits.push({ side: 'w', a: west[0], b: west[1], to: i === 1 ? 'start' : 'w' + (i - 1) });
    if (east) sc.exits.push({ side: 'e', a: east[0], b: east[1], to: 'w' + (i + 1) });
    edgeWall(sc, 'n', 'tree', 1.2, [], 1.3, 'deep');
    edgeWall(sc, 's', 'tree', 1.2, [], 1.3, 'deep');
    edgeWall(sc, 'w', 'tree', 1.2, [west], 1.3, 'deep');
    edgeWall(sc, 'e', 'tree', 1.2, east ? [east] : [], 1.3, 'deep');
    const wPt = edgePoint('w', (west[0] + west[1]) / 2);
    const keep = [];
    if (last) {
      const sword = [rr(0.55, 0.7), pick([0.28, 0.72])];
      sc.feat.stone = [0.86, 1 - sword[1]];
      sc.pullables.push({ id: 'sword', kind: 'sword', fx: sword[0], fy: sword[1], need: 6 });
      sc.solids.push(solid(sword[0], sword[1], 0.55, 'stump'));
      sc.feat.sword = sword;
      sc.paths = [makePath(wPt, [sword[0] - 0.06, sword[1]], 2), makePath([sword[0], sword[1]], sc.feat.stone, 1)];
      keep.push([...sword, 2.2], [...sc.feat.stone, 2.5]);
    } else sc.paths = [makePath(wPt, edgePoint('e', (east[0] + east[1]) / 2), 2 + i)];
    scatter(sc, 12 + i * 8, 'tree', 0.8, 1.3, 1.25 - i * 0.05, keep, [0.08, 0.92, 0.1, 0.9], 'deep');
    if (i === 1) addPlots(sc, 2, [0.3, 0.7, 0.3, 0.7]);
    for (let g = 0; g < i - 1; g++) { const q = freeSpot(sc, [0.3, 0.8, 0.2, 0.8], 1, [[...wPt, 5]]); sc.spawns.push({ type: 'gremlin', fx: q[0], fy: q[1], req: 'sword' }); }
    decoFlowers(sc, 8);
    // sun dapples drift through the canopy; one always wanders over the sword
    sc.feat.dapples = Array.from({ length: 14 - i * 2 }, () => ({ fx: rng(), fy: rng(), r: rr(0.8, 2.0), ax: rr(0.02, 0.06), ay: rr(0.02, 0.05), sp: rr(0.08, 0.2), ph: rng() * 6 }));
    if (last) sc.feat.dapples.push({ fx: sc.feat.sword[0], fy: sc.feat.sword[1], r: 1.1, ax: 0.07, ay: 0.06, sp: 0.35, ph: 0, sword: true });
    west = east;
  }

  // ---------------- Windswept field (south): a wind puzzle that builds up ----------------
  // a = angle (0 blows south, + toward east, PI blows north), s = strength (1 strong, .5 weak).
  // A strong gust carries you 0.3 of the screen height; a weak one only 0.14.
  // Every crossing also has a way back: a strong north gust.
  // Higher up the mountain, some gusts are too strong (s 2): jump into one and it throws you back to the foothill farm.
  // Ride a gust by jumping while it blows.
  const N = { a: Math.PI, s: 1 }, TOO = { a: Math.PI, s: 2 };
  const FIELD = [
    { msg: 'The mountain path begins', gusts: [{ a: -0.3, s: 0.6 }, { a: 0.3, s: 0.6 }], chasms: [], ups: [], sock: [0.5, 0.4], rabbits: 0 },
    { msg: 'Rabbits. They don\'t look friendly.', gusts: [{ a: 0, s: 0.8 }], chasms: [], ups: [], sock: [0.5, 0.35], rabbits: 1 },
    { msg: 'A ravine. Too wide to jump.', gusts: [{ a: 0, s: 0.5 }, { a: 0, s: 1 }, N], chasms: [[0, 0.42, 1, 0.6]], ups: [[rr(0.3, 0.7), 0.35], [rr(0.3, 0.7), 0.66]], rabbits: 1, south: [0.2, 0.8] },
    { msg: 'The far bank is broken', gusts: [{ a: 0.6, s: 1 }, { a: 0, s: 0.5 }, { a: -0.6, s: 1 }, N], chasms: [[0, 0.42, 1, 0.6], [0.45, 0.6, 1, 0.8]], ups: [[0.5, 0.35], [0.22, 0.66]], rabbits: 1, south: [0.12, 0.3] },
    { msg: 'Two ravines', gusts: [{ a: 0, s: 0.5 }, { a: 0, s: 1 }, { a: 0.3, s: 0.5 }, N], chasms: [[0, 0.3, 1, 0.46], [0, 0.6, 1, 0.76]], ups: [[rr(0.3, 0.7), 0.25], [rr(0.3, 0.7), 0.52], [rr(0.3, 0.7), 0.81]], rabbits: 2, south: [0.2, 0.8], extra: TOO },
    { msg: 'The rabbits guard every crossing', gusts: [{ a: 0.6, s: 1 }, { a: 0, s: 0.5 }, { a: -0.6, s: 1 }, { a: 0, s: 1 }, N], chasms: [[0, 0.3, 1, 0.46], [0, 0.6, 1, 0.76], [0.45, 0.76, 1, 0.9]], ups: [[0.5, 0.25], [0.5, 0.52], [0.22, 0.81]], rabbits: 2, south: [0.12, 0.3], extra: TOO },

let WORLD = {};

let RT = {};                   // runtime memory per scene: dead spawns, items, pulled things, flags
function rtFor(id) {
  if (!RT[id]) {
    const sc = WORLD[id];
    RT[id] = { deadAt: {}, items: sc ? sc.initItems.map(i => ({ ...i })) : [], pulled: new Set(), flags: {}, bossDead: false };
  }
  return RT[id];
}
const broken = (id, bar) => !!(RT[id] && RT[id].flags[bar]);

// vigor grows geometrically with depth (relics, the tortoise) and a little with training
const baseVig = depth => Math.round(8 * Math.pow(1.5, depth));
function newHero() { return { x: W * 0.5, y: H * 0.5, vx: 0, vy: 0, z: 0, stun: 0, invuln: 0, hurtT: -9, fx: 0, fy: 1, side: 1, vig: 8, rest: 0, dashT: 0, dashCool: 0, ride: null, falling: 0, safe: null }; }
// step, silk, horn are levelled relics (0 = not found, up to 3)
// seeds: common 'seed' grows the local food; rarer seeds grow crafting materials
function newInv() { return { bag: { seed: 0, thornseed: 0, emberseed: 0, ironseed: 0, starseed: 0 }, mats: { thorn: 0, ember: 0, ironwood: 0, starpetal: 0 }, up: { edge: 0, temper: 0, guard: 0, pouch: 0, star: 0 }, vigBonus: 0, xp: 0, tlevel: 0, sword: false, scalp: false, step: 0, silk: 0, horn: 0, fire: false, food: [], acorns: 0, seeds: 0, beans: 0, lumin: 0, slime: 0, pepper: 0, depth: 0, tortoise: false }; }
function newPull(id) { return { id, grip: false, wiggle: 0, lastSide: 0, tilt: 0, tries: 0, hinted: false }; }
const maxVig = () => baseVig(state.inv.depth + state.inv.tlevel * 0.25 + (state.inv.up.star ? 1 : 0)) + state.inv.vigBonus;

// =====================================================================
// Input: arrows move. F sword/grab/talk, D throw, A dash, S eat, E marsh fire,
// Space menu. R starts over at the ending.
// =====================================================================
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  if (!state.started) { begin(); return; }
  if (e.repeat) return;
  if (state.remap) { assignKey(state.remap, k); return; }
  state.keys[k] = true;
  if (k === 'r' && state.won) newGame();
  if ((k === state.settings.keys.menu || k === 'escape') && !state.won) toggleMenu();
});
function assignKey(action, k) {
  if (k === 'escape') { state.remap = null; return; }
  const map = state.settings.keys;
  for (const a in map) if (map[a] === k) map[a] = map[action];     // swap if the key was taken
  map[action] = k;
  state.remap = null; state.keys = {}; state.prevKeys = {};
  refreshK(); saveSettings(); sfx.pickup();
}
window.addEventListener('keyup', e => { state.keys[e.key.toLowerCase()] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const map = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright' };
  bindHold(b, map[b.dataset.dir]);
});
function bindHold(el, key) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); state.keys[key] = true; begin(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { state.keys[key] = false; }));
}
bindHold(document.getElementById('act'), 'btnact');
bindHold(document.getElementById('jump'), 'btnjump');
bindHold(document.getElementById('throw'), 'btnthrow');
bindHold(document.getElementById('dash'), 'btndash');
bindHold(document.getElementById('eat'), 'btneat');
bindHold(document.getElementById('fire'), 'btnfire');
document.getElementById('menubtn').addEventListener('pointerdown', e => { e.preventDefault(); if (state.started && !state.won) toggleMenu(); });
canvas.addEventListener('pointerdown', e => {
  if (state.won) { newGame(); return; }
  if (state.menu) menuTap(e.clientX, e.clientY);
  else if (state.choice) { const r = (state.choiceRects || []).find(o => e.clientX >= o.x && e.clientX <= o.x + o.w && e.clientY >= o.y && e.clientY <= o.y + o.h); if (r) { const c = state.choice; state.choice = null; c.cb(r.i); } }
});

const kk = a => !!state.keys[state.settings.keys[a]];
const held = {
  act:   () => kk('act') || !!(state.keys.enter || state.keys.btnact),
  jump:  () => kk('jump') || !!state.keys.btnjump,
  throw: () => kk('throw') || !!state.keys.btnthrow,
  dash:  () => kk('dash') || !!state.keys.btndash,
  eat:   () => kk('eat') || !!state.keys.btneat,
  fire:  () => kk('fire') || !!state.keys.btnfire,
  up:    () => kk('up') || !!state.keys.arrowup,
  down:  () => kk('down') || !!state.keys.arrowdown,
  left:  () => kk('left') || !!state.keys.arrowleft,
  right: () => kk('right') || !!state.keys.arrowright,
};
const pressedNow = {};
function readPresses() {
  for (const k in held) { const v = held[k](); pressedNow[k] = v && !state.prevKeys[k]; state.prevKeys[k] = v; }
}
function inputVector() {
  let x = 0, y = 0;
  if (held.up()) y -= 1;
  if (held.down()) y += 1;
  if (held.left()) x -= 1;
  if (held.right()) x += 1;
  const len = Math.hypot(x, y) || 1;
  return { x: x / len, y: y / len };
}
function refreshButtons() {
  const inv = state.inv;
  document.getElementById('dash').classList.toggle('hidden', !inv.step);
  document.getElementById('dash').textContent = 'dodge';
  document.getElementById('eat').classList.toggle('hidden', !inv.food.length);
  document.getElementById('fire').classList.toggle('hidden', !inv.fire);
  document.getElementById('throw').classList.toggle('hidden', !inv.acorns && !state.carry);
}

let audio, master, musicGain, noiseBuf, soundOn = true;
let currentMusic = 'forest', nextNoteTime = 0, noteIndex = 0, musicTimer = null, nextFrog = 0;

function initAudio() {
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
  master = audio.createGain(); master.gain.value = 0.9; master.connect(audio.destination);
  musicGain = audio.createGain(); musicGain.gain.value = 1; musicGain.connect(master);
  noiseBuf = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
  const d = noiseBuf.getChannelData(0);

function scheduleMusic() {
  const m = MUSIC[currentMusic];
  while (nextNoteTime < audio.currentTime + 0.3) {
    const [mel, bass] = m.loop[noteIndex % m.loop.length];
    const s = Math.max(0, nextNoteTime - audio.currentTime);
    if (mel) tone(midiHz(mel + m.shift), s, m.step * m.lead.len, { type: m.lead.type, vol: m.lead.vol, attack: 0.05, dest: musicGain });
    if (mel && m.shimmer) tone(midiHz(mel) * 2, s, m.step * 0.9, { type: 'sine', vol: 0.025, attack: 0.02, dest: musicGain });
    if (bass) tone(midiHz(bass + m.shift), s, m.step * m.bass.len, { type: m.bass.type, vol: m.bass.vol, attack: m.bass.len < 2 ? 0.01 : 0.3, dest: musicGain });
    nextNoteTime += m.step;
    noteIndex++;
  }
  if (m.frogs && audio.currentTime > nextFrog) {
    const p = Math.random() * 1.6 - 0.8, f = 150 + Math.random() * 80;
    for (let i = 0; i < 2 + (Math.random() * 3 | 0); i++) tone(f, i * 0.13, 0.1, { type: 'square', vol: 0.03, attack: 0.005, to: f * 0.7, pan: p, dest: musicGain });
    nextFrog = audio.currentTime + 1.5 + Math.random() * 4;
  }
}
function setMusic(name) {
  if (!audio) { currentMusic = name; return; }
  if (name === currentMusic) return;
  const t = audio.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(0.0001, t + 0.6);
  currentMusic = name;
  setTimeout(() => {
    noteIndex = 0;
    nextNoteTime = audio.currentTime + 0.1;
    const t2 = audio.currentTime;
    musicGain.gain.cancelScheduledValues(t2);
    musicGain.gain.setValueAtTime(0.0001, t2);
    musicGain.gain.linearRampToValueAtTime(1, t2 + 1.5);
  }, 650);
}
function startMusic() {
  initAudio();
  if (audio.state === 'suspended') audio.resume();
  nextNoteTime = audio.currentTime + 0.1;
  clearInterval(musicTimer);
  musicTimer = setInterval(scheduleMusic, 100);
  setAmbience(pendingAmb);
}

// Ambience beds: wind, waterfall, marsh hum
function setAmbience(type) {
  pendingAmb = type;
  if (!audio) return;
  if (amb && amb.type === type) return;
  if (amb) { const a = amb; a.g.gain.setTargetAtTime(0.0001, audio.currentTime, 0.3); setTimeout(() => { try { a.src.stop(); } catch (e) {} }, 1500); }
  amb = null;
  if (type === 'none') return;
  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = noiseBuf; src.loop = true;
  if (type === 'wind') { f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.7; }
  if (type === 'falls') { f.type = 'lowpass'; f.frequency.value = 900; }
  if (type === 'marsh') { f.type = 'lowpass'; f.frequency.value = 260; }
  if (type === 'rain') { f.type = 'highpass'; f.frequency.value = 1800; }
  g.gain.value = 0.0001;
  src.connect(f).connect(g).connect(master);
  src.start();
  amb = { type, src, f, g, next: 0 };
}

  if (!amb || audio.currentTime < amb.next) return;
  amb.next = audio.currentTime + 0.1;
  amb.g.gain.setTargetAtTime(Math.max(0.0001, v), audio.currentTime, 0.25);
  if (freq) amb.f.frequency.setTargetAtTime(freq, audio.currentTime, 0.3);
}

const ZP = {          // amount, duration, bounces
  tap:    [0.015, 0.25, 1],
  hit:    [0.035, 0.35, 2],
  hurt:   [0.05, 0.45, 2],
  parry:  [0.07, 0.55, 3],
  kill:   [0.09, 0.8, 3],
  pickup: [0.05, 0.6, 2],
  land:   [0.12, 0.9, 4],
  boss:   [0.15, 1.5, 5],
  title:  [0.05, 1.1, 2],

function zoomPulse(x, y, preset) { const [a, d, b] = ZP[preset]; state.cam.pulses.push({ x, y, a, d, b, t: 0 }); }
function updateCam(dt) {
  const c = state.cam;

  for (let i = c.pulses.length - 1; i >= 0; i--) {
    const p = c.pulses[i]; p.t += dt;
    const k = p.t / p.d;
    if (k >= 1) { c.pulses.splice(i, 1); continue; }
    const v = p.a * (1 - k) * (1 - k) * Math.abs(Math.sin(Math.PI * p.b * k));
    add += v; wx += p.x * v; wy += p.y * v; ws += v;
  }
  const f = c.focus;
  const tz = f ? f.z : 1;
  const [tx, ty] = f ? f.at() : [W / 2, H / 2];
  const k = 1 - Math.exp(-(f ? 5 : 3) * dt);
  c.z += (tz - c.z) * k; c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;

  const m = Math.min(1, ws * 5);

  c.ey = ws ? c.y + (wy / ws - c.y) * m : c.y;

const toScreen = (x, y) => [(x - state.cam.ex) * state.cam.ez + W / 2, (y - state.cam.ey) * state.cam.ez + H / 2];

// =====================================================================
// Floating text, anchored near whatever it talks about
// =====================================================================
function say(text, x, y, opts = {}) {
  if (opts.tip) {
    if (state.settings.tips === 'intro' && state.tipsSeen[opts.tip]) return;
    state.tipsSeen[opts.tip] = true;
  }
  if (opts.key) {                                 // same message still showing: keep it, don't restart it
    const o = state.texts.find(o => o.key === opts.key && o.text === text);
    if (o) { o.x = x; o.y = y; o.life = Math.max(o.life, o.t + (opts.life || 3.2) * 0.5); return; }
  }
  const t = { text, x, y, t: 0, life: opts.life || 3.2, key: opts.key || null, follow: x == null, size: opts.size || 1, color: opts.color || '#fdf6e3' };
  if (t.key) state.texts = state.texts.filter(o => o.key !== t.key);

}

function unsay(key) { state.texts = state.texts.filter(o => o.key !== key); }

// =====================================================================
// Scenes: entering, leaving, geometry
// =====================================================================
const sceneDef = () => WORLD[state.scene];

function refreshSceneGeometry() {
  const sc = sceneDef();
  if (!sc) return;
  const rt = rtFor(sc.id);
  const F = { cavewall: 0.95, boulder: 0.95, pillar: 0.95, stalagmite: 0.8, stump: 1, campfire: 1, tent: 0.9, bramble: 1, reeds: 1, web: 1, vine: 1 };
  state.solids = sc.solids.filter(s => !(s.bar && rt.flags[s.bar]) && !(s.showFlag && !rt.flags[s.showFlag])).map((s, i) => ({ ...s, x: s.fx * W, y: s.fy * H, r: s.r * UNIT * (F[s.kind] || 0.45), vis: s.r * UNIT, key: sc.id + ':' + sc.solids.indexOf(s) }));
  state.pools = sc.pools.map(p => ({ x: p.fx * W, y: p.fy * H, r: p.r * UNIT }));
  for (const e of state.enemies) if (e.poolIdx != null) e.pool = state.pools[e.poolIdx];
}

  const rt = rtFor(state.scene);
  if (rt.flags[bar]) return;
  rt.flags[bar] = true;
  if (bar === 'thicket') { const s0 = sceneDef().solids.find(s => s.bar === bar); for (let i = 0; i < 2; i++) state.items.push({ type: 'thornseed', x: s0.fx * W - UNIT * (1 + i), y: s0.fy * H + UNIT * (2 + i) }); }

  refreshSceneGeometry();
  state.shake = 0.3;
  sfx.crash();
  const s0 = sceneDef().solids.find(s => s.bar === bar);

}

function saveScene() {
  const rt = rtFor(state.scene);
  rt.items = state.items.map(it => ({ type: it.type, fx: it.x / W, fy: it.y / H }));
}

function enterScene(id, fx, fy) {
  if (WORLD[state.scene] && RT[state.scene]) saveScene();
  const sc = WORLD[id], rt = rtFor(id);
  state.scene = id;
  state.pull = newPull(null);
  state.atk = null; state.hold = { on: false, t: 0, charged: false }; state.aim.on = false;
  state.npcTalk = null;
  const h = state.hero;
  const pos = fx != null ? [fx, fy] : (sc.heroStart || [0.5, 0.5]);
  Object.assign(h, { x: pos[0] * W, y: pos[1] * H, vx: 0, vy: 0, z: 0, vz: 0, stun: 0, invuln: 0.6, ride: null, falling: 0, dashT: 0, safe: [pos[0], pos[1]] });

    if (s.req && !state.inv[s.req]) return null;

  }).filter(Boolean);

  state.hazards = []; state.rings = []; state.fx = []; state.texts = []; state.shots = []; state.gas = []; state.spark = null;
  state.drops.length = 0; state.splashes.length = 0; state.dripTimer = 1;

  state.gustIdx = 0; state.gustPhase = 'lull'; state.gustT = 0; state.gust = 0;

    showTitle(AREA_NAMES[sc.area], null, 'area', 2.8);
    zoomPulse(h.x, h.y, 'title');
  }

  else if (sc.msg && !state.seen[id]) say(sc.msg, h.x, h.y - UNIT * 0.8, { key: 'scene', life: 3.5 });
  state.seen[id] = true;
  const bossAlive = id === 'c7' && !rt.bossDead;
  setMusic(bossAlive ? 'cave2' : sc.music);
  setAmbience(sc.amb);
  refreshButtons();
}

// arriving at a screen edge: slide along it to the nearest spot not blocked by rocks or trees
function nudgeFree() {
  const h = state.hero, horiz = h.y < UNIT * 2 || h.y > H - UNIT * 2;
  const blocked = (x, y) => state.solids.some(s => Math.hypot(s.x - x, s.y - y) < s.r + UNIT * 0.5) || isChasm(x, y);
  if (!blocked(h.x, h.y)) return;
  for (let d = UNIT * 0.4; d < Math.max(W, H); d += UNIT * 0.4) for (const sgn of [1, -1]) {
    const x = horiz ? h.x + d * sgn : h.x, y = horiz ? h.y : h.y + d * sgn;
    if (x > UNIT * 0.5 && x < W - UNIT * 0.5 && y > UNIT * 0.5 && y < H - UNIT * 0.5 && !blocked(x, y)) { h.x = x; h.y = y; state.entry.fx = x / W; state.entry.fy = y / H; h.safe = [x / W, y / H]; return; }
  }
}
function transitionTo(id, fx, fy, quick) {
  state.busy = true;
  state.fadeTarget = 1;
  state.fadeRate = quick ? 14 : 4;
  setTimeout(() => {
    enterScene(id, fx, fy);
    nudgeFree();
    state.fadeTarget = 0;
    setTimeout(() => { state.busy = false; }, quick ? 150 : 500);
  }, quick ? 280 : 1000);
}

function checkEdges() {
  const sc = sceneDef(), h = state.hero, r = UNIT * 0.5 + 2;
  for (const ex of sc.exits) {
    let at = false, along = 0;
    if (ex.side === 'n') { at = h.y <= r && held.up(); along = h.x / W; }
    if (ex.side === 's') { at = h.y >= H - r && held.down(); along = h.x / W; }
    if (ex.side === 'w') { at = h.x <= r && held.left(); along = h.y / H; }
    if (ex.side === 'e') { at = h.x >= W - r && held.right(); along = h.y / H; }
    if (!at) continue;
    if (ex.locked && ex.locked()) return;
    if (ex.arrive === 'sinkhole') {
      const s = WORLD[ex.to].feat.stone;
      transitionTo(ex.to, s[0] - 2.2 * UNIT / W, s[1], true);
      if (ex.say) setTimeout(() => say(ex.say, state.hero.x, state.hero.y - UNIT, { key: 'climb', life: 2.5 }), 0);
      return;
    }
    const al = Math.max(0.05, Math.min(0.95, along));

    transitionTo(ex.to, fx, fy, true);
    return;
  }
}

function resetRun(seed) {

  state.inv = newInv();
  state.hero = newHero();
  state.hero.vig = maxVig();
  state.items = []; state.enemies = []; state.carry = null;
  state.area = null; state.seen = {}; state.playTime = 0;

  state.night = 0; state.rain = 0;
}
function newGame() {
  state.busy = true;
  state.fadeTarget = 1; state.fadeRate = 4;

// =====================================================================
// Update
// =====================================================================
function update(dt) {
  state.time += dt;
  state.fade += (state.fadeTarget - state.fade) * (1 - Math.exp(-state.fadeRate * dt));
  state.shake = Math.max(0, state.shake - dt);
  state.flash = Math.max(0, state.flash - dt * 2.5);
  state.blind = Math.max(0, state.blind - dt);
  updateCam(dt);
  updateTexts(dt);
  if (!state.started) return;
  readPresses();
  if (state.menu) { updateMenu(); return; }
  if (state.choice) { updateChoice(); return; }
  updateFx(dt);
  state.playTime += dt;
  const sc = sceneDef(), h = state.hero, inv = state.inv;
  if (sc.drips) updateDrips(dt);
  if (state.bird) updateBird(dt);
  if (state.flock.length) updateFlock(dt);
  if (sc.gusts) updateWind(dt, sc);
  if (sc.id === 'c7' && amb) ambLevel(0.04 + 0.28 * Math.max(0, h.x / W - 0.3), 900);
  if (sc.amb === 'marsh') ambLevel(0.05);
  if (state.rain > 0) { ambLevel(0.2 * state.rain); for (let i = 0; i < 6 * state.rain; i++) state.fx.push({ x: Math.random() * W * 1.2 - W * 0.1, y: -10, vx: -UNIT * 3, vy: H * 1.6, t: 0, life: 0.7, color: 'rain' }); }
  updateGas(dt);
  if (state.cut) { updateCut(dt); return; }
  if (state.won) return;

  if (!state.busy) {
    if (!interact()) { updatePull(dt); updateCombat(dt); }
    updateAbilities(dt);
  }
  for (const k of ['lumin', 'slime', 'pepper']) if (inv[k] > 0) inv[k] = Math.max(0, inv[k] - dt);
  const mv = maxVig();
  if (state.time - h.rest > 1.2 && h.vig < mv) h.vig = Math.min(mv, h.vig + (0.45 + mv * 0.05) * dt);

  // movement
  const locked = h.stun > 0 || state.busy || state.pull.grip || h.ride || h.falling > 0 || state.npcTalk;
  if (h.ride) updateRide(dt);
  else if (h.falling > 0) updateFall(dt);
  else if (h.dashT > 0) {
    h.dashT -= dt;
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (Math.random() < 0.6) state.fx.push({ x: h.x, y: h.y, vx: 0, vy: 0, t: 0, life: 0.2, color: 'rgba(245,208,111,.5)', size: UNIT * 0.8 });
  } else {
    const inp = locked ? { x: 0, y: 0 } : inputVector();
    if (inp.x || inp.y) { h.fx = inp.x; h.fy = inp.y; if (Math.abs(inp.x) > 0.3) h.side = Math.sign(inp.x); }
    let spd = sc.speed * weakness() * (state.hold.charged ? 0.45 : 1) * (state.carry === 'rock' ? 0.6 : 1) * (state.whirl ? 0.55 : 1);
    if (inPool(h.x, h.y)) spd *= 0.55;
    const k = 1 - Math.exp(-(h.stun > 0 ? 3 : sc.accel) * dt);
    h.vx += (inp.x * spd * L() - h.vx) * k;
    h.vy += (inp.y * spd * L() - h.vy) * k;
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (sc.gusts && state.gustPhase === 'blow') { const w = gustVec(), k = 0.5 + (sc.depth || 0) * 0.15; h.x += w[0] * 0.12 * k * L() * dt; h.y += w[1] * 0.06 * k * L() * dt; }
  }
  if (!h.ride) { collideSolids(h, UNIT * 0.42); clampTo(h, UNIT * 0.5); }
  h.stun -= dt; h.invuln -= dt; h.dashCool -= dt;
  updateJump(dt);

  if (sc.chasms && !h.ride && h.falling <= 0 && h.dashT <= 0 && h.z <= 0) {
    if (isChasm(h.x, h.y)) { h.falling = 0.8; h.vx = 0; h.vy = 0; sfx.plummet(); }
    else if (!isChasm(h.x, h.y, UNIT * 1.2)) h.safe = [h.x / W, h.y / H];
  }

  if (!state.busy && !h.ride && h.falling <= 0) { checkEdges(); updateFeatures(dt); }
  if (!state.busy) { updateEnemies(dt); updateHazards(dt); updateShots(dt); }

  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    if (it.type === 'bigrock') continue;
    if (!h.ride && Math.hypot(h.x - it.x, h.y - it.y) < UNIT * 0.9) { state.items.splice(i, 1); collect(it); }
  }
}
// tired heroes are slow heroes
function weakness() { const r = state.hero.vig / maxVig(); return r < 0.35 ? 0.45 + r * 1.57 : 1; }
function power() { return state.hero.vig / maxVig() < 0.25 ? 0.5 : 1; }
function spend(cost) {
  const h = state.hero;
  if (h.vig < cost * 0.5) { if (!state.tiredT || state.time - state.tiredT > 2) { state.tiredT = state.time; sfx.tired(); say('Too tired...', h.x, h.y - UNIT, { key: 'tired', life: 1.2, color: '#ffb080' }); } return false; }
  h.vig = Math.max(0, h.vig - cost); h.rest = state.time;

}
// using vigor slowly deepens it
function train(amount) {
  const inv = state.inv;
  inv.xp += amount;
  const need = 25 * Math.pow(1.35, inv.tlevel);
  if (inv.xp >= need) {
    inv.xp -= need; inv.tlevel++;
    sfx.grow();
    say(`Your vigor grows. ${maxVig()}`, state.hero.x, state.hero.y - UNIT * 1.4, { key: 'grow', life: 2.2, color: '#b8f28a' });
  }
}

function clampTo(a, r) {
  let wall = false;
  if (a.x < r) { a.x = r; a.vx = Math.max(0, a.vx); wall = true; }
  if (a.x > W - r) { a.x = W - r; a.vx = Math.min(0, a.vx); wall = true; }
  if (a.y < r) { a.y = r; a.vy = Math.max(0, a.vy); wall = true; }
  if (a.y > H - r) { a.y = H - r; a.vy = Math.min(0, a.vy); wall = true; }
  return wall;
}

  let hit = null;

    const dx = a.x - o.x, dy = a.y - o.y, d = Math.hypot(dx, dy) || 0.001, min = r + o.r;
    if (d < min) {

  return sc.chasms.some(([x0, y0, x1, y1]) => fx > x0 - px && fx < x1 + px && fy > y0 - py && fy < y1 + py);

// ---------------- scene features ----------------
function updateFeatures(dt) {
  const sc = sceneDef(), h = state.hero, f = sc.feat, rt = rtFor(sc.id);
  if (f.stone) {
    const sx = f.stone[0] * W, sy = f.stone[1] * H, d = Math.hypot(h.x - sx, h.y - sy);
    if (d < UNIT * 3) say('A sinkhole. The storm opened it.', sx, sy - UNIT * 0.9, { key: 'stone', tip: 'stone' });
    if (d < UNIT * 0.7) { say('You slip into the dark...', h.x, h.y - UNIT, { key: 'fall' }); sfx.fall(); zoomPulse(sx, sy, 'land'); transitionTo('c1', 0.08, 0.5); }
  }
  if (f.scarf && !rt.flags.scarf && Math.hypot(h.x - f.scarf[0] * W, h.y - f.scarf[1] * H) < UNIT * 3) {
    rt.flags.scarf = true;
    say('Pip\'s scarf, snagged on the thorns. They went into the woods.', f.scarf[0] * W - UNIT, f.scarf[1] * H - UNIT * 1.4, { key: 'scarf', life: 5 });
  }
  if (f.falls) {
    const lim = W - UNIT * 2.3 - UNIT * 0.45, gap = sc.exits.find(e => e.side === 'e');
    const open = rt.bossDead && h.y > gap.a * H + UNIT * 0.5 && h.y < gap.b * H - UNIT * 0.5;
    if (h.x > lim && !open) { h.x = lim; h.vx = Math.min(0, h.vx); }
  }
  if (f.plants && f.plants.length && (sc.id === 'f1' || sc.id === 'f3')) { const s = f.plants[0]; if (Math.hypot(h.x - s[0] * W, h.y - s[1] * H) < UNIT * 3) say(`Tall grass leans the way the next gust will blow. Jump (${K.jump}) while it blows to ride it.`, s[0] * W, s[1] * H - UNIT * 1.8, { key: 'sock', tip: 'sock' + sc.id, life: 5 }); }
}

// ---------------- jumping: always available; slam down with the sword ----------------
function updateJump(dt) {
  const h = state.hero, sc = sceneDef();
  if (h.ride || h.falling > 0) return;
  if (pressedNow.jump && h.z <= 0 && !state.busy && !state.pull.grip && !state.carry && !state.npcTalk) {
    h.vz = UNIT * 9; h.z = 0.01; state.slam = false;
    if (state.whirl) endWhirl('quiet');
    sfx.jump(); train(0.3);
    if (sc.gusts && state.gustPhase === 'blow') { rideGust(sc); return; }
  }
  if (h.z > 0 || h.vz > 0) {
    h.vz -= UNIT * (state.slam ? 60 : 30) * dt; h.z += h.vz * dt;
    if (h.z <= 0) {
      h.z = 0; h.vz = 0;
      if (state.slam) slamDown();

    }
  }
}
function rideGust(sc) {
  const h = state.hero, g = sc.gusts[state.gustIdx];
  if (g.s >= 2) {                                 // too strong: it throws you off the mountain
    h.ride = { t: 0, dur: 1.6, x0: h.x, y0: h.y, x1: h.x, y1: -UNIT * 4, blown: true };
    sfx.whoosh(); sfx.whoosh(); state.shake = 0.5;
    say('The wind is too strong!', h.x, h.y - UNIT * 1.3, { key: 'blown', life: 1.6, color: '#ffe38a' });
    return;
  }

  h.ride = { t: 0, dur: 1.2 + g.s * 0.8, x0: h.x, y0: h.y, x1: h.x + dx, y1: h.y + dy };
  h.invuln = 2.2; sfx.whoosh();

}

  r.t += dt;

  h.z = Math.sin(Math.PI * p) * UNIT * 3.2;

  if (p >= 1 && r.blown) {
    h.ride = null; h.z = 0;
    transitionTo('foot', 0.5, 0.3);
    setTimeout(() => say('Blown all the way down the mountain. Softly, at least.', state.hero.x, state.hero.y - UNIT, { key: 'blown', life: 3.5 }), 0);
    return;
  }
  if (p >= 1) {
    h.ride = null; h.z = 0; h.vx = 0; h.vy = 0; h.rideCool = state.time + 1.5;
    clampTo(h, UNIT * 0.5);
    sfx.land(); zoomPulse(h.x, h.y, 'land'); state.shake = 0.2;
    spark(h.x, h.y + UNIT * 0.4, '#9a8a5a', 10, 3);
  }
}
function updateFall(dt) {
  const h = state.hero;
  h.falling -= dt;

    h.falling = 0;
    const s = h.safe || [state.entry.fx, state.entry.fy];
    h.x = s[0] * W; h.y = s[1] * H; h.vx = 0; h.vy = 0;
    say('Ooof. Back up the bank.', h.x, h.y - UNIT, { key: 'fall', life: 1.8 });
    hurtHero(1, h.x, h.y, { noKnock: true, force: true });
  }
}

// ---------------- wind: a schedule of gusts the windsock announces ----------------
const gustVec = () => { const g = sceneDef().gusts[state.gustIdx]; return [Math.sin(g.a) * g.s, Math.cos(g.a) * g.s]; };
function updateWind(dt, sc) {
  state.gustT += dt;
  const T = { lull: 2.4, build: 1.2, blow: 1.4 };
  if (state.gustT > T[state.gustPhase]) {
    state.gustT = 0;
    if (state.gustPhase === 'lull') { state.gustPhase = 'build'; state.gustIdx = (state.gustIdx + 1) % sc.gusts.length; }
    else if (state.gustPhase === 'build') { state.gustPhase = 'blow'; sfx.whoosh(); }
    else state.gustPhase = 'lull';
  }
  const target = state.gustPhase === 'blow' ? 1 : state.gustPhase === 'build' ? 0.35 : 0.1;
  state.gust += (target - state.gust) * (1 - Math.exp(-4 * dt));
  const g = sc.gusts[state.gustIdx];
  ambLevel(0.04 + state.gust * g.s * 0.2, 380 + state.gust * g.s * 800);
  const [wx, wy] = gustVec(), mag = Math.hypot(wx, wy) || 1;
  const n = state.gust * 4 * g.s;
  for (let i = 0; i < n; i++) if (Math.random() < 0.5) {
    state.fx.push({ x: Math.random() * W - wx / mag * UNIT * 3, y: Math.random() * H * 0.3 - UNIT * 2, vx: wx / mag * L() * (0.5 + state.gust), vy: wy / mag * L() * (0.5 + state.gust), t: 0, life: 2.5, color: 'streak', size: UNIT * (0.8 + state.gust * 1.6) });
  }
  if (Math.random() < 0.05 + state.gust * 0.3) state.fx.push({ x: Math.random() * W, y: -10, vx: wx / mag * L() * 0.3, vy: wy / mag * L() * 0.3 + UNIT, t: 0, life: 4, color: 'leaf', spin: Math.random() * 6 });
  for (const c of state.clouds) { c.x += L() * 0.02 * dt; if (c.x > W + c.r) c.x = -c.r; }
}

// =====================================================================
// Pulling things free: hold F, rock left/right, pull up
// =====================================================================
const PULL = {
  rock: {
    approach: () => `A big rock, half sunk in soft earth. Hold ${K.act} to grab it`,
    fails: () => [`It's sunk deep in the mud. Keep holding ${K.act} and rock it ${K.l} ${K.r}`, `Pulling straight won't work. Hold on and rock it ${K.l} ${K.r}`],
    rock: ['It shifts.', 'Mud sucks at it.', 'Almost...', `Loose! Now pull ${K.u}`],
    notYet: () => `Not yet. Rock it more ${K.l} ${K.r}`,
  },
  sword: {
    approach: () => `A rusted sword, stuck fast in an old stump. ${K.act} to grab`,
    fails: () => ['You pull with everything you have. It won\'t budge.', 'The rust has welded blade to wood.', 'Your hands slip on the rust.', 'Like that rock, only much worse.'],
    rock: ['It creaks.', 'It creaks.', 'Flakes of rust fall away.', 'Flakes of rust fall away.', 'The wood groans and gives.', 'It\'s loose. Now pull.'],
    notYet: () => 'Not yet. It needs more working.',
  },
};
function updatePull(dt) {
  const sc = sceneDef(), rt = rtFor(sc.id), h = state.hero;
  let near = null;
  if (!state.carry) for (const pl of sc.pullables) {
    if (rt.pulled.has(pl.id)) continue;
    if (Math.hypot(h.x - pl.fx * W, h.y - pl.fy * H) < UNIT * 1.7) near = pl;
  }
  let p = state.pull;
  p.tilt += (p.lastSide * Math.min(1, p.wiggle / (near ? near.need : 6)) * 0.35 - p.tilt) * (1 - Math.exp(-8 * dt));
  if (!near) {
    p.grip = false;
    p.wiggle = Math.max(0, p.wiggle - dt * 0.4);
    if (p.hinted) { p.hinted = false; unsay('pull'); }
    return;
  }
  if (p.id !== near.id) p = state.pull = newPull(near.id);
  const x = near.fx * W, y = near.fy * H, T = PULL[near.kind];
  const tell = (s, tip) => say(s, x, y - UNIT * 1.3, { key: 'pull', life: 3.5, tip });
  if (!p.grip && !p.hinted) { p.hinted = true; tell(T.approach(), 'pull-' + near.kind); }
  if (pressedNow.act && !p.grip) {
    p.grip = true; sfx.strain();
    const f = T.fails();
    if (p.wiggle >= near.need) tell(`It's loose. Pull ${K.u}`);
    else tell(f[Math.min(p.tries++, f.length - 1)]);
    return;
  }
  if (p.grip && !held.act()) { p.grip = false; return; }
  if (!p.grip) return;
  if (pressedNow.left || pressedNow.right) {
    const side = pressedNow.left ? -1 : 1;
    if (side !== p.lastSide) {
      p.wiggle = Math.min(near.need, Math.floor(p.wiggle) + 1);
      p.lastSide = side;
      sfx.creak(side > 0);
      tell(T.rock[Math.min(T.rock.length - 1, Math.max(0, Math.round(p.wiggle / near.need * T.rock.length) - 1))]);
      state.shake = 0.08;
      zoomPulse(x, y, 'tap');
    } else tell('It\'s already leaning that way.');
  }
  if (pressedNow.up) {
    if (p.wiggle >= near.need) freePullable(near, x, y);
    else { sfx.strain(); const f = T.fails(); tell(p.wiggle > 0 ? T.notYet() : f[Math.min(p.tries++, f.length - 1)]); }
  }
  if (pressedNow.down) tell('You brace your feet.');
}
function freePullable(pl, x, y) {
  rtFor(state.scene).pulled.add(pl.id);
  state.pull = newPull(null);
  unsay('pull');
  if (pl.kind === 'rock') {
    sfx.lift(); zoomPulse(x, y, 'pickup'); spark(x, y, '#6a4a2a', 12, 3);
    state.carry = 'rock'; refreshButtons();
    say(`Heavy! Hold ${K.throw} and let go to throw it the way you face.`, x, y - UNIT * 1.6, { key: 'pull', life: 5, tip: 'throw-rock' });
  } else startSwordCut();
}

// =====================================================================
// Hero vigor: one pool for life and abilities
// =====================================================================
function hurtHero(dmg, fromX, fromY, opts = {}) {
  const h = state.hero;
  if (!opts.force && (h.invuln > 0 || h.ride || state.cut)) return false;
  if (state.whirl) endWhirl('hit');
  h.vig -= dmg * 2 * (1 - 0.15 * state.inv.up.guard); h.rest = state.time + 0.8; h.hurtT = state.time;
  h.invuln = 1.2;
  sfx.hit();
  state.shake = 0.35;
  zoomPulse(h.x, h.y, 'hurt');
  state.hold.on = false; state.hold.charged = false; state.pull.grip = false;
  if (state.carry === 'rock') dropRock();
  if (!opts.noKnock) {
    const e = state.entry;
    let ax = h.x - fromX, ay = h.y - fromY; const al = Math.hypot(ax, ay) || 1;
    let bx = e.fx * W - h.x, by = e.fy * H - h.y; const bl = Math.hypot(bx, by) || 1;
    let kx = ax / al + 0.6 * bx / bl, ky = ay / al + 0.6 * by / bl; const kl = Math.hypot(kx, ky) || 1;
    h.vx = kx / kl * 0.9 * L(); h.vy = ky / kl * 0.9 * L(); h.stun = 0.5;
  }
  if (h.vig <= 0) {
    h.vig = 0;
    state.cut = { type: 'faint', t: 0 };
    state.fadeTarget = 1; state.fadeRate = 3;
    sfx.death();
  }
  return true;
}

// =====================================================================
// Drops: every monster leaves something tied to what it was

const DROPS = {

const SEEDS = {

  emberseed: { name: 'Emberseed', rarity: 'Rare', grow: 32, yields: ['ember', 2], color: '#ffa04a' },
  ironseed:  { name: 'Ironseed', rarity: 'Rare', grow: 40, yields: ['ironwood', 1], color: '#b0b8c0' },
  starseed:  { name: 'Starseed', rarity: 'Very rare', grow: 60, yields: ['starpetal', 1], color: '#fff6c8' },

const MATS = { thorn: 'thorn', ember: 'ember bloom', ironwood: 'ironwood', starpetal: 'star petal' };
const RELICS = {
  step: { name: 'Stalker\'s Step', levels: [`${K.dash}: dodge, untouchable for a blink. Dodge a lunge at the last moment and time slows.`, 'Recovers faster between dodges.', 'Dodges cost half the vigor and last longer.'] },
  silk: { name: 'Diver Silk', levels: ['Strung into a sling: acorns fly faster and hit harder.', 'Acorns punch through and keep flying.', 'Acorns tangle what they hit, holding it still.'] },
  horn: { name: 'Charger Horn', levels: ['Lashed to your blade: stabs hit harder and always knock back.', 'Chained stabs hit harder still.', 'Your stabs reach farther.'] },

function itemExists(type) {
  if (state.items.some(i => i.type === type)) return true;
  return Object.values(RT).some(rt => rt.items.some(i => i.type === type));
}
function dropFor(e) {
  for (const [t, p] of DROPS[e.type] || []) {

// a relic landing is an event: light, fanfare, a slow breath, its name
function relicMoment(type, x, y) {
  sfx.fanfare(); zoomPulse(x, y, 'boss'); state.slowmo = 0.8;
  state.fx.push({ x, y, vx: 0, vy: 0, t: 0, life: 2.5, color: 'beam' });
}
function heal(frac, label) {
  const h = state.hero, mv = maxVig(), before = h.vig;
  h.vig = Math.min(mv, h.vig + mv * frac);
  say('+' + Math.round(h.vig - before), h.x, h.y - UNIT * 0.9, { key: 'heal', life: 1.2, color: '#b8f28a' });
}
function deepen(msg) {
  state.inv.depth++;
  state.hero.vig = maxVig();
  say(msg + ` Vigor ${maxVig()}.`, state.hero.x, state.hero.y - UNIT * 1.1, { key: 'item', life: 5 });
}
function collect(it) {
  const inv = state.inv, h = state.hero;
  const tell = (s, life = 4, tip) => say(s, h.x, h.y - UNIT * 1.1, { key: 'item', life, tip });
  zoomPulse(it.x, it.y, 'pickup');
  if (RELICS[it.type] || it.type === 'scalp') { sfx.shing(); state.slowmo = 0.5; }
  else if (it.type === 'wisp' || it.type === 'warden') sfx.heart(); else if (it.type === 'acorn' || it.type === 'seed' || it.type === 'bean') sfx.tock(); else sfx.pickup();
  switch (it.type) {
    case 'scalp': inv.scalp = true; showTitle('Stalker Scalp', 'ears and all. what falls on your head bounces off', 'relic', 3.5); break;
    case 'step': case 'silk': case 'horn': {
      inv[it.type] = Math.min(3, inv[it.type] + 1);
      const R = RELICS[it.type];
      showTitle(`${R.name}${inv[it.type] > 1 ? ' ' + 'I'.repeat(inv[it.type]) : ''}`, R.levels[inv[it.type] - 1], 'relic', 4);
      break;
    }
    case 'lumin': inv.lumin = Math.min(90, inv.lumin + 45); tell('Luminescence. Your light burns brighter, and their flashes can\'t blind you.', 4, 'lumin'); break;
    case 'pepper': inv.food.push('pepper'); tell(`A bog pepper. ${K.eat} to eat: a little vigor, and your marsh fire burns bigger for a while.`, 4, 'pepper'); break;
    case 'turnip': inv.food.push('turnip'); tell(`A turnip. ${K.eat} to eat. Turnips make you sturdier for good.`, 3.5, 'turnip'); break;
    case 'squash': inv.food.push('squash'); tell(`A squash. ${K.eat} to eat: a big meal.`, 3, 'squash'); break;
    case 'berries': inv.food.push('berries'); tell('Mountain berries. A small snack.', 3, 'berries'); break;
    case 'carrot':
      if (inv.food.length < 8) { inv.food.push('carrot'); tell(`A carrot. ${K.eat} to eat and restore vigor.`, 4, 'carrot'); }
      else heal(0.35);
      break;
    case 'slime': inv.slime = 25; tell('Lurker slime coats your blade. Every hit stings harder until it dries.', 4, 'slime'); break;
    case 'wisp': heal(0.2); break;
    case 'warden': deepen('The Warden\'s heart. Your vigor runs deeper.'); break;
    case 'acorn': inv.acorns = Math.min(30, inv.acorns + 1); tell(`Acorn. Hold ${K.throw} and let go to throw.`, 3, 'acorn'); break;
    case 'seed': case 'thornseed': case 'emberseed': case 'ironseed': case 'starseed': {
      inv.bag[it.type]++;
      const S = SEEDS[it.type];

      else { say(`${S.name}! ${S.rarity}.`, h.x, h.y - UNIT * 1.1, { key: 'item', life: 3, color: S.color }); say(`Rare seeds grow into materials for your gear. Work them at the camp bench.`, h.x, h.y + UNIT * 1.6, { key: 'seedtip', tip: 'rareseed', life: 5 }); }
      if (it.type === 'starseed' || it.type === 'ironseed') { state.slowmo = 0.4; sfx.shing(); }
      break;
    }
    case 'thorn': case 'ember': case 'ironwood': case 'starpetal': inv.mats[it.type]++; say(`+1 ${MATS[it.type]}`, h.x, h.y - UNIT * 1.1, { key: 'mat' + it.type, life: 1.6, color: '#ffe38a' }); break;
    case 'bean':
      inv.beans++;
      say(inv.beans >= BEANS ? `All ${BEANS} beans! Back to the toad.` : `Bean ${inv.beans} of ${BEANS}`, h.x, h.y - UNIT * 1.1, { key: 'item', life: 2.5 });
      break;

}

// =====================================================================
// Combat. Tap F = slash (also blocks). Hold and release = stab, which lunges.
// Chain: stab, slash while lunging, then stab again in time, and the next
// stab lunges farther, hits harder, and bowls small things over. Chains to x3.
// =====================================================================
const SLASH = { dur: 0.22, cool: 0.22, reach: 1.7 };
const STAB  = { dur: 0.22, cool: 0.1, reach: 2.2, charge: 0.35, chainCharge: 0.18, knockChance: 0.6 };
const COMBO = { slashWindow: 0.7, stabWindow: 0.9 };
const SMALL = ['rabbit', 'glowworm', 'gremlin', 'diver', 'lurker', 'stalker'];

function updateCombat(dt) {
  const inv = state.inv;
  if (!inv.sword || state.pull.grip || state.hero.ride || state.carry) return;
  const h = state.hero, hold = state.hold, cb = state.combo;
  state.atkCool -= dt;
  const nearPullable = sceneDef().pullables.some(p => !rtFor(state.scene).pulled.has(p.id) && Math.hypot(h.x - p.fx * W, h.y - p.fy * H) < UNIT * 1.7);
  if (nearPullable) return;

  // in the air, the sword comes down as a slam
  if (pressedNow.act && h.z > UNIT * 0.3 && !state.slam) { state.slam = true; h.vz = -UNIT * 14; sfx.swoosh(); return; }
  if (state.slam) return;
  if (state.whirl) { updateWhirl(dt); return; }
  if (pressedNow.act) { hold.on = true; hold.t = 0; hold.charged = false; state.slashBuf = state.time; }
  // presses a hair early (mid-stab) are buffered, so you can slash right out of a lunge
  if (state.time - (state.slashBuf ?? -9) < 0.25) {
    if (state.atkCool <= 0) {
      state.slashBuf = -9;
      const chained = cb.step === 'stab' && state.time - cb.t < COMBO.slashWindow;
      if (chained) { cb.step = 'slash'; cb.t = state.time; } else { cb.step = null; cb.level = 0; }
      // three slashes in rhythm (not too quick, not too slow) wind up a whirlwind
      const ch = state.chain, gap = state.time - ch.t;
      ch.n = gap >= WHIRL.min && gap <= WHIRL.max ? ch.n + 1 : 1;
      ch.t = state.time;
      if (ch.n >= 3) { ch.n = 0; startWhirl(); return; }
      if (ch.n === 2) say('\u2022 \u2022', h.x, h.y - UNIT * 1.2, { key: 'chain', life: 0.5, color: '#ffe38a' });
      state.atk = { type: 'slash', t: 0, dur: SLASH.dur, hit: new Set(), ax: h.fx, ay: h.fy, level: chained ? cb.level : 0 };
      state.atkCool = SLASH.cool;
      sfx.swoosh();
      if (state.bird) scareBird(h.x, h.y, 5);
      scareFlock(h.x, h.y, 5);
      shakeTrees(h, 1);
      cutVines(h);
    }
  }
  if (hold.on) {
    if (held.act()) {
      hold.t += dt;
      const need = cb.step === 'slash' ? STAB.chainCharge : STAB.charge;
      if (!hold.charged && hold.t > need) { hold.charged = true; sfx.charge(); }
    } else {
      if (hold.charged && spend(0.6)) {
        const chained = cb.step === 'slash' && state.time - cb.t < COMBO.stabWindow;
        cb.level = chained ? Math.min(3, cb.level + 1) : 0;
        cb.step = 'stab'; cb.t = state.time;
        state.atk = { type: 'stab', t: 0, dur: STAB.dur + cb.level * 0.04, hit: new Set(), ax: h.fx, ay: h.fy, level: cb.level };
        state.atkCool = STAB.cool;
        h.dashT = 0.12 + cb.level * 0.05;                 // the lunge; you can slash out of it
        h.vx = h.fx * (0.75 + cb.level * 0.3) * L(); h.vy = h.fy * (0.75 + cb.level * 0.3) * L();
        if (cb.level) { sfx.flipStrike(); zoomPulse(h.x, h.y, cb.level >= 3 ? 'kill' : 'parry'); say('x' + (cb.level + 1), h.x, h.y - UNIT * 1.2, { key: 'combo', life: 0.9, color: '#ffe38a', size: 1 + cb.level * 0.2 }); }
        else sfx.stab();
        say('Stab, then slash while you lunge, then stab again: each chained stab goes farther.', h.x, h.y - UNIT * 1.6, { key: 'combotip', tip: 'combo', life: 5 });
      }
      hold.on = false; hold.charged = false;
    }
  }
  const a = state.atk;
  if (!a) return;
  a.t += dt;
  for (const e of state.enemies) {
    if (a.hit.has(e) || !hittable(e)) continue;
    const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
    let hit;
    if (a.type === 'slash') hit = d < UNIT * SLASH.reach + e.r && ((dx * a.ax + dy * a.ay) / d > 0.2 || d < e.r + UNIT * 0.6);
    else {
      const along = dx * a.ax + dy * a.ay, perp = Math.abs(dx * a.ay - dy * a.ax);
      hit = along > -e.r && along < UNIT * (STAB.reach + (inv.horn >= 3 ? 0.5 : 0)) + e.r && perp < e.r + UNIT * 0.35;
    }
    if (hit) {
      a.hit.add(e);
      let dmg = a.type === 'slash' ? 1 + inv.up.edge * 0.5 : 2 + inv.up.temper * 0.5;
      if (a.type === 'stab' && inv.horn) dmg += 1;
      if (a.type === 'stab' && a.level) dmg *= 1 + a.level * (inv.horn >= 2 ? 0.45 : 0.3);
      if (inv.slime > 0) dmg += 1;
      dmg *= power();
      damage(e, dmg, a.type, dx / d, dy / d, a.type === 'stab' && a.level > 0 && SMALL.includes(e.type));
    }
  }
  if (a.t >= a.dur) state.atk = null;
}
// ---------------- whirlwind: keep it spinning by striking on the beat ----------------
const WHIRL = { min: 0.26, max: 0.62, first: 0.62, window: 0.13, shrink: 0.88, fastest: 0.26 };
function startWhirl() {
  const h = state.hero;
  state.atk = null; state.hold.on = false; state.hold.charged = false;
  state.whirl = { t: 0, ang: Math.atan2(h.fy, h.fx), beat: WHIRL.first, next: state.time + WHIRL.first, streak: 0, hit: new Set(), lastRev: 0 };
  sfx.spin(); zoomPulse(h.x, h.y, 'kill'); state.shake = 0.2; cutVines(h);
  say('Whirlwind!', h.x, h.y - UNIT * 1.4, { key: 'combo', life: 1, color: '#ffe38a', size: 1.4 });
  say(`Strike ${K.act} each time the ring closes to keep it spinning faster.`, h.x, h.y + UNIT * 2, { key: 'whirltip', tip: 'whirl', life: 5 });
}
function endWhirl(why) {
  const w = state.whirl, h = state.hero;
  if (!w) return;
  state.whirl = null;
  if (why === 'miss') { h.stun = 0.45; sfx.dizzy(); say('Dizzy...', h.x, h.y - UNIT * 1.2, { key: 'combo', life: 1 }); }
  if (why === 'knocked' || why === 'flash') { h.stun = 0.35; state.shake = 0.3; sfx.crash(); say(why === 'flash' ? 'The flash breaks your spin!' : 'Knocked out of your spin!', h.x, h.y - UNIT * 1.2, { key: 'combo', life: 1.2 }); }
}
function updateWhirl(dt) {
  const w = state.whirl, h = state.hero, inv = state.inv;
  const win = WHIRL.window + (inv.up.star ? 0.05 : 0);
  w.t += dt;
  w.ang += (Math.PI * 2 / Math.max(WHIRL.fastest, w.beat)) * 1.5 * dt;
  if (w.ang - w.lastRev > Math.PI * 2) { w.lastRev = w.ang; w.hit.clear(); }
  if (pressedNow.act) {
    if (Math.abs(state.time - w.next) <= win) {
      w.streak++;
      if (!spend(0.35)) { endWhirl('miss'); return; }
      w.beat = Math.max(WHIRL.fastest, w.beat * WHIRL.shrink);
      w.next = state.time + w.beat;
      cutVines(h); sfx.whirlUp(w.streak); zoomPulse(h.x, h.y, w.streak % 4 ? 'tap' : 'parry');
      say('x' + (w.streak + 1), h.x, h.y - UNIT * 1.3, { key: 'combo', life: 0.6, color: '#ffe38a', size: 1 + Math.min(0.8, w.streak * 0.08) });

function updateBird(dt) {

    const a = Math.random() * 6.28, rad = UNIT * (0.4 + Math.random() * (1 + mv * 0.03) * grow);
    const p = spawnPuff(from.x, from.y, Math.cos(a) * UNIT * 0.8, Math.sin(a) * UNIT * 0.8, UNIT * (0.7 + mv * 0.02) * rr(0.8, 1.2) * hot * Math.sqrt(grow));
    if (p) { p.anchor = true; p.ox = Math.cos(a) * rad; p.oy = Math.sin(a) * rad; }
    return;
  }
  const a = Math.random() < 0.7 ? face + rr(-1.0, 1.0) : Math.random() * 6.28;
  const sp = UNIT * (1.2 + mv * 0.06) * rr(0.6, 1.25);
  spawnPuff(from.x + Math.cos(face) * UNIT * 0.5, from.y + Math.sin(face) * UNIT * 0.5, Math.cos(a) * sp * hot, Math.sin(a) * sp * hot, UNIT * (0.7 + mv * 0.02) * rr(0.8, 1.2) * hot);
}

// ---------------- projectiles (rocks, acorns) ----------------
function launch(kind) {
  const h = state.hero, rock = kind === 'rock';
  const silk = rock ? 0 : state.inv.silk;
  const sp = UNIT * (rock ? 7 : 13 * (silk ? 1.35 : 1));
  state.shots.push({ kind, x: h.x + h.fx * UNIT * 0.6, y: h.y + h.fy * UNIT * 0.6, vx: h.fx * sp, vy: h.fy * sp, z: UNIT * (rock ? 1.2 : 0.6), vz: UNIT * (rock ? 5 : 2.5), g: UNIT * (rock ? 14 : silk ? 5 : 8), spin: 0, silk, hit: new Set() });
  sfx.throw();
  if (rock) state.shake = 0.1;
  if (state.bird) scareBird(h.x, h.y, 6);
}
function updateShots(dt) {
  for (let i = state.shots.length - 1; i >= 0; i--) {
    const s = state.shots[i], rock = s.kind === 'rock';
    s.x += s.vx * dt; s.y += s.vy * dt; s.vz -= s.g * dt; s.z += s.vz * dt; s.spin += dt * 12;
    let done = s.z <= 0 || s.x < -UNIT || s.x > W + UNIT || s.y < -UNIT || s.y > H + UNIT;
    for (const e of state.enemies) {
      if (done || s.hit.has(e) || !hittable(e) || Math.hypot(e.x - s.x, e.y - s.y) > e.r + UNIT * 0.3) continue;
      const d = Math.hypot(s.vx, s.vy) || 1;
      s.hit.add(e);
      damage(e, (rock ? 3 : s.silk ? 2 : 1) * power(), rock ? 'stab' : 'slash', s.vx / d, s.vy / d);
      if (s.silk >= 3 && !e.dead) { e.mode = 'stunned'; e.t = 1.2; }
      if (!(s.silk >= 2)) done = true;
    }
    if (!done) for (const o of state.solids) {
      if (Math.hypot(o.x - s.x, o.y - s.y) > o.r + UNIT * 0.2) continue;
      if (rock && o.bar && o.kind === 'bramble') breakBarrier(o.bar, 'rock');
      else if (!rock) { sfx.tock(); if (o.kind === 'tree') { state.treeShake[o.key] = state.time; sfx.rustle(); } }
      s.x -= s.vx * dt * 2; s.y -= s.vy * dt * 2;
      done = true; break;
    }
    if (state.bird && Math.hypot(state.bird.x - s.x, state.bird.y - s.y) < UNIT * 2) scareBird(s.x, s.y, 3);
    if (done) {
      state.shots.splice(i, 1);
      if (rock) { state.items.push({ type: 'bigrock', x: Math.max(UNIT, Math.min(W - UNIT, s.x)), y: Math.max(UNIT, Math.min(H - UNIT, s.y)) }); sfx.crash(); state.shake = 0.2; spark(s.x, s.y, '#8a7a6a', 8, 2.5); }
      else if (Math.random() < 0.35) state.items.push({ type: 'acorn', x: s.x, y: s.y });
      if (state.scene === 'start' && rock && !broken('start', 'thicket')) say('Maybe if it hit the thicket...', s.x, s.y - UNIT, { key: 'rockhint', life: 2.5, tip: 'rockhint' });
    }
  }
}

// ---------------- marsh fire: a cloud of gas that catches and spreads ----------------
function spawnPuff(x, y, vx, vy, rMax) {
  if (state.gas.length > 170) return null;
  const p = { x, y, vx, vy, r: UNIT * 0.2, rMax, age: 0, life: rr(9, 13), ign: null, burn: 0, burnDur: rr(1.2, 2.0) };
  state.gas.push(p);
  return p;
}
function windNow() {
  const sc = sceneDef();
  if (sc.gusts) { const [wx, wy] = gustVec(); const k = 0.1 + state.gust * 0.5; return [wx * k * L(), wy * k * L()]; }
  if (sc.breeze) return [Math.sin(state.time * 0.1) * sc.breeze * L(), sc.breeze * 0.3 * L()];
  return [0, 0];
}
function updateGas(dt) {
  if (!state.gas.length && !state.spark) return;
  const [wx, wy] = windNow(), wmag = Math.hypot(wx, wy) / L();
  if (state.spark && state.time >= state.spark.t) {
    const sp = state.spark; state.spark = null;
    let best = null, bd = UNIT * 2.8;
    for (const p of state.gas) { const d = Math.hypot(p.x - sp.x, p.y - sp.y) - p.r; if (!p.burn && d < bd) { bd = d; best = p; } }
    if (best) { best.ign = state.time; sfx.whumpf(); zoomPulse(best.x, best.y, 'hit'); }
    else say(wmag > 0.05 ? 'The wind scattered the gas.' : 'Fizzle. Nothing to light.', sp.x, sp.y - UNIT, { key: 'fizzle', life: 1.8 });
  }
  const burning = [];
  for (let i = state.gas.length - 1; i >= 0; i--) {
    const p = state.gas[i];
    p.age += dt * (1 + wmag * 6);               // wind thins the cloud fast
    const k = Math.exp(-2 * dt);
    p.vx *= k; p.vy *= k;
    if (p.anchor && !p.burn) {                      // a still breather's cloud hangs around them
      const h = state.hero, ax = h.x + p.ox - p.x, ay = h.y + p.oy - p.y;
      p.vx += ax * 3 * dt; p.vy += ay * 3 * dt;
    }
    p.x += (p.vx + wx) * dt; p.y += (p.vy + wy) * dt;
    if (!p.burn) { p.rMax += UNIT * 0.08 * dt; p.r += (p.rMax - p.r) * (1 - Math.exp(-2 * dt)); }
    if (p.ign != null && !p.burn && state.time >= p.ign) p.burn = 0.001;
    if (p.burn) {
      p.burn += dt * (1 + wmag * 4);
      burning.push(p);
      if (Math.random() < dt * 8) state.fx.push({ x: p.x + (Math.random() - 0.5) * p.r, y: p.y, vx: wx * 0.5, vy: -UNIT * 1.5, t: 0, life: 0.6, color: Math.random() < 0.5 ? '#ffb347' : '#ff7a2a' });
      if (p.burn > p.burnDur) { state.gas.splice(i, 1); state.fx.push({ x: p.x, y: p.y, vx: wx * 0.3, vy: -UNIT * 0.5, t: 0, life: 1.4, color: 'smoke', size: p.r }); }
    } else if (p.age > p.life) state.gas.splice(i, 1);
  }
  if (!burning.length) return;
  if (Math.random() < dt * 3) sfx.crackle();
  for (const b of burning) {
    for (const p of state.gas) if (!p.burn && p.ign == null && Math.hypot(p.x - b.x, p.y - b.y) < (p.r + b.r) * 0.8) p.ign = state.time + rr(0.1, 0.25);
    for (const e of state.enemies) {
      if (!hittable(e) || (e.burnCool || 0) > state.time || Math.hypot(e.x - b.x, e.y - b.y) > b.r + e.r) continue;
      e.burnCool = state.time + 0.5;
      e.burn = Math.min(e.type === 'warden' ? 2 : 8, (e.burn || 0) + (state.inv.pepper > 0 ? 1.8 : 1.2) * (1 + state.inv.up.pouch * 0.25));   // it clings; more fire, longer panic
      damage(e, 1, 'fire', 0, 0);
    }
    for (const s of state.solids) if (s.bar && s.kind !== 'bramble' && Math.hypot(s.x - b.x, s.y - b.y) < b.r + s.r) { breakBarrier(s.bar, 'fire'); break; }
    if (state.bird) scareBird(b.x, b.y, 4);
  }
}

const FORGE = [
  { k: 'edge', name: 'Honed edge', what: 'Slashes and whirlwinds cut deeper.', cost: [{ thorn: 2 }, { thorn: 4 }, { thorn: 6, ironwood: 1 }] },
  { k: 'temper', name: 'Tempered blade', what: 'Stabs hit harder.', cost: [{ ironwood: 1, thorn: 1 }, { ironwood: 2, thorn: 2 }, { ironwood: 3, ember: 1 }] },
  { k: 'guard', name: 'Ironwood guard', what: 'Take less damage.', cost: [{ ironwood: 2 }, { ironwood: 3 }, { ironwood: 4, starpetal: 1 }] },
  { k: 'pouch', name: 'Ember pouch', what: 'Marsh fire spreads wider and burns longer.', cost: [{ ember: 2 }, { ember: 3 }, { ember: 4, starpetal: 1 }] },
  { k: 'star', name: 'Star-petal hilt', what: 'Deeper vigor and a more forgiving whirlwind.', cost: [{ starpetal: 2 }], max: 1 },
];
const costText = c => Object.entries(c).map(([m, n]) => `${n} ${MATS[m]}`).join(', ');
function forgeItems() {
  const up = state.inv.up;
  return FORGE.map(f => {
    const lv = up[f.k], max = f.max || 3;
    return lv >= max ? `${f.name} ${'I'.repeat(lv)}: done` : `${f.name} ${'I'.repeat(lv + 1)}: ${costText(f.cost[lv])}`;
  }).concat('Back');
}
function forgeSelect(i) {
  const m = state.menu;
  if (i >= FORGE.length) { state.menu = null; return; }
  const f = FORGE[i], inv = state.inv, lv = inv.up[f.k];
  if (lv >= (f.max || 3)) { m.note = 'Already as good as it gets.'; return; }
  const c = f.cost[lv];
  if (!Object.entries(c).every(([k, n]) => inv.mats[k] >= n)) { m.note = `Need ${costText(c)}. ${f.what}`; return; }
  for (const [k, n] of Object.entries(c)) inv.mats[k] -= n;
  inv.up[f.k]++;
  sfx.forge();
  m.note = `${f.name} ${'I'.repeat(inv.up[f.k])}. ${f.what}`;
  if (f.k === 'star') state.hero.vig = maxVig();
}

    if (i === 0) state.menu = null;

function serialize() {
  saveScene();

  for (const [k, r] of Object.entries(RT)) rtOut[k] = { deadAt: r.deadAt, items: r.items, pulled: [...r.pulled], flags: r.flags, bossDead: r.bossDead };

}
function saveSlot(i) { try { localStorage.setItem('quest-slot-' + i, JSON.stringify(serialize())); return true; } catch (e) { return false; } }

// =====================================================================
// Forest birds: peck about, burst into the air when you come close
// =====================================================================
const FLOCK = { camp: 2, start: 3, meadow: 2, w1: 3, w2: 2, w3: 1, f1: 2 };
function makeFlock(sc) {
  const n = FLOCK[sc.id] || 0, out = [];
  for (let i = 0; i < n; i++) out.push(landSpot({ mode: 'peck', t: Math.random() * 2, z: 0, c: ['#6b4a2a', '#5a5a62', '#8a6a3a'][i % 3] }));
  return out;
}
function landSpot(b) {
  for (let k = 0; k < 30; k++) {
    const x = W * (0.1 + Math.random() * 0.8), y = H * (0.15 + Math.random() * 0.75);
    if (state.solids.every(s => Math.hypot(s.x - x, s.y - y) > s.r + UNIT) && !isChasm(x, y)) { b.x = x; b.y = y; break; }
  }
  return b;
}
function scareFlock(x, y, range) {
  for (const b of state.flock) {
    if (b.mode !== 'peck' || Math.hypot(b.x - x, b.y - y) > UNIT * range) continue;
    const a = Math.atan2(b.y - y, b.x - x) + (Math.random() - 0.5);
    b.mode = 'fly'; b.vx = Math.cos(a) * 0.4 * L(); b.vy = Math.sin(a) * 0.4 * L() - UNIT * 3;
    sfx.flap(panOf(b.x));
    if (Math.random() < 0.12) state.items.push({ type: 'seed', x: b.x, y: b.y });
  }
}
function updateFlock(dt) {
  const h = state.hero;
  for (const b of state.flock) {
    b.t -= dt;
    if (b.mode === 'peck') {
      if (b.t <= 0) { b.t = 0.5 + Math.random() * 1.5; b.x += (Math.random() - 0.5) * UNIT * 0.6; b.hop = 0.15; }
      b.hop = Math.max(0, (b.hop || 0) - dt);
      if (Math.hypot(h.x - b.x, h.y - b.y) < UNIT * 3) scareFlock(h.x, h.y, 3);
    } else if (b.mode === 'fly') {
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += UNIT * 5 * dt;
      if (b.z > UNIT * 8) { b.mode = 'gone'; b.t = 15 + Math.random() * 15; }
    } else if (b.mode === 'gone' && b.t <= 0) {
      landSpot(b);
      if (Math.hypot(h.x - b.x, h.y - b.y) < UNIT * 5) { b.t = 3; continue; }
      b.mode = 'land'; b.z = UNIT * 6; b.t = 1.2;
    } else if (b.mode === 'land') {
      b.z = Math.max(0, UNIT * 6 * b.t / 1.2);
      if (b.t <= 0) { b.mode = 'peck'; b.z = 0; }
    }
  }
}

// =====================================================================
// Drawing: one scene painter for every area. Areas differ by palette,
// ground detail, and how much shade the lighting pass lays over them.
// =====================================================================
const PAL = {
  green: { trunk: '#5a3d22', leaf: ['#23572c', '#2e6c38', '#3a7d42'] },
  deep:  { trunk: '#3e2a18', leaf: ['#153a1d', '#1c4724', '#24552c'] },
  grey:  { trunk: '#6b5a48' },
  bog:   { trunk: '#2d2a22' },
};
// three branch patterns for dead trees: [height along trunk, angle, length, twig?]
const BRANCHES = [
  [[0.55, -0.9, 0.55, 1], [0.8, 0.8, 0.5, 0], [0.95, -0.3, 0.35, 0]],
  [[0.45, 1.0, 0.6, 1], [0.7, -1.1, 0.45, 1], [0.9, 0.4, 0.3, 0]],
  [[0.6, -1.3, 0.7, 0], [0.62, 1.2, 0.55, 1], [0.92, -0.5, 0.3, 1]],
];

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const c = state.cam, sc = sceneDef();
  ctx.save();
  if (state.shake > 0) { const m = state.shake * UNIT * 0.5; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  ctx.translate(W / 2, H / 2); ctx.scale(c.ez, c.ez); ctx.translate(-c.ex, -c.ey);
  drawScene(sc);
  ctx.restore();
  drawHUD();
  if (state.flash > 0) { ctx.fillStyle = `rgba(235,240,255,${state.flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  if (state.fade > 0.01) { ctx.fillStyle = `rgba(0,0,0,${state.fade})`; ctx.fillRect(0, 0, W, H); }
  drawTexts();
  drawChoice();
  drawTitle();
  if (state.menu) drawMenu();
}

function drawScene(sc) {

  drawGas(false);

  const layer = [];
  for (const s of state.solids) if (s.kind === 'tree' || s.kind === 'deadtree') layer.push([s.y, () => drawTree(s)]);
  for (const pl of sc.pullables) layer.push([pl.fy * H + UNIT * 0.35, () => drawPullable(sc, pl)]);
  for (const e of state.enemies) layer.push([e.y, () => drawEnemy(e)]);
  for (const n of sc.npcs) layer.push([n.fy * H, () => drawNpc(n)]);

  layer.push([state.hero.y, drawHero]);
  layer.sort((a, b) => a[0] - b[0]).forEach(l => l[1]());
  drawShots();
  for (const b of state.flock) if (b.z > 0) drawSmallBird(b);
  if (state.bird) drawBird();
  for (const z of state.hazards) { const k = Math.max(0, z.t / z.dur); if (k > 0) { if (z.kind === 'stalactite') drawStalactite(z.x, z.y - (1 - k) * H * 0.6, z.r); else drawRock(z.x, z.y - (1 - k) * H * 0.6, z.r * 0.7); } }

  if (sc.area === 'marsh') drawFog();
  drawLighting(sc);

  }
  if (state.blind > 0) { ctx.fillStyle = `rgba(250,255,235,${Math.min(0.92, state.blind / 1.8)})`; ctx.fillRect(-W, -H, W * 3, H * 3); }
}
function drawChoice() {
  const c = state.choice; if (!c) return;
  const fs = Math.round(Math.max(14, Math.min(19, UNIT * 0.52)));
  ctx.font = `bold ${fs}px "Courier New", monospace`;
  const optW = c.options.map(o => ctx.measureText(o).width + 28), total = optW.reduce((a, b) => a + b, 0) + 10 * (c.options.length - 1);
  const bw = Math.max(ctx.measureText(c.text).width + 30, total + 20), bh = fs * 3.6;

  ctx.textAlign = 'center'; ctx.fillStyle = '#fdf6e3'; ctx.fillText(c.text, sx, sy + fs * 1.3);

    ctx.fillStyle = sel ? '#ffe38a' : '#fdf6e3'; ctx.fillText(o, ox + optW[i] / 2, sy + fs * 2.95);
    state.choiceRects.push({ x: ox, y: sy + fs * 1.9, w: optW[i], h: fs * 1.4, i });

}
function drawVineWrap(x, y) {
  ctx.strokeStyle = '#3f7a32'; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(x, y - UNIT * 0.3 + i * UNIT * 0.22, UNIT * 0.6, UNIT * 0.14, 0.2 * (i % 2 ? 1 : -1), 0, 6.28); ctx.stroke(); }
}
function drawStalactite(x, y, r) {
  ctx.fillStyle = '#4a4450'; ctx.beginPath(); ctx.moveTo(x - r * 0.5, y - r * 1.4); ctx.lineTo(x + r * 0.5, y - r * 1.4); ctx.lineTo(x, y + r * 0.6); ctx.fill();
  ctx.fillStyle = '#5c5664'; ctx.beginPath(); ctx.moveTo(x - r * 0.2, y - r * 1.4); ctx.lineTo(x + r * 0.05, y - r * 1.4); ctx.lineTo(x, y + r * 0.3); ctx.fill();
}
function drawSmallBird(b) {
  if (b.mode === 'gone') return;

  if (b.z > 0) { ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(b.x, b.y + UNIT * 0.3, s * 0.5, s * 0.2, 0, 0, 6.28); ctx.fill(); }
  ctx.fillStyle = b.c;
  if (b.mode === 'peck') {
    const dip = Math.sin(state.time * 6 + b.x) > 0.7 ? s * 0.15 : 0;
    ctx.beginPath(); ctx.ellipse(b.x, y, s * 0.5, s * 0.36, 0, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x + s * 0.4, y - s * 0.2 + dip, s * 0.22, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#e8c04a'; ctx.fillRect(b.x + s * 0.58, y - s * 0.22 + dip, s * 0.18, s * 0.08);
  } else {
    const flap = Math.sin(state.time * 32 + b.x) * s * 0.8;
    ctx.beginPath(); ctx.ellipse(b.x, y, s * 0.4, s * 0.28, 0, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x, y); ctx.lineTo(b.x - s * 1.1, y - flap); ctx.lineTo(b.x - s * 0.2, y + s * 0.1); ctx.fill();
