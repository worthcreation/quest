<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root { --ink: #fdf6e3; }
  html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #000; color: var(--ink); font-family: "Courier New", monospace; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #fsTip { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: 86vw; background: rgba(10,8,14,.85); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: .85rem; text-align: center; line-height: 1.35; }
  #pad { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; opacity: .85; }
  #pad button, .abtn { background: rgba(0,0,0,.38); color: var(--ink); border: 0; touch-action: none; font: inherit; }
  #pad button { font-size: 1.3rem; border-radius: 8px; }
  #pad button:active, .abtn:active { background: rgba(0,0,0,.65); }
  .abtn { position: fixed; border-radius: 50%; font-weight: bold; opacity: .85; }
  #act  { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; font-size: 1.5rem; }
  #dash { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #eat  { right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #jump { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; font-size: .85rem; }
  #throw { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .75rem; }
  #fire { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(164px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: .8rem; }
  #menubtn { left: calc(12px + env(safe-area-inset-left, 0px)); top: auto; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 10px; font-size: 1.2rem; }
  .hidden { display: none; }
  @media (pointer: fine) and (min-width: 900px) { #pad, .abtn { display: none !important; } }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #3f8f4c; font-size: 1.4rem; letter-spacing: 2px; cursor: pointer; text-align: center; padding: 20px; }
  #start small { font-size: .9rem; letter-spacing: 1px; opacity: .85; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fsTip" class="hidden"></div>
<div id="pad">
  <span></span><button data-dir="up">&#9650;</button><span></span>
  <button data-dir="left">&#9664;</button><span></span><button data-dir="right">&#9654;</button>
  <span></span><button data-dir="down">&#9660;</button><span></span>
</div>
<button id="act" class="abtn">A</button>
<button id="jump" class="abtn">jump</button>
<button id="throw" class="abtn hidden">throw</button>
<button id="dash" class="abtn hidden">dash</button>
<button id="eat" class="abtn hidden">eat</button>
<button id="fire" class="abtn hidden">fire</button>
<button id="menubtn" class="abtn">&#9776;</button>
<div id="start"><div>tap to begin</div><small id="startHint"></small></div>
<script>
'use strict';
// =====================================================================
// Screen
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
// Keys are remappable from the menu. K holds the on-screen names used in hints.
const DEFAULT_KEYS = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', act: 'f', jump: ' ', swap: 'r', dash: 'a', eat: 's', fire: 'e', menu: 'm' };
const ACTION_NAMES = { up: 'Move up', down: 'Move down', left: 'Move left', right: 'Move right', act: 'Use weapon / grab / talk / throw', jump: 'Jump', swap: 'Swap weapon', dash: 'Dodge', eat: 'Eat', fire: 'Marsh fire', menu: 'Menu' };
const K = {};
function keyName(k) { return { ' ': 'Space', arrowup: '\u2191', arrowdown: '\u2193', arrowleft: '\u2190', arrowright: '\u2192', escape: 'Esc', enter: 'Enter' }[k] || (k.length === 1 ? k.toUpperCase() : k); }
function refreshK() {
  if (TOUCH) Object.assign(K, { act: 'A', jump: 'jump', swap: 'swap', dash: 'dodge', eat: 'eat', fire: 'fire', menu: 'menu', l: '\u25C0', r: '\u25B6', u: '\u25B2' });
  else { const m = (state && state.settings && state.settings.keys) || DEFAULT_KEYS; for (const a in DEFAULT_KEYS) K[a] = keyName(m[a]); K.l = K.left; K.r = K.right; K.u = K.up; }
}
var state;
refreshK();
document.getElementById('startHint').textContent = TOUCH ? 'd-pad to move, A to act' : 'arrow keys to move, F to act, Space to jump, M for menu';
let W = window.innerWidth, H = window.innerHeight, UNIT = 32, DPR = window.devicePixelRatio || 1;
const computeUnit = () => { UNIT = Math.max(20, Math.min(W, H) / 14); };
computeUnit();
const L = () => Math.max(W, H);

// =====================================================================
// Random (seeded per adventure; the seed is what a save file stores)
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;
const rr = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp01 = v => Math.max(0.04, Math.min(0.96, v));

// =====================================================================
// World generation (done at a fixed virtual size so a seed always
// produces the same world on any screen)
// =====================================================================
const AREA_NAMES = { peak: 'The High Crags', indoor: 'Old Wick\'s Shack', river: 'The Gleaming River', forest: 'The Glade', woods: 'The Deep Woods', field: 'The Windswept Field', cave: 'The Dank Cave', marsh: 'The Marsh', swamp: 'The Sunken Swamp', hollow: 'The Hollow Beneath' };
const SHROOM_NAMES = { camp: 'Home camp', w2: 'Deep Woods', foot: 'Foothill Farm', c4: 'Dank Cave', m1: 'Marsh edge', sw2: 'Sunken Swamp' };
const OPP = { n: 's', s: 'n', e: 'w', w: 'e' };
// after the rescue: a gremlin fled with Pip's journal, back through the glade and the woods to where the sword was
const THIEF_ROUTE = ['start', 'w1', 'w2', 'w3'];
const BEANS = 7;              // always lying about: 1 on the toad's screen, 2 on each other marsh screen, 1 on each of the first two swamp screens

function edgePoint(side, along) {
  if (side === 'n') return [along, 0.03];
  if (side === 's') return [along, 0.97];
  if (side === 'w') return [0.03, along];
  return [0.97, along];
}
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function makePath(a, b, bends) {
  const pts = [a];
  for (let i = 1; i <= bends; i++) {
    const t = i / (bends + 1);
    pts.push([clamp01(a[0] + (b[0] - a[0]) * t + rr(-0.22, 0.22)), clamp01(a[1] + (b[1] - a[1]) * t + rr(-0.2, 0.2))]);
  }
  pts.push(b);
  return pts;
}
// A river is a centreline (upstream first) with a width, plus optional stepping stones of dry rock.
function riverHit(sc, x, y, pad = 0, stonesCount = true) {
  const r = sc.river; if (!r) return false;
  const half = (r.wH ? r.wH * H : r.w * UNIT) / 2 + pad;
  let d = Infinity;
  for (let i = 0; i < r.pts.length - 1; i++) d = Math.min(d, distSeg(x, y, r.pts[i][0] * W, r.pts[i][1] * H, r.pts[i + 1][0] * W, r.pts[i + 1][1] * H));
  if (d > half) return false;
  if (stonesCount && (r.stones || []).some(s => Math.hypot(x - s[0] * W, y - s[1] * H) < s[2] * UNIT * 0.9)) return false;
  return true;
}
function inRects(rects, fx, fy, pad = 0) { return rects.some(([x0, y0, x1, y1]) => fx > x0 - pad && fx < x1 + pad && fy > y0 - pad && fy < y1 + pad); }
function clearSpot(sc, fx, fy, rU, pathW, keep) {
  const x = fx * W, y = fy * H, r = rU * UNIT;
  for (const p of sc.paths) for (let i = 0; i < p.length - 1; i++)
    if (distSeg(x, y, p[i][0] * W, p[i][1] * H, p[i + 1][0] * W, p[i + 1][1] * H) < pathW * UNIT + r) return false;
  for (const k of keep) if (Math.hypot(x - k[0] * W, y - k[1] * H) < k[2] * UNIT + r) return false;
  for (const s of sc.solids) if (Math.hypot(x - s.fx * W, y - s.fy * H) < (s.r + rU) * UNIT * 0.85) return false;
  if (sc.chasms && inRects(sc.chasms, fx, fy, 0.04)) return false;
  if (riverHit(sc, x, y, r + UNIT * 0.5, false)) return false;
  if (onClaim(sc, fx, fy, rU * 0.6)) return false;          // no tree or boulder on top of something you use
  return true;
}
// Every solid carries a look: variant (branch pattern), flip, palette.
function solid(fx, fy, r, kind, pal, extra) { return Object.assign({ fx, fy, r, kind, v: Math.floor(rng() * 3), flip: rng() < 0.5, pal: pal || null }, extra); }
function scatter(sc, n, kind, rMin, rMax, pathW, keep = [], box = [0.06, 0.94, 0.08, 0.92], pal) {
  let placed = 0;
  for (let tries = 0; tries < n * 60 && placed < n; tries++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]), r = rr(rMin, rMax);
    if (clearSpot(sc, fx, fy, r, pathW, keep)) { sc.solids.push(solid(fx, fy, r, kind, pal)); placed++; }
  }
}
function edgeWall(sc, side, kind, rU, gaps, density = 1.6, pal) {
  const horiz = side === 'n' || side === 's', len = horiz ? W : H;
  const step = rU * UNIT * density, n = Math.ceil(len / step) + 1;
  for (let i = 0; i < n; i++) {
    const along = (i * step + rr(-0.15, 0.15) * step) / len;
    if (along < -0.02 || along > 1.02) continue;
    const margin = rU * UNIT * 1.2 / len;
    if (gaps.some(([a, b]) => along > a - margin && along < b + margin)) continue;
    const inset = rU * UNIT * 0.45, r = rU * rr(0.85, 1.2);
    const [fx, fy] = side === 'n' ? [along, inset / H] : side === 's' ? [along, 1 - inset / H]
      : side === 'w' ? [inset / W, along] : [1 - inset / W, along];
    sc.solids.push(solid(fx, fy, r, kind, pal));
  }
}
// A barrier is a line of solids sharing an id; breaking it removes them all.
function barrier(sc, id, kind, x0, y0, x1, y1, rU = 0.6) {
  const n = Math.max(2, Math.ceil(Math.hypot((x1 - x0) * W, (y1 - y0) * H) / (rU * UNIT * 1.2)));
  for (let i = 0; i <= n; i++) sc.solids.push(solid(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, rU, kind, null, { bar: id }));
}
function ringBarrier(sc, id, kind, cx, cy, radU, rU = 0.5) {
  for (let a = 0; a < 6.28; a += 0.55) sc.solids.push(solid(cx + Math.cos(a) * radU * UNIT / W, cy + Math.sin(a) * radU * UNIT / H, rU, kind, null, { bar: id }));
}
function gapAt(c, half = 0.09) { return [Math.max(0.1, c - half), Math.min(0.9, c + half)]; }
// every interactable (mushroom, plot, rock, plate, character, pickup) claims a patch of ground;
// nothing else may be placed on a claim, so no two ever share a spot
function claim(sc, fx, fy, rU) { sc.claims.push([fx, fy, rU]); }
const onClaim = (sc, fx, fy, rU) => sc.claims.some(c => Math.hypot((fx - c[0]) * W, (fy - c[1]) * H) < (c[2] + rU) * UNIT);
function pullable(sc, o) { sc.pullables.push(o); claim(sc, o.fx, o.fy, 1.4); }
function npc(sc, o) { sc.npcs.push(o); claim(sc, o.fx, o.fy, 1.5); }
function item(sc, ...os) { for (const o of os) { sc.initItems.push(o); claim(sc, o.fx, o.fy, 0.6); } }
function freeSpot(sc, box, rU, keep = []) {
  // first spot that clears everything; if the screen is too crowded, the spot that comes closest,
  // treating claims as the thing that must never be broken
  let best = null, bestScore = -Infinity;
  for (let i = 0; i < 400; i++) {
    const fx = rr(box[0], box[1]), fy = rr(box[2], box[3]);
    if (sc.chasms && inRects(sc.chasms, fx, fy, 0.05)) continue;
    const x = fx * W, y = fy * H;
    if (riverHit(sc, x, y, rU * UNIT, false)) continue;
    let score = Infinity;
    for (const c of sc.claims) score = Math.min(score, (Math.hypot(x - c[0] * W, y - c[1] * H) - (c[2] + rU) * UNIT) * 4);
    for (const s of sc.solids) score = Math.min(score, Math.hypot(x - s.fx * W, y - s.fy * H) - (s.r + rU) * UNIT);
    for (const k of keep) score = Math.min(score, Math.hypot(x - k[0] * W, y - k[1] * H) - k[2] * UNIT);
    if (score > 0) return [fx, fy];
    if (score > bestScore) { bestScore = score; best = [fx, fy]; }
  }
  return best || [rr(box[0], box[1]), rr(box[2], box[3])];
}
function decoFlowers(sc, n) {
  const cols = ['#f3e37a', '#f2f2f2', '#e98ac0', '#9fc6f5'];
  for (let i = 0; i < n; i++) sc.deco.push({ kind: 'flower', fx: rng(), fy: rng(), c: pick(cols) });
  for (let i = 0; i < 30; i++) sc.deco.push({ kind: 'grass', fx: rng(), fy: rng(), s: rr(0.5, 1) });
}
// farm patches: a few tilled plots near the path; what grows depends on the region
// spots other things already claim (puzzles, people) so farms and mushrooms keep their distance
const claimed = sc => sc.pullables.map(p => [p.fx, p.fy, 3]).concat((sc.feat.plates || []).map(p => [p.fx, p.fy, 3]), sc.npcs.map(n => [n.fx, n.fy, 3]), sc.pools.map(o => [o.fx, o.fy, o.r + 2]));
function addPlots(sc, n, box) {
  sc.feat.plots = sc.feat.plots || [];
  // try a few spots and keep the one with room for the most plots; test the whole row against what
  // was already there, then claim it (so plots don't block their neighbours)
  let row = [];
  for (let t = 0; t < 8 && row.length < n; t++) {
    const c = freeSpot(sc, t < 4 ? box : [0.12, 0.88, 0.15, 0.85], 2.2, claimed(sc));
    const r2 = Array.from({ length: n }, (_, i) => [c[0] + (i % 3) * 0.035 - 0.035, c[1] + Math.floor(i / 3) * 0.06])
      .filter(q => !onClaim(sc, q[0], q[1], 0.6) && !sc.pools.some(o => Math.hypot((q[0] - o.fx) * W, (q[1] - o.fy) * H) < (o.r + 0.9) * UNIT) && sc.solids.every(s => Math.hypot((q[0] - s.fx) * W, (q[1] - s.fy) * H) > (s.r * 0.6 + 0.6) * UNIT));
    if (r2.length > row.length) row = r2;
  }
  row.forEach(q => { sc.feat.plots.push(q); claim(sc, q[0], q[1], 0.7); });
}
// a traveler's mushroom, with a little farm beside it
function addShroom(sc, spot, plots = 3) {
  const p = spot || freeSpot(sc, [0.2, 0.8, 0.2, 0.8], 2.6, claimed(sc));
  sc.feat.shroom = p;
  sc.solids.push(solid(p[0], p[1], 0.7, 'shroom'));
  claim(sc, p[0], p[1], 1.8);
  if (plots) {
    sc.feat.plots = sc.feat.plots || [];
    let row = [];
    for (let t = 0; t < 8 && row.length < plots; t++) {
      const spread = 0.2 + t * 0.05;
      const c = freeSpot(sc, [Math.max(0.12, p[0] - spread), Math.min(0.88, p[0] + spread), Math.max(0.15, p[1] - spread), Math.min(0.85, p[1] + spread)], 1.8, [[...p, 2], ...claimed(sc)]);
      const r2 = Array.from({ length: plots }, (_, i) => [c[0] + (i - 1) * 0.035, c[1]])
        .filter(q => !sc.pools.some(o => Math.hypot((q[0] - o.fx) * W, (q[1] - o.fy) * H) < (o.r + 0.9) * UNIT) && !onClaim(sc, q[0], q[1], 0.6) && sc.solids.every(s => Math.hypot((q[0] - s.fx) * W, (q[1] - s.fy) * H) > (s.r * 0.6 + 0.6) * UNIT));   // never in the water, under anything, or in a trunk
      if (r2.length > row.length) row = r2;
    }
    row.forEach(q => { sc.feat.plots.push(q); claim(sc, q[0], q[1], 0.7); });
  }
}
// ---- rock puzzle pieces: stone plates, log gates held shut, rings of stones ----
function plate(sc, id, spot) { (sc.feat.plates = sc.feat.plates || []).push({ id, fx: spot[0], fy: spot[1] }); claim(sc, spot[0], spot[1], 1.3); }
function logGate(sc, bar, plateId, x0, y0, x1, y1) { barrier(sc, bar, 'log', x0, y0, x1, y1, 0.55); sc.solids.forEach(s => { if (s.bar === bar) s.plate = plateId; }); }
function stoneRing(sc, c, radU, gapAng = null, gapHalf = 0.5) {
  const n = Math.ceil(Math.PI * 2 * radU / 0.7);
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2;
    if (gapAng != null && Math.abs(Math.atan2(Math.sin(a - gapAng), Math.cos(a - gapAng))) < gapHalf) continue;
    sc.solids.push(solid(c[0] + Math.cos(a) * radU * UNIT / W, c[1] + Math.sin(a) * radU * UNIT / H, 0.45, 'stone'));
  }
}
function newScene(o) {
  return Object.assign({ claims: [], solids: [], deco: [], spawns: [], pullables: [], exits: [], pools: [], paths: [], feat: {}, npcs: [], initItems: [], speed: 0.5, accel: 10, shade: 0 }, o);
}

const GEN = { W: 1280, H: 800 };
function buildWorld(seed) {
  const saved = [W, H, UNIT];
  W = GEN.W; H = GEN.H; computeUnit();
  rng = mulberry32(seed >>> 0);
  try { return genWorld(); } finally { [W, H, UNIT] = saved; rng = mulberry32((seed ^ 0x9e3779b9) >>> 0); }
}

function genWorld() {
  const S = {};
  const add = sc => (S[sc.id] = sc);

  // ---------------- Camp (north of start): home, fire, tent, farm plots ----------------
  const camp = add(newScene({ id: 'camp', area: 'forest', msg: '', music: 'forest', amb: 'none', floor: '#4a8f4c', heroStart: [0.44, 0.5] }));
  camp.exits = [{ side: 's', a: 0.4, b: 0.6, to: 'start' }];
  camp.feat.fire = [0.5, 0.45];
  camp.feat.plots = [[0.2, 0.68], [0.28, 0.68], [0.36, 0.68], [0.2, 0.8], [0.28, 0.8], [0.36, 0.8]];
  camp.feat.pip = [0.58, 0.44];
  npc(camp, { kind: 'pip', fx: 0.6, fy: 0.5, home: true });
  camp.solids.push(solid(0.5, 0.45, 0.45, 'campfire'), solid(0.33, 0.33, 1.1, 'tent'), solid(0.64, 0.34, 0.6, 'bench'));
  claim(camp, 0.5, 0.45, 1.5); claim(camp, 0.33, 0.33, 1.8); claim(camp, 0.64, 0.34, 1.2);
  camp.feat.plots.forEach(p => claim(camp, p[0], p[1], 0.7));
  camp.feat.bench = [0.64, 0.34];
  camp.paths = [makePath([0.5, 0.97], [0.5, 0.55], 1), makePath([0.45, 0.55], [0.28, 0.74], 0)];
  edgeWall(camp, 'n', 'tree', 1.1, [], 1.5, 'green');
  edgeWall(camp, 'w', 'tree', 1.1, [], 1.6, 'green');
  edgeWall(camp, 'e', 'tree', 1.1, [], 1.6, 'green');
  addShroom(camp, [0.78, 0.62], 0);
  scatter(camp, 6, 'tree', 0.9, 1.2, 1.4, [[0.45, 0.5, 5], [0.28, 0.74, 4], [0.78, 0.62, 2.5]], undefined, 'green');
  decoFlowers(camp, 20);

  // ---------------- Start glade: the big rock, the thicket into the woods ----------------
  const start = add(newScene({ id: 'start', area: 'forest', msg: '', music: 'forest', amb: 'none', floor: '#3f8f4c', heroStart: [0.5, 0.12] }));
  start.feat.pip = [0.84, 0.5];
  start.exits = [
    { side: 'n', a: 0.4, b: 0.6, to: 'camp' },
    { side: 'w', a: 0.38, b: 0.62, to: 'meadow' },
    { side: 's', a: 0.42, b: 0.58, to: 'f1' },
    { side: 'e', a: 0.4, b: 0.6, to: 'w1', locked: () => !broken('start', 'thicket') },

    for (let r = 0; r < F.rabbits; r++) {

      const p = freeSpot(sc, box, 1.0);
      sc.spawns.push({ type: 'rabbit', fx: p[0], fy: p[1] });
    }
    for (let t = 0; t < 90; t++) { const fx = rng(), fy = rng(); if (!inRects(F.chasms, fx, fy)) sc.deco.push({ kind: 'tuft', fx, fy, s: rr(0.6, 1.3), ph: rng() * 6 }); }
    // rock banks: out in the ravines to hop across on, and slabs on the banks; the wind can't move you on rock
    sc.rocks = [];
    sc.rockCols = F.chasms.map(() => rng());                                 // where each ravine's rock column stands, fixed per seed
    const edges = [0.1].concat(F.chasms.flatMap(c => [c[1], c[3]])).concat([0.92]).sort((a, b) => a - b);
    sc.windLedges = true; sc.ledgeSeed = rng();          // landing ledges on every bank, laid out in tiles on arrival
    if (F.end) sc.exits.push({ side: 'e', a: 0.76, b: 0.93, to: 'peak1', locked: () => !state.inv.tortoise });
    if (south) north = south;
  });

  // ---------------- The High Crags: above the tortoise. Stone, cliffs, ravines you can jump, rocky outcrops ----------------
  const CRAGS = [
    { id: 'peak1', msg: 'The grass gives out. Only stone from here up.', ravines: [0.28], cliffs: [[0.47, 0.42, 1]], from: 'w' },
    { id: 'peak2', msg: 'Cliffs and cracks all the way up', ravines: [0.2, 0.58], cliffs: [[0.4, 0.35, 1], [0.76, 0, 0.62]], from: 's' },
    { id: 'peak3', msg: 'The summit. Something huge circles overhead.', ravines: [0.72], cliffs: [], from: 's', top: true },
  ];
  CRAGS.forEach((C, k) => {
    const sc = add(newScene({ id: C.id, area: 'peak', depth: 8 + k, msg: C.msg, music: 'field', amb: 'wind', floor: '#8b8680', speed: 0.42, accel: 8, chasms: [] }));
    sc.ravines = C.ravines.map(y => ({ y, hU: 1.7 }));                       // sized in tiles when you arrive, so they're always jumpable
    sc.exits = [];
    if (C.from === 'w') sc.exits.push({ side: 'w', a: 0.4, b: 0.6, to: 'f7' }); else sc.exits.push({ side: 's', a: 0.42, b: 0.58, to: CRAGS[k - 1].id });
    if (!C.top) sc.exits.push({ side: 'n', a: 0.42, b: 0.58, to: CRAGS[k + 1].id });
    for (const side of ['n', 's', 'w', 'e']) { const ex = sc.exits.find(e => e.side === side); edgeWall(sc, side, 'cliff', 1.1, ex ? [[ex.a, ex.b]] : [], 1.3); }
    for (const [y, x0, x1] of C.cliffs) for (let x = x0; x <= x1; x += 0.045) sc.solids.push(solid(x, y, 0.75, 'cliff'));
    const band = y => C.ravines.some(r => Math.abs(y - r) < 0.08) || C.cliffs.some(c => Math.abs(y - c[0]) < 0.06);
    for (let t = 0; t < 7; t++) { const q = freeSpot(sc, [0.1, 0.9, 0.12, 0.88], 1.3); if (!band(q[1])) sc.solids.push(solid(q[0], q[1], rr(0.7, 1.2), 'boulder')); }
    for (let t = 0; t < 14; t++) { const fx = rng(), fy = rng(); if (!band(fy)) sc.deco.push({ kind: 'tuft', fx, fy, s: rr(0.5, 0.9), ph: rng() * 6 }); }
    sc.rocks = [];
    if (C.top) { sc.solids.push(solid(0.5, 0.33, 0.9, 'cairn')); item(sc, { type: 'starseed', fx: 0.5, fy: 0.42 }); }
  });

  // ---------------- Foothill farm: where the mountain wind dumps you. Many crops. ----------------
  const foot = add(newScene({ id: 'foot', area: 'field', depth: 0, msg: 'A sheltered farm at the mountain\'s foot', music: 'forest', amb: 'wind', floor: '#86a052', speed: 0.45, accel: 8, gusts: [{ a: 0.2, s: 1 }, { a: Math.PI - 0.2, s: 1 }, { a: -0.2, s: 1 }, { a: Math.PI + 0.2, s: 1 }], chasms: [], heroStart: [0.5, 0.3] }));
  foot.exits = [{ side: 'e', a: 0.4, b: 0.6, to: 'f1' }];
  foot.feat.plants = [];
  edgeWall(foot, 'n', 'boulder', 1.0, []); edgeWall(foot, 'w', 'boulder', 1.0, []); edgeWall(foot, 's', 'boulder', 1.0, []);
  edgeWall(foot, 'e', 'boulder', 1.0, [[0.4, 0.6]]);
  foot.paths = [makePath([0.97, 0.5], [0.3, 0.5], 1)];
  foot.feat.plots = [];
  foot.feat.crops = [];
  const CROPS = ['squash', 'carrot', 'berries', 'turnip', 'pepper', 'squash'];
  foot.feat.plotLv = 1;                              // someone farmed here before you: already tilled
  for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) { foot.feat.plots.push([0.22 + c * 0.06, 0.45 + r * 0.12]); foot.feat.crops.push(CROPS[c]); claim(foot, 0.22 + c * 0.06, 0.45 + r * 0.12, 0.7); }
  addShroom(foot, [0.82, 0.28], 0);
  scatter(foot, 4, 'boulder', 0.7, 1.1, 1.5, [[0.37, 0.51, 6], [0.82, 0.28, 2.5]], [0.1, 0.9, 0.12, 0.88]);
  for (let t = 0; t < 60; t++) foot.deco.push({ kind: 'tuft', fx: rng(), fy: rng(), s: rr(0.6, 1.3), ph: rng() * 6 });

  // ---------------- Cave: 7 screens, entered through the sinkhole in the woods ----------------
  const CAVE_SPAWNS = [
    ['stalker'], ['glowworm', 'glowworm', 'stalker'], ['diver', 'glowworm'], ['charger', 'diver'],
    ['stalker', 'diver', 'diver', 'glowworm'], ['charger', 'diver', 'diver', 'diver', 'glowworm'], ['warden'],
  ];
  const CAVE_MSG = ['Find the way out', 'Pale things crawl in the dark', 'Something skitters on the ceiling', 'Deeper still. Hooves scrape stone.', 'The ceiling is alive', 'The drips sound like footsteps', 'A roar of water ahead'];
  const CAVE_FLOOR = ['#1d1a22', '#1e1a21', '#201a21', '#211a1f', '#221a1e', '#231a1c', '#1c1d26'];
  west = null;
  for (let i = 1; i <= 7; i++) {
    const boss = i === 7;
    const sc = add(newScene({
      id: 'c' + i, area: 'cave', depth: i, msg: CAVE_MSG[i - 1], shade: 0.96, lightScale: 1,
      music: i <= 3 ? 'cave' : 'cave2', amb: boss ? 'falls' : 'none', drips: true,
      floor: CAVE_FLOOR[i - 1], speed: 0.3, accel: 6, heroStart: [0.08, 0.5],
    }));
    const east = boss ? [0.4, 0.6] : gapAt(rr(0.25, 0.75), 0.09);
    if (west) sc.exits.push({ side: 'w', a: west[0], b: west[1], to: 'c' + (i - 1) });
    else sc.exits.push({ side: 'w', a: 0.4, b: 0.6, to: 'w3', arrive: 'sinkhole', say: 'You climb the roots back up.' });
    sc.exits.push({ side: 'e', a: east[0], b: east[1], to: boss ? 'fallsbank' : 'c' + (i + 1), locked: boss ? () => !(RT.c7 && RT.c7.bossDead) : null });
    edgeWall(sc, 'n', 'cavewall', 1.1, [], 1.4);
    edgeWall(sc, 's', 'cavewall', 1.1, [], 1.4);
    edgeWall(sc, 'w', 'cavewall', 1.1, west ? [west] : [[0.4, 0.6]], 1.4);
    if (!boss) edgeWall(sc, 'e', 'cavewall', 1.1, [east], 1.4);
    const wPt = west ? edgePoint('w', (west[0] + west[1]) / 2) : [0.06, 0.5];
    sc.paths = [makePath(wPt, boss ? [0.8, 0.5] : edgePoint('e', (east[0] + east[1]) / 2), 2)];
    if (i === 4) addShroom(sc);
    if (i === 3) { const q = freeSpot(sc, [0.3, 0.8, 0.2, 0.8], 1, []); item(sc, { type: 'recipe_temper', fx: q[0], fy: q[1] }); }
    if (!boss) scatter(sc, 1 + i, 'stalagmite', 0.8, 1.2, 2.2, sc.feat.shroom ? [[...sc.feat.shroom, 3]] : [], [0.15, 0.85, 0.15, 0.85]);
    else {
      sc.feat.falls = true;
      for (let k = 0; k < 6; k++) { const a = k / 6 * 6.28 + 0.5; sc.solids.push(solid(0.55 + Math.cos(a) * 0.22, 0.5 + Math.sin(a) * 0.3, 0.8, 'stalagmite')); }
    }
    CAVE_SPAWNS[i - 1].forEach(type => {
      const p = type === 'warden' ? [0.62, 0.5] : freeSpot(sc, [0.35, 0.85, 0.2, 0.8], 1.3, [[...wPt, 6]]);
      sc.spawns.push({ type, fx: p[0], fy: p[1] });
    });
    for (let t = 0; t < 46; t++) sc.deco.push({ kind: 'pebble', fx: rng(), fy: rng(), s: rr(0.4, 1.6), shade: rng() });
    if (i >= 3 && i <= 6) sc.webs = Array.from({ length: i - 1 }, () => { const q = freeSpot(sc, [0.2, 0.8, 0.2, 0.8], 1.2); return { fx: q[0], fy: q[1], r: rr(0.9, 1.4) }; });
    if (i === 3 || i === 6) sc.feat.glimpse = { to: edgePoint('e', (east[0] + east[1]) / 2), line: i === 3 ? 'Still here! Keep coming!' : 'I can hear water! Hurry!' };
    west = east;
  }

  // ---------------- Marsh: beans for the old toad, reeds hiding a darker cave ----------------
  const MARSH_MSG = ['Mist hangs over black water', 'Something big croaks nearby', 'Dry reeds choke a cave mouth'];
  west = [0.4, 0.6];
  for (let i = 1; i <= 3; i++) {
    const last = i === 3;
    const sc = add(newScene({ id: 'm' + i, area: 'marsh', depth: i, msg: MARSH_MSG[i - 1], music: 'marsh', amb: 'marsh', floor: '#3a4a2d', speed: 0.34, accel: 7, breeze: 0.02 }));
    // the river out of the falls bank enters at the top of the west edge and runs off the north edge
    if (i === 1) sc.river = { pts: [[-0.08, 0.12], [0.1, 0.08], [0.24, -0.08]], w: 2.8 };
    const east = last ? [0.4, 0.6] : gapAt(rr(0.25, 0.75), 0.1);
    sc.exits.push({ side: 'w', a: west[0], b: west[1], to: i === 1 ? 'fallsbank' : 'm' + (i - 1) });
    sc.exits.push({ side: 'e', a: east[0], b: east[1], to: last ? 'h1' : 'm' + (i + 1), locked: last ? () => !broken('m3', 'reeds') : null });
    edgeWall(sc, 'n', 'deadtree', 1.0, i === 1 ? [[0, 0.34]] : [], 1.9, 'bog');
    edgeWall(sc, 's', 'deadtree', 1.0, i === 2 ? [[0.4, 0.6]] : [], 1.9, 'bog');
    if (i === 2) sc.exits.push({ side: 's', a: 0.4, b: 0.6, to: 'sw1' });
    if (last) barrier(sc, 'reeds', 'reeds', 0.95, 0.34, 0.95, 0.66, 0.7);
    const wPt = edgePoint('w', (west[0] + west[1]) / 2), ePt = edgePoint('e', (east[0] + east[1]) / 2);
    sc.paths = [makePath(wPt, ePt, 2)];
    const npcSpot = i === 2 ? [rr(0.4, 0.6), rr(0.3, 0.7)] : null;
    if (npcSpot) npc(sc, { kind: 'toad', fx: npcSpot[0], fy: npcSpot[1] });
    for (let p = 0; p < 3 + i; p++) {
      const q = freeSpot(sc, [0.2, 0.8, 0.2, 0.8], 2.2, [[...wPt, 4], [...ePt, 3], ...(npcSpot ? [[...npcSpot, 3]] : []), ...sc.pools.map(o => [o.fx, o.fy, o.r + 2])]);
      sc.pools.push({ fx: q[0], fy: q[1], r: rr(1.2, 2.1) });
    }
    scatter(sc, 2 + i, 'deadtree', 0.7, 1.0, 1.8, sc.pools.map(o => [o.fx, o.fy, o.r + 0.5]), [0.1, 0.9, 0.15, 0.85], 'bog');
    const lurkers = [1, 1, 2][i - 1];
    for (let l = 0; l < lurkers; l++) sc.spawns.push({ type: 'lurker', fx: sc.pools[l].fx, fy: sc.pools[l].fy, pool: l });
    if (i === 1) addShroom(sc);
    for (let b = 0; b < (i === 2 ? 1 : 2); b++) {
      const q = freeSpot(sc, [0.1, 0.9, 0.15, 0.85], 0.8, sc.pools.map(o => [o.fx, o.fy, o.r]).concat(npcSpot ? [[...npcSpot, 3]] : []));
      item(sc, { type: 'bean', fx: q[0], fy: q[1] });
    }
    for (let t = 0; t < 50; t++) sc.deco.push({ kind: 'reed', fx: rng(), fy: rng(), s: rr(0.6, 1.2), ph: rng() * 6 });
    if (i === 1) sc.feat.glimpse = { to: ePt, line: 'Ugh, it stinks out here!' };
    if (i === 3) sc.feat.glimpse = { to: [0.99, 0.5], line: 'Past the reeds! They\'ve got a lair!' };
    west = east;
  }

  // ---------------- Sunken Swamp: south of the marsh, murkier, older ----------------
  const SWAMP_MSG = ['The marsh sinks into swamp', 'Things float here that shouldn\'t', 'Old stones rise from the water'];
  let north2 = [0.4, 0.6];
  for (let i = 1; i <= 3; i++) {
    const last = i === 3;
    const sc = add(newScene({ id: 'sw' + i, area: 'swamp', depth: i, msg: SWAMP_MSG[i - 1], music: 'swamp', amb: 'marsh', floor: ['#2f3d27', '#2b3824', '#283422'][i - 1], shade: 0.3 + i * 0.08, lightScale: 1.3, speed: 0.32, accel: 7, breeze: 0.01 }));
    sc.exits.push({ side: 'n', a: north2[0], b: north2[1], to: i === 1 ? 'm2' : 'sw' + (i - 1) });
    const south = last ? null : gapAt(rr(0.25, 0.75), 0.1);
    if (south) sc.exits.push({ side: 's', a: south[0], b: south[1], to: 'sw' + (i + 1) });
    edgeWall(sc, 'n', 'deadtree', 1.0, [north2], 1.6, 'bog');
    edgeWall(sc, 's', 'deadtree', 1.0, south ? [south] : [], 1.6, 'bog');
    edgeWall(sc, 'w', 'deadtree', 1.0, [], 1.6, 'bog');
    edgeWall(sc, 'e', 'deadtree', 1.0, [], 1.6, 'bog');
    const nPt = edgePoint('n', (north2[0] + north2[1]) / 2), sPt = south ? edgePoint('s', (south[0] + south[1]) / 2) : [0.5, 0.75];
    sc.paths = [makePath(nPt, sPt, 3)];
    if (i === 2) sc.feat.shroomSpot = freeSpot(sc, [0.25, 0.75, 0.25, 0.75], 3, [[...nPt, 4], [...sPt, 4]]);
    if (last) { sc.feat.shrine = [0.5, 0.72]; claim(sc, 0.5, 0.72, 1.8); sc.solids.push(solid(0.38, 0.72, 0.7, 'pillar', 'moss'), solid(0.62, 0.72, 0.7, 'pillar', 'moss')); }
    for (let p = 0; p < 4 + i; p++) {
      const q = freeSpot(sc, [0.15, 0.85, 0.2, 0.8], 2.2, [[...nPt, 4], [...sPt, 3], ...(sc.feat.shroomSpot ? [[...sc.feat.shroomSpot, 6]] : []), ...(last ? [[0.5, 0.72, 4]] : []), ...sc.pools.map(o => [o.fx, o.fy, o.r + 1.5])]);
      sc.pools.push({ fx: q[0], fy: q[1], r: rr(1.3, 2.4) });
    }
    scatter(sc, 5 + i * 2, 'deadtree', 0.7, 1.1, 1.5, sc.pools.map(o => [o.fx, o.fy, o.r + 0.4]).concat(sc.feat.shroom ? [[...sc.feat.shroom, 3]] : []), [0.1, 0.9, 0.12, 0.88], 'bog');
    if (i === 2) addShroom(sc, sc.feat.shroomSpot);
    const lurk = Math.min(sc.pools.length, i + 1);
    for (let l = 0; l < lurk; l++) sc.spawns.push({ type: 'lurker', fx: sc.pools[l].fx, fy: sc.pools[l].fy, pool: l });
    for (const type of [['glowworm'], ['gremlin', 'glowworm'], ['gremlin', 'gremlin', 'glowworm']][i - 1]) { const q = freeSpot(sc, [0.2, 0.8, 0.3, 0.8], 1.2, [[...nPt, 5]]); sc.spawns.push({ type, fx: q[0], fy: q[1] }); }
    if (i <= 2) { const q = freeSpot(sc, [0.15, 0.85, 0.2, 0.8], 0.8, sc.pools.map(o => [o.fx, o.fy, o.r])); item(sc, { type: 'bean', fx: q[0], fy: q[1] }); }
    if (last) item(sc, { type: 'recipe_star', fx: 0.5, fy: 0.64 }, { type: 'starseed', fx: 0.5, fy: 0.7 }, { type: 'emberseed', fx: 0.46, fy: 0.76 }, { type: 'ironseed', fx: 0.54, fy: 0.76 });
    for (let t = 0; t < 60; t++) sc.deco.push({ kind: 'reed', fx: rng(), fy: rng(), s: rr(0.6, 1.3), ph: rng() * 6 });
    if (south) north2 = south;
  }

  // ---------------- The Hollow Beneath: darker each screen; only fire lights it ----------------
  west = [0.4, 0.6];
  for (let i = 1; i <= 3; i++) {
    const last = i === 3;
    const sc = add(newScene({
      id: 'h' + i, area: 'hollow', depth: i, msg: ['Your light barely reaches the floor', 'Webs, thick as rope', 'Gremlin cackling echoes ahead'][i - 1],
      shade: 0.975, lightScale: [0.75, 0.55, 0.4][i - 1], music: 'cave2', amb: 'marsh', drips: true, floor: '#1a1d17', speed: 0.3, accel: 6, heroStart: [0.08, 0.5],
    }));
    const east = last ? null : gapAt(rr(0.3, 0.7), 0.1);
    sc.exits.push({ side: 'w', a: west[0], b: west[1], to: i === 1 ? 'm3' : 'h' + (i - 1) });
    if (east) sc.exits.push({ side: 'e', a: east[0], b: east[1], to: 'h' + (i + 1), locked: i === 2 ? () => !broken('h2', 'webs') : null });
    edgeWall(sc, 'n', 'cavewall', 1.1, [], 1.4, 'moss');
    edgeWall(sc, 's', 'cavewall', 1.1, [], 1.4, 'moss');
    edgeWall(sc, 'w', 'cavewall', 1.1, [west], 1.4, 'moss');
    edgeWall(sc, 'e', 'cavewall', 1.1, east ? [east] : [], 1.4, 'moss');
    const wPt = edgePoint('w', (west[0] + west[1]) / 2);
    const ePt = east ? edgePoint('e', (east[0] + east[1]) / 2) : [0.8, 0.5];
    sc.paths = [makePath(wPt, ePt, 2)];
    if (i === 2) barrier(sc, 'webs', 'web', 0.94, east[0] - 0.04, 0.94, east[1] + 0.04, 0.6);
    if (last) {
      npc(sc, { kind: 'pip', fx: 0.8, fy: 0.5 }); ringBarrier(sc, 'cocoon', 'vine', 0.8, 0.5, 1.3);
      sc.feat.darkShroom = [0.8 + 2.4 * UNIT / W, 0.5 - 1.6 * UNIT / H];       // the gremlins' spore mushroom, tangled in the same vines
      claim(sc, ...sc.feat.darkShroom, 1.4);
      sc.solids.push(solid(sc.feat.darkShroom[0], sc.feat.darkShroom[1], 0.8, 'shroom', null, { bar: 'darkshroom', dark: true }));
    }
    sc.webs = Array.from({ length: [4, 7, 5][i - 1] }, () => { const q = freeSpot(sc, [0.15, 0.85, 0.15, 0.85], 1.2, last ? [[0.8, 0.5, 3]] : []); return { fx: q[0], fy: q[1], r: rr(0.9, 1.5) }; });
    scatter(sc, 2 + i, 'stalagmite', 0.8, 1.2, 2.0, last ? [[0.8, 0.5, 3]] : [], [0.15, 0.85, 0.15, 0.85], 'moss');
    for (let p = 0; p < i; p++) {
      const q = freeSpot(sc, [0.3, 0.7, 0.2, 0.8], 2, [[...wPt, 5], [0.8, 0.5, 3.5]]);
      sc.pools.push({ fx: q[0], fy: q[1], r: rr(1.1, 1.6) });
    }
    const spawns = [['glowworm', 'lurker', 'gremlin'], ['diver', 'diver', 'glowworm', 'gremlin'], ['gremlin', 'gremlin', 'gremlin', 'lurker']][i - 1];
    let li = 0;
    spawns.forEach(type => {
      if (type === 'lurker') { const p = sc.pools[li]; sc.spawns.push({ type, fx: p.fx, fy: p.fy, pool: li++ }); return; }
      const q = freeSpot(sc, [0.35, 0.75, 0.2, 0.8], 1.2, [[...wPt, 6]]);
      sc.spawns.push({ type, fx: q[0], fy: q[1] });
    });
    for (let t = 0; t < 40; t++) sc.deco.push({ kind: 'pebble', fx: rng(), fy: rng(), s: rr(0.4, 1.4), shade: rng() });
    if (i === 2) sc.feat.glimpse = { to: ePt, line: 'Almost there! Don\'t stop!' };
    west = east;
  }
  return S;
}

// =====================================================================
// State
// =====================================================================
let WORLD = {};
let SEED = 1;
let RT = {};                   // runtime memory per scene: dead spawns, items, pulled things, flags
function rtFor(id) {
  if (!RT[id]) {
    const sc = WORLD[id];
    RT[id] = { deadAt: {}, items: sc ? sc.initItems.map(i => ({ ...i })) : [], pulled: new Set(), flags: {}, bossDead: false };
  }
  return RT[id];
}
const broken = (id, bar) => !!(RT[id] && RT[id].flags[bar]);

// vigor grows geometrically with depth (relics, the tortoise) and a little with training
const baseVig = depth => Math.round(8 * Math.pow(1.5, depth));
function newHero() { return { x: W * 0.5, y: H * 0.5, vx: 0, vy: 0, z: 0, stun: 0, invuln: 0, hurtT: -9, fx: 0, fy: 1, side: 1, vig: 8, rest: 0, dashT: 0, dashCool: 0, ride: null, falling: 0, safe: null }; }
// step, silk, horn are levelled relics (0 = not found, up to 3)

function scheduleMusic() {
  const m = MUSIC[currentMusic];
  while (nextNoteTime < audio.currentTime + 0.3) {
    const [mel, bass] = m.loop[noteIndex % m.loop.length];
    const s = Math.max(0, nextNoteTime - audio.currentTime);
    if (mel) tone(midiHz(mel + m.shift), s, m.step * m.lead.len, { type: m.lead.type, vol: m.lead.vol, attack: 0.05, dest: musicGain });
    if (mel && m.shimmer) tone(midiHz(mel) * 2, s, m.step * 0.9, { type: 'sine', vol: 0.025, attack: 0.02, dest: musicGain });
    if (bass) tone(midiHz(bass + m.shift), s, m.step * m.bass.len, { type: m.bass.type, vol: m.bass.vol, attack: m.bass.len < 2 ? 0.01 : 0.3, dest: musicGain });
    nextNoteTime += m.step;
    noteIndex++;
  }
  if (m.frogs && audio.currentTime > nextFrog) {
    const p = Math.random() * 1.6 - 0.8, f = 150 + Math.random() * 80;
    for (let i = 0; i < 2 + (Math.random() * 3 | 0); i++) tone(f, i * 0.13, 0.1, { type: 'square', vol: 0.03, attack: 0.005, to: f * 0.7, pan: p, dest: musicGain });
    nextFrog = audio.currentTime + 1.5 + Math.random() * 4;
  }
}
function setMusic(name) {
  if (!audio) { currentMusic = name; return; }
  if (name === currentMusic) return;
  const t = audio.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(0.0001, t + 0.6);
  currentMusic = name;
  setTimeout(() => {
    noteIndex = 0;
    nextNoteTime = audio.currentTime + 0.1;
    const t2 = audio.currentTime;
    musicGain.gain.cancelScheduledValues(t2);
    musicGain.gain.setValueAtTime(0.0001, t2);
    musicGain.gain.linearRampToValueAtTime(1, t2 + 1.5);
  }, 650);
}
function startMusic() {

  clearInterval(musicTimer);
  musicTimer = setInterval(scheduleMusic, 100);

}

function setAmbience(type) {
  pendingAmb = type;

  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = noiseBuf; src.loop = true;
  if (type === 'wind') { f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.7; }
  if (type === 'falls') { f.type = 'lowpass'; f.frequency.value = 900; }
  if (type === 'marsh') { f.type = 'lowpass'; f.frequency.value = 260; }
  if (type === 'rain') { f.type = 'highpass'; f.frequency.value = 1800; }
  g.gain.value = 0.0001;

// =====================================================================
// Camera: gentle focus zoom plus bouncing zoom ripples of varying size
// =====================================================================
const ZP = {          // amount, duration, bounces
  tap:    [0.015, 0.25, 1],
  hit:    [0.035, 0.35, 2],
  hurt:   [0.05, 0.45, 2],
  parry:  [0.07, 0.55, 3],
  kill:   [0.09, 0.8, 3],
  pickup: [0.05, 0.6, 2],
  land:   [0.12, 0.9, 4],
  boss:   [0.15, 1.5, 5],
  title:  [0.05, 1.1, 2],
};
function zoomPulse(x, y, preset) { const [a, d, b] = ZP[preset]; state.cam.pulses.push({ x, y, a, d, b, t: 0 }); }
function updateCam(dt) {
  const c = state.cam;
  let add = 0, wx = 0, wy = 0, ws = 0;
  for (let i = c.pulses.length - 1; i >= 0; i--) {
    const p = c.pulses[i]; p.t += dt;
    const k = p.t / p.d;
    if (k >= 1) { c.pulses.splice(i, 1); continue; }
    const v = p.a * (1 - k) * (1 - k) * Math.abs(Math.sin(Math.PI * p.b * k));
    add += v; wx += p.x * v; wy += p.y * v; ws += v;
  }
  const f = c.focus;
  const tz = f ? f.z : 1;
  const [tx, ty] = f ? f.at() : [W / 2, H / 2];
  const k = 1 - Math.exp(-(f ? 5 : 3) * dt);
  c.z += (tz - c.z) * k; c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
  c.ez = Math.max(1, c.z + add);
  const m = Math.min(1, ws * 5);
  c.ex = ws ? c.x + (wx / ws - c.x) * m : c.x;
  c.ey = ws ? c.y + (wy / ws - c.y) * m : c.y;
  const hw = W / (2 * c.ez), hh = H / (2 * c.ez);
  c.ex = Math.max(hw, Math.min(W - hw, c.ex));
  c.ey = Math.max(hh, Math.min(H - hh, c.ey));
}
const toScreen = (x, y) => [(x - state.cam.ex) * state.cam.ez + W / 2, (y - state.cam.ey) * state.cam.ez + H / 2];

// =====================================================================
// Floating text, anchored near whatever it talks about
// =====================================================================
// Minimal text: tips never appear in the world (they scroll along the bottom of the menu instead),
// "F to do something" prompts shrink to a key badge, and while someone is talking, hints and titles wait.
const SPEECH = new Set(['pip', 'npc']);
function rememberTip(text) { const p = state.tipPool || (state.tipPool = []); if (!p.includes(text)) p.push(text); }
function promptKey(text) {
  for (const k of Object.values(K).filter(Boolean).sort((a, b) => b.length - a.length)) if (text.startsWith(k + ' to ') || text.startsWith(k + ' now to ')) return k;
  return null;
}
function speakingNow() { return !!state.npcTalk || state.texts.some(t => SPEECH.has(t.key) && t.t < t.life - 0.3); }
function say(text, x, y, opts = {}) {
  if (opts.tip) { rememberTip(text); return; }
  const badge = promptKey(text);
  if (badge) { rememberTip(text); return; }          // "F to ..." prompts are replaced by the shine and label
  if (opts.key) {                                 // same message still showing: keep it, don't restart it
    const o = state.texts.find(o => o.key === opts.key && o.text === text);
    if (o) { o.x = x; o.y = y; o.life = Math.max(o.life, o.t + (opts.life || 3.2) * 0.5); return; }
  }
  const t = { text, x, y, t: 0, life: opts.life || 3.2, key: opts.key || null, follow: x == null, size: opts.size || 1, color: opts.color || '#fdf6e3', badge, hint: !opts.color && !SPEECH.has(opts.key) && !badge };
  if (t.key) state.texts = state.texts.filter(o => o.key !== t.key);
  if (t.follow) state.texts = state.texts.filter(o => !o.follow);
  // the same words from somewhere else just refresh; too many at once drops the oldest non-reading one
  const dup = state.texts.find(o => o.text === text);
  if (dup) { dup.life = Math.max(dup.life, dup.t + t.life); return; }
  state.texts.push(t);
  while (state.texts.length > 6) state.texts.splice(state.texts.findIndex(o => o.text.length <= 110), 1);

function unsay(key) { state.texts = state.texts.filter(o => o.key !== key); }

  const t = { text, sub, style, t: 0, life, at: state.time };
  if (speakingNow()) { (state.titleQ = state.titleQ || []).push(t); return; }   // wait until nobody is talking
  state.title = t;
}

// Scenes: entering, leaving, geometry

const sceneDef = () => WORLD[state.scene];

function refreshSceneGeometry() {
  const sc = sceneDef();
  if (!sc) return;
  const rt = rtFor(sc.id);
  const F = { cavewall: 0.95, boulder: 0.95, pillar: 0.95, stalagmite: 0.8, shroom: 0.7, stone: 1, log: 1, wall: 1, bed: 1, table: 1, stove: 1, cliff: 1, cairn: 1, mirror: 1, stump: 1, campfire: 1, tent: 0.9, bramble: 1, reeds: 1, web: 1, vine: 1 };
  state.solids = sc.solids.filter(s => !(s.bar && rt.flags[s.bar]) && !(s.showFlag && !rt.flags[s.showFlag]) && !(s.plate && state.plateOn[s.plate])).map((s, i) => ({ ...s, x: s.fx * W, y: s.fy * H, r: s.r * UNIT * (F[s.kind] || 0.45), vis: s.r * UNIT, key: sc.id + ':' + sc.solids.indexOf(s) }));
  state.pools = sc.pools.map(p => ({ x: p.fx * W, y: p.fy * H, r: p.r * UNIT }));
  for (const e of state.enemies) if (e.poolIdx != null) e.pool = state.pools[e.poolIdx];
}
function breakBarrier(bar, how) {

  if (bar === 'cocoon') burstDarkShroom();
  if (bar === 'thicket') { setMusic('forest'); const s0 = sceneDef().solids.find(s => s.bar === bar); for (let i = 0; i < 2; i++) state.items.push({ type: 'thornseed', x: s0.fx * W - UNIT * (1 + i), y: s0.fy * H + UNIT * (2 + i) }); }
  for (const s of state.solids) if (s.bar === bar) spark(s.x, s.y, how === 'fire' ? '#ff9a3a' : s.kind === 'web' ? '#dcdcd0' : '#6a4a2a', 6, 3);
  refreshSceneGeometry();
  state.shake = 0.3;
  sfx.crash();
  const s0 = sceneDef().solids.find(s => s.bar === bar);
  if (s0) zoomPulse(s0.fx * W, s0.fy * H, 'kill');
}

function saveScene() {

function enterScene(id, fx, fy) {

// arriving at a screen edge: slide along it to the nearest spot not blocked by rocks or trees
function nudgeFree() {
  const h = state.hero, horiz = h.y < UNIT * 2 || h.y > H - UNIT * 2;
  const blocked = (x, y) => state.solids.some(s => Math.hypot(s.x - x, s.y - y) < s.r + UNIT * 0.5) || isChasm(x, y);
  if (!blocked(h.x, h.y)) return;
  for (let d = UNIT * 0.4; d < Math.max(W, H); d += UNIT * 0.4) for (const sgn of [1, -1]) {
    const x = horiz ? h.x + d * sgn : h.x, y = horiz ? h.y : h.y + d * sgn;
    if (x > UNIT * 0.5 && x < W - UNIT * 0.5 && y > UNIT * 0.5 && y < H - UNIT * 0.5 && !blocked(x, y)) { h.x = x; h.y = y; state.entry.fx = x / W; state.entry.fy = y / H; h.safe = [x / W, y / H]; return; }
  }
}
function transitionTo(id, fx, fy, quick) {

    nudgeFree();
    state.fadeTarget = 0;
    setTimeout(() => { state.busy = false; }, quick ? 150 : 500);

function checkEdges() {
  const sc = sceneDef(), h = state.hero, r = UNIT * 0.5 + 8;

    if (ex.side === 'e') { at = h.x >= W - r && held.right(); along = h.y / H; }
    if (!at) continue;
    if (ex.locked && ex.locked()) return;
    if (Array.isArray(ex.arrive)) { transitionTo(ex.to, ex.arrive[0], ex.arrive[1], true); return; }   // doors put you back at the door

      transitionTo(ex.to, s[0] - 2.2 * UNIT / W, s[1], true);
      if (ex.say) setTimeout(() => say(ex.say, state.hero.x, state.hero.y - UNIT, { key: 'climb', life: 2.5 }), 0);
      return;
    }

// =====================================================================
// Update
// =====================================================================
function update(dt) {

  state.blind = Math.max(0, state.blind - dt);
  updateCam(dt);
  updateTexts(dt);
  if (!state.started) return;
  readPresses();
  if (state.menu) { updateMenu(); return; }
  if (state.choice) { updateChoice(); return; }
  if (state.rapids) { updateFx(dt); updateRapids(dt); if (PUZZLE) updatePuzzle(dt); return; }
  updateFx(dt);
  state.playTime += dt;
  const sc = sceneDef(), h = state.hero, inv = state.inv;

// landing just short of a stone counts: you catch its edge
function catchStone(h, sc) {

// ---------------- wind: a schedule of gusts the windsock announces ----------------
const gustVec = () => { const g = sceneDef().gusts[state.gustIdx]; return [Math.sin(g.a), Math.cos(g.a)]; };   // every gust the same strength
function updateWind(dt, sc) {
  state.gustT += dt;
  const SEQ = ['lull', 'gentle', 'lull', 'gentle', 'lull', 'blow'], T = { lull: 1.3, gentle: 1.1, blow: 1.8 };
  if (state.gustT > T[state.gustPhase]) {
    state.gustT = 0;
    state.gustStep = ((state.gustStep || 0) + 1) % SEQ.length;
    state.gustPhase = SEQ[state.gustStep];
    if (state.gustStep === 1) state.gustIdx = (state.gustIdx + 1) % sc.gusts.length;   // a new series, maybe a new direction
    if (state.gustPhase === 'gentle') sfx.whoosh();
    if (state.gustPhase === 'blow') { sfx.whoosh(); sfx.whoosh(); state.shake = Math.max(state.shake, 0.12); }
  }
  const target = state.gustPhase === 'blow' ? 1 : state.gustPhase === 'gentle' ? 0.4 : 0.08;
  state.gust += (target - state.gust) * (1 - Math.exp(-4 * dt));
  const g = sc.gusts[state.gustIdx];
  ambLevel(0.04 + state.gust * g.s * 0.2, 380 + state.gust * g.s * 800);
  const [wx, wy] = gustVec(), mag = Math.hypot(wx, wy) || 1;
  const n = state.gust * 4 * g.s;
  for (let i = 0; i < n; i++) if (Math.random() < 0.5) {
    // streaks start on the upwind side, whichever way the gust blows
    const up = wy < 0 ? H * (0.7 + Math.random() * 0.3) + UNIT * 2 : Math.random() * H * 0.3 - UNIT * 2;
    state.fx.push({ x: Math.random() * W - wx / mag * UNIT * 3, y: up, vx: wx / mag * L() * (0.5 + state.gust), vy: wy / mag * L() * (0.5 + state.gust), t: 0, life: 2.5, color: 'streak', size: UNIT * (0.8 + state.gust * 1.6) });
  }
  if (Math.random() < 0.05 + state.gust * 0.3) state.fx.push({ x: Math.random() * W, y: wy < 0 ? H + 10 : -10, vx: wx / mag * L() * 0.3, vy: wy / mag * L() * 0.3 + (wy < 0 ? -UNIT : UNIT), t: 0, life: 4, color: 'leaf', spin: Math.random() * 6 });
  for (const c of state.clouds) { c.x += L() * 0.02 * dt * wx / mag; c.y += L() * 0.02 * dt * wy / mag; if (c.x > W + c.r) c.x = -c.r; if (c.x < -c.r) c.x = W + c.r; if (c.y > H + c.r) c.y = -c.r; if (c.y < -c.r) c.y = H + c.r; }
}

// =====================================================================
// Pulling things free: hold F, rock left/right, pull up
// =====================================================================
const PULL = {
  rock: {
    approach: () => `A big rock, half sunk in soft earth. Hold ${K.act} to grab it`,
    fails: () => [`It's sunk deep in the mud. Keep holding ${K.act} and rock it ${K.l} ${K.r}`, `Pulling straight won't work. Hold on and rock it ${K.l} ${K.r}`],
    rock: ['It shifts.', 'Mud sucks at it.', 'Almost...', `Loose! Now pull ${K.u}`],
    notYet: () => `Not yet. Rock it more ${K.l} ${K.r}`,
  },
  sword: {
    approach: () => `A rusted sword, stuck fast in an old stump. ${K.act} to grab`,
    fails: () => ['You pull with everything you have. It won\'t budge.', 'The rust has welded blade to wood.', 'Your hands slip on the rust.', 'Like that rock, only much worse.'],
    rock: ['It creaks.', 'It creaks.', 'Flakes of rust fall away.', 'Flakes of rust fall away.', 'The wood groans and gives.', 'It\'s loose. Now pull.'],
    notYet: () => 'Not yet. It needs more working.',
  },
};
function updatePull(dt) {
  const sc = sceneDef(), rt = rtFor(sc.id), h = state.hero;
  let near = null;
  if (!state.carry) for (const pl of sc.pullables) {
    if (rt.pulled.has(pl.id)) continue;
    if (Math.hypot(h.x - pl.fx * W, h.y - pl.fy * H) < UNIT * 1.7) near = pl;
  }
  let p = state.pull;
  p.tilt += (p.lastSide * Math.min(1, p.wiggle / (near ? near.need : 6)) * 0.35 - p.tilt) * (1 - Math.exp(-8 * dt));
  if (!near) {
    p.grip = false;
    p.wiggle = Math.max(0, p.wiggle - dt * 0.4);
    if (p.hinted) { p.hinted = false; unsay('pull'); }
    return;
  }
  if (p.id !== near.id) p = state.pull = newPull(near.id);
  const x = near.fx * W, y = near.fy * H, T = PULL[near.kind];
  const tell = (s, tip) => say(s, x, y - UNIT * 1.3, { key: 'pull', life: 3.5, tip });
  if (!p.grip && !p.hinted) { p.hinted = true; tell(T.approach(), 'pull-' + near.kind); }
  if (pressedNow.act && !p.grip) {
    p.grip = true; sfx.strain();
    const f = T.fails();
    if (p.wiggle >= near.need) tell(`It's loose. Pull ${K.u}`);
    else tell(f[Math.min(p.tries++, f.length - 1)]);
    return;
  }
  if (p.grip && !held.act()) { p.grip = false; return; }
  if (!p.grip) return;
  if (pressedNow.left || pressedNow.right) {
    const side = pressedNow.left ? -1 : 1;
    if (side !== p.lastSide) {
      p.wiggle = Math.min(near.need, Math.floor(p.wiggle) + 1);
      p.lastSide = side;
      sfx.creak(side > 0);
      tell(T.rock[Math.min(T.rock.length - 1, Math.max(0, Math.round(p.wiggle / near.need * T.rock.length) - 1))]);
      state.shake = 0.08;
      zoomPulse(x, y, 'tap');
    } else tell('It\'s already leaning that way.');
  }
  if (pressedNow.up) {
    if (p.wiggle >= near.need) freePullable(near, x, y);
    else { sfx.strain(); const f = T.fails(); tell(p.wiggle > 0 ? T.notYet() : f[Math.min(p.tries++, f.length - 1)]); }
  }
  if (pressedNow.down) tell('You brace your feet.');
}
function freePullable(pl, x, y) {
  rtFor(state.scene).pulled.add(pl.id);
  state.pull = newPull(null);
  unsay('pull');
  if (pl.kind === 'rock') {
    sfx.lift(); zoomPulse(x, y, 'pickup'); spark(x, y, '#6a4a2a', 12, 3);
    state.carry = 'rock'; state.carryT = state.time; refreshButtons();
    say(`Heavy! It takes both hands. Tap ${K.act} to set it down ahead of you, or hold ${K.act} to aim and let go to throw.`, x, y - UNIT * 1.6, { key: 'pull', life: 5, tip: 'throw-rock' });
  } else startSwordCut();
}

function hurtHero(dmg, fromX, fromY, opts = {}) {
  const h = state.hero;
  if (!opts.force && (h.invuln > 0 || h.ride || state.cut)) return false;
  if (state.whirl) endWhirl('hit');
  h.vig -= dmg * 2 * (1 - 0.15 * state.inv.up.guard) * frailty(); h.rest = state.time + 0.8; h.hurtT = state.time;
  if (h.vig > 0 && h.vig <= 1) say('Exhausted...', h.x, h.y - UNIT * 1.2, { key: 'tired', life: 1.5, color: '#ffb080' });
  h.invuln = 1.2;
  sfx.hit();
  state.shake = 0.35;
  zoomPulse(h.x, h.y, 'hurt');
  state.hold.on = false; state.hold.charged = false; state.pull.grip = false;
  if (state.carry === 'rock') dropRock();
  if (!opts.noKnock) {
    const e = state.entry;
    let ax = h.x - fromX, ay = h.y - fromY; const al = Math.hypot(ax, ay) || 1;
    let bx = e.fx * W - h.x, by = e.fy * H - h.y; const bl = Math.hypot(bx, by) || 1;
    let kx = ax / al + 0.6 * bx / bl, ky = ay / al + 0.6 * by / bl; const kl = Math.hypot(kx, ky) || 1;
    h.vx = kx / kl * 0.9 * L(); h.vy = ky / kl * 0.9 * L(); h.stun = 0.5;
  }
  if (h.vig <= 0) {
    h.vig = 0;
    state.cut = { type: 'faint', t: 0 };
    state.fadeTarget = 1; state.fadeRate = 3;
    sfx.death();
  }
  return true;
}

    case 'rod': inv.rod = true; showTitle('Old Wick\'s fishing rod', `stand by a ripple and press ${K.act} to cast`, 'relic', 3.5); break;
    case 'fish': inv.food.push('fish'); tell(`A gleaming fish! ${K.eat} to eat: vigor now, and more of it for a while.`, 4, 'fish'); break;
    case 'recipe_temper': learnRecipe('temper', 'A smith\'s scrap, half eaten by damp.'); break;

    case 'spore': inv.spores++; if (inv.pipSaved) say(`+1 spore (${inv.spores})`, h.x, h.y - UNIT * 1.1, { key: 'spore', life: 1.2, color: '#e8d8ff' }); break;

// =====================================================================
// Combat. Tap F = slash (also blocks). Hold and release = stab, which lunges.
// Chain: stab, slash while lunging, then stab again in time, and the next
// stab lunges farther, hits harder, and bowls small things over. Chains to x3.
// =====================================================================
const SLASH = { dur: 0.22, cool: 0.22, reach: 1.7 };
const STAB  = { dur: 0.22, cool: 0.1, reach: 2.2, charge: 0.35, chainCharge: 0.18, knockChance: 0.6 };
const COMBO = { slashWindow: 0.7, stabWindow: 0.9 };
const SMALL = ['rabbit', 'glowworm', 'gremlin', 'diver', 'lurker', 'stalker'];

function updateCombat(dt) {
  const inv = state.inv, h = state.hero;
  // in the air, act slams down: sword or no sword, spinning or not (not when spent)
  if (pressedNow.act && h.z > UNIT * 0.3 && !state.slam && !state.carry && !h.ride && h.vig >= 0.8) {
    state.slam = true; h.vz = -UNIT * 16;
    if (state.whirl) { state.whirl = null; bumpCrazy('Spin dive'); }
    sfx.swoosh(); return;
  }
  if (!inv.sword || state.pull.grip || h.ride || state.carry) return;
  if (state.equip === 'acorn' && inv.acorns > 0) return;          // acorns in hand: F throws instead
  const hold = state.hold, cb = state.combo;
  state.atkCool -= dt;
  const nearPullable = sceneDef().pullables.some(p => !rtFor(state.scene).pulled.has(p.id) && Math.hypot(h.x - p.fx * W, h.y - p.fy * H) < UNIT * 1.7);
  if (nearPullable) return;
  if (state.slam) return;
  if (state.whirl) { updateWhirl(dt); return; }
  if (pressedNow.act) { hold.on = true; hold.t = 0; hold.charged = false; state.slashBuf = state.time; }
  // presses a hair early (mid-stab) are buffered, so you can slash right out of a lunge
  if (state.time - (state.slashBuf ?? -9) < 0.25) {
    if (state.time < (state.poundChain || 0)) {             // strike right after a pound's spin: straight into a whirlwind
      state.slashBuf = -9; state.poundChain = 0; state.chain.n = 0;
      bumpCrazy('Whirlwind'); startWhirl(); return;
    }
    if (state.atkCool <= 0) {
      state.slashBuf = -9;
      const chained = cb.step === 'stab' && state.time - cb.t < COMBO.slashWindow;
      if (chained) { cb.step = 'slash'; cb.t = state.time; } else { cb.step = null; cb.level = 0; }
      // slashes in rhythm (not too quick, not too slow) swing wider each time, closing toward a full circle;
      // the seventh becomes a spin
      const ch = state.chain, gap = state.time - ch.t;
      ch.n = gap >= WHIRL.min && gap <= WHIRL.max ? ch.n + 1 : 1;
      ch.t = state.time;
      if (ch.n >= WHIRL.chain) {
        ch.n = 0;
        if (h.vig >= 3) { startWhirl(); return; }
        say('Too tired to spin', h.x, h.y - UNIT * 1.2, { key: 'tired', life: 1.2, color: '#ffb080' });
      }
      if (ch.n >= 2) say('\u2022 '.repeat(ch.n).trim(), h.x, h.y - UNIT * 1.2, { key: 'chain', life: 0.55, color: ch.n >= 5 ? '#ffb347' : '#ffe38a' });
      const k = (ch.n - 1) / (WHIRL.chain - 1);
      state.active = 'sword';
      const slow = sluggish();                               // a tired arm swings slowly
      state.atk = { type: 'slash', t: 0, dur: SLASH.dur * (1 + k * 0.6) * slow, hit: new Set(), ax: h.fx, ay: h.fy, level: chained ? cb.level : 0, sweep: 1.25 + (Math.PI - 1.25) * k, n: ch.n };
      state.atkCool = SLASH.cool * slow;
      if (slow > 1.8) say('Your arm is heavy...', h.x, h.y - UNIT * 1.2, { key: 'tired', tip: 'tiredswing', life: 1.5, color: '#ffb080' });
      sfx.swoosh();
      if (state.bird) scareBird(h.x, h.y, 5);
      scareFlock(h.x, h.y, 5);
      shakeTrees(h, 1);
      cutVines(h);
    }
  }
  if (hold.on) {
    if (held.act()) {
      hold.t += dt;
      const need = (cb.step === 'slash' ? STAB.chainCharge : STAB.charge) * sluggish();
      if (!hold.charged && hold.t > need) { hold.charged = true; sfx.charge(); }
    } else {
      if (hold.charged && spend(0.6)) {
        const chained = cb.step === 'slash' && state.time - cb.t < COMBO.stabWindow;
        cb.level = chained ? Math.min(3, cb.level + 1) : 0;
        cb.step = 'stab'; cb.t = state.time;
        state.active = 'sword';
        state.atk = { type: 'stab', t: 0, dur: STAB.dur + cb.level * 0.04, hit: new Set(), ax: h.fx, ay: h.fy, level: cb.level };
        state.atkCool = STAB.cool;
        h.dashT = 0.12 + cb.level * 0.05;                 // the lunge; you can slash out of it
        h.vx = h.fx * (0.75 + cb.level * 0.3) * L(); h.vy = h.fy * (0.75 + cb.level * 0.3) * L();
        if (cb.level) { sfx.flipStrike(); zoomPulse(h.x, h.y, cb.level >= 3 ? 'kill' : 'parry'); say('x' + (cb.level + 1), h.x, h.y - UNIT * 1.2, { key: 'combo', life: 0.9, color: '#ffe38a', size: 1 + cb.level * 0.2 }); }
        else sfx.stab();
        say('Stab, then slash while you lunge, then stab again: each chained stab goes farther.', h.x, h.y - UNIT * 1.6, { key: 'combotip', tip: 'combo', life: 5 });
      }
      hold.on = false; hold.charged = false;
    }
  }
  const a = state.atk;
  if (!a) return;
  a.t += dt;
  for (const e of state.enemies) {
    if (a.hit.has(e) || !hittable(e)) continue;
    const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
    let hit;
    if (a.type === 'slash') {
      const sw = a.sweep || 1.25, reach = UNIT * SLASH.reach * (1 + ((a.n || 1) - 1) * 0.04);
      const ang = Math.acos(Math.max(-1, Math.min(1, (dx * a.ax + dy * a.ay) / d)));
      hit = d < reach + e.r && (ang <= sw + 0.15 || d < e.r + UNIT * 0.6);
    }
    else {
      const along = dx * a.ax + dy * a.ay, perp = Math.abs(dx * a.ay - dy * a.ax);
      hit = along > -e.r && along < UNIT * (STAB.reach + (inv.horn >= 3 ? 0.5 : 0)) + e.r && perp < e.r + UNIT * 0.35;
    }
    if (hit) {
      a.hit.add(e);
      let dmg = a.type === 'slash' ? 1 + inv.up.edge * 0.5 : 2 + inv.up.temper * 0.5;
      if (a.type === 'stab' && inv.horn) dmg += 1;
      if (a.type === 'stab' && a.level) dmg *= 1 + a.level * (inv.horn >= 2 ? 0.45 : 0.3);
      if (inv.slime > 0) dmg += 1;
      dmg *= power();
      damage(e, dmg, a.type, dx / d, dy / d, a.type === 'stab' && a.level > 0 && SMALL.includes(e.type));
    }
  }
  if (a.t >= a.dur) state.atk = null;
}
// ---------------- whirlwind: keep it spinning by striking on the beat ----------------
const WHIRL = { chain: 7, min: 0.26, max: 0.62, length: 3, first: 0.62, window: 0.13, shrink: 0.88, fastest: 0.26, bonus: 0.5 };
function startWhirl() {
  const h = state.hero;
  state.atk = null; state.hold.on = false; state.hold.charged = false;
  spend(1.5);
  state.whirl = { t: 0, end: state.time + WHIRL.length, ang: Math.atan2(h.fy, h.fx), beat: WHIRL.first, next: state.time + WHIRL.first, streak: 0, hit: new Set(), lastRev: 0 };
  sfx.spin(); zoomPulse(h.x, h.y, 'kill'); state.shake = 0.2; cutVines(h);
  say('Whirlwind!', h.x, h.y - UNIT * 1.4, { key: 'combo', life: 1, color: '#ffe38a', size: 1.4 });
  say(`It spins for 3 seconds. Strike ${K.act} as the ring closes to spin faster and longer. Jump to glide.`, h.x, h.y + UNIT * 2, { key: 'whirltip', tip: 'whirl', life: 5 });
}
function endWhirl(why) {
  const w = state.whirl, h = state.hero;
  if (!w) return;
  state.whirl = null;
  if (why === 'done') { h.stun = 0.3; sfx.dizzy(); say('Whew.', h.x, h.y - UNIT * 1.2, { key: 'combo', life: 0.8 }); }
  if (why === 'knocked' || why === 'flash') { h.stun = 0.35; state.shake = 0.3; sfx.crash(); say(why === 'flash' ? 'The flash breaks your spin!' : 'Knocked out of your spin!', h.x, h.y - UNIT * 1.2, { key: 'combo', life: 1.2 }); }
}
function updateWhirl(dt) {
  const w = state.whirl, h = state.hero, inv = state.inv;
  const win = WHIRL.window + (inv.up.star ? 0.05 : 0);
  w.t += dt;
  w.ang += (Math.PI * 2 / Math.max(WHIRL.fastest, w.beat)) * 1.5 * dt;
  if (w.ang - w.lastRev > Math.PI * 2) { w.lastRev = w.ang; w.hit.clear(); }
  if (state.time >= w.end) { endWhirl('done'); return; }
  if (state.time > w.next + win) w.next += w.beat;       // missing a beat just means no bonus
  if (pressedNow.act && Math.abs(state.time - w.next) <= win) {
    {
      w.streak++;
      if (!spend(0.35)) { endWhirl('done'); return; }
      w.end += WHIRL.bonus;
      w.beat = Math.max(WHIRL.fastest, w.beat * WHIRL.shrink);
      w.next = state.time + w.beat;
      cutVines(h); sfx.whirlUp(w.streak); zoomPulse(h.x, h.y, w.streak % 4 ? 'tap' : 'parry');
      say('x' + (w.streak + 1), h.x, h.y - UNIT * 1.3, { key: 'combo', life: 0.6, color: '#ffe38a', size: 1 + Math.min(0.8, w.streak * 0.08) });
    }
  }
  const reach = UNIT * (1.9 + Math.min(0.8, w.streak * 0.06));
  for (const e of state.enemies) {
    if (w.hit.has(e) || !hittable(e)) continue;
    const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
    if (d > reach + e.r) continue;
    w.hit.add(e);
    damage(e, ((1.2 + inv.up.edge * 0.5) * (1 + w.streak * 0.1) * power() + (inv.slime > 0 ? 1 : 0)) * crazyMult(), 'slash', dx / d, dy / d, true);   // everything gets thrown back
  }
  if (Math.random() < 0.5) state.fx.push({ x: h.x + Math.cos(w.ang) * reach * 0.8, y: h.y + Math.sin(w.ang) * reach * 0.6, vx: 0, vy: 0, t: 0, life: 0.25, color: 'rgba(255,245,210,.7)', size: UNIT * 0.2 });
  if (state.bird) scareBird(h.x, h.y, 5);
  scareFlock(h.x, h.y, 5);
}
// ---------------- the crazy combo: whirl, jump, glide, pound, spin, whirl again ----------------
function bumpCrazy(label) {
  const c = state.crazy || (state.crazy = { n: 0, t: -9 }), h = state.hero;
  c.n = state.time - c.t < 2.5 ? c.n + 1 : 1; c.t = state.time;
  if (c.n >= 2) say(`${label}! x${c.n}`, h.x, h.y - UNIT * 1.6, { key: 'crazy', life: 1.1, color: c.n >= 5 ? '#ffb347' : '#ffe38a', size: 1 + Math.min(0.8, c.n * 0.1) });
}
const crazyMult = () => { const c = state.crazy; return c && state.time - c.t < 2.5 ? 1 + Math.min(1, c.n * 0.12) : 1; };
function slamDown() {
  const h = state.hero, inv = state.inv, armed = inv.sword;
  state.slam = false;
  sfx.slam(); state.shake = 0.45; zoomPulse(h.x, h.y, 'kill');
  spark(h.x, h.y + UNIT * 0.3, '#9a8a6a', 16, 4);
  state.fx.push({ x: h.x, y: h.y + UNIT * 0.3, vx: 0, vy: 0, t: 0, life: 0.45, color: 'shock', size: UNIT * (armed ? 2.6 : 2) });
  spend(0.8);
  bumpCrazy('Pound');
  for (const e of state.enemies) {
    if (!hittable(e)) continue;
    const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy) || 1;
    if (d > UNIT * (armed ? 2.4 : 2) + e.r) continue;
    const swordDmg = 2 + (inv.horn ? 1 : 0) + (inv.slime > 0 ? 1 : 0);
    const dmg = armed ? swordDmg : swordDmg / 2;                                 // bare-handed: half the sword's
    damage(e, dmg * power() * crazyMult(), 'stab', dx / d, dy / d, true);
  }
  if (armed) {
    // the sword sweeps a full circle as you land; strike again right away to whirl
    state.atk = { type: 'slash', t: 0, dur: 0.3, hit: new Set(), ax: h.fx, ay: h.fy, level: 0, sweep: Math.PI, n: 7 };
    state.atkCool = 0.15; state.poundChain = state.time + 0.6; state.active = 'sword';
    sfx.spin();
    say(`${K.act} now to spin into a whirlwind`, h.x, h.y + UNIT * 1.8, { key: 'pcombo', tip: 'poundchain', life: 3 });
  }
  if (state.bird) scareBird(h.x, h.y, 6);
  scareFlock(h.x, h.y, 6);

// vines give way to a few good cuts
function cutVines(h) {

    if (s.kind !== 'vine' || Math.hypot(s.x - h.x, s.y - h.y) > UNIT * SLASH.reach + s.r) continue;
    const k = 'cut_' + s.bar;
    rt.flags[k] = (rt.flags[k] || 0) + 1;
    spark(s.x, s.y, '#4a8a3a', 5, 2); sfx.rustle();
    if (rt.flags[k] >= 4) breakBarrier(s.bar, 'cut');

}
function shakeTreesAround(h, radius) {
  let any = false;
  for (const s of state.solids) {
    if (s.kind !== 'tree' || Math.hypot(s.x - h.x, s.y - h.y) > radius + s.r) continue;
    state.treeShake[s.key] = state.time; any = true;
    dropAcorn(s);
  }
  if (any) sfx.rustle();
}
function dropAcorn(s) {
  if ((state.treeCool[s.key] || 0) >= state.playTime || rng() >= 0.7) return;
  state.treeCool[s.key] = state.playTime + 10;
  const a = Math.random() * 6.28;
  state.items.push({ type: 'acorn', x: s.x + Math.cos(a) * (s.r + UNIT * 0.6), y: s.y + UNIT * 0.4 + Math.abs(Math.sin(a)) * UNIT * 0.4 });
  spark(s.x, s.y - UNIT, '#3c7a3a', 6, 2);
}
// slashing a tree shakes it; sometimes an acorn falls
function shakeTrees(h, reachK) {
  for (const s of state.solids) {
    if (s.kind !== 'tree') continue;
    const dx = s.x - h.x, dy = s.y - h.y, d = Math.hypot(dx, dy) || 1;
    if (d > UNIT * SLASH.reach * reachK + s.r || (dx * h.fx + dy * h.fy) / d < 0.1) continue;

}
const slashActive = () => state.atk && state.atk.type === 'slash' && state.atk.t < state.atk.dur;

// =====================================================================
// Enemies
// =====================================================================
function makeEnemy(type, x, y, idx, poolIdx) {
  const b = { type, idx, x, y, vx: 0, vy: 0, t: 0, cool: 0, lx: 0, ly: 0, flash: 0, dead: false, hgt: 0, poolIdx: poolIdx == null ? null : poolIdx };
  const u = UNIT;
  switch (type) {
    case 'stalker':  return { ...b, r: u * 0.7, hp: 4, dmg: 1, mode: 'sleep', t: rr(1.5, 2.5) };
    case 'charger':  return { ...b, r: u * 0.75, hp: 5, dmg: 2, mode: 'sleep', t: 1.5 };
    case 'diver':    return { ...b, r: u * 0.55, hp: 3, dmg: 1, mode: 'ceiling', t: rr(1.5, 3.5), hgt: 1 };
    case 'glowworm': return { ...b, r: u * 0.4, hp: 1, dmg: 1, mode: 'crawl', t: 0, seg: Math.random() * 6, flashCool: rr(1, 3) };
    case 'rabbit':     return { ...b, r: u * 0.45, hp: 2, dmg: 1, mode: 'idle', t: rr(0.3, 1) };
    case 'gremlin':  return { ...b, r: u * 0.42, hp: 2, dmg: 1, mode: 'idle', t: rr(0.3, 1), fast: 1.25 };
    case 'thief':    return { ...b, r: u * 0.45, hp: 6, dmg: 1, mode: 'taunt', t: 1, fast: 1.45 };
    case 'lurker':   return { ...b, r: u * 0.55, hp: 3, dmg: 1, mode: 'submerged', t: 0, cool: rr(0.5, 2) };
    case 'warden':   return { ...b, r: u * 1.3, hp: 18, maxHp: 18, dmg: 2, mode: 'dormant', t: 0 };
  }
}
function hittable(e) {
  if (e.dead) return false;
  if (e.type === 'thief') return !!e.cornered;
  if (e.type === 'diver') return ['floor', 'stunned', 'ascend'].includes(e.mode);
  if (e.type === 'lurker') return ['bite', 'risen', 'stunned'].includes(e.mode);
  if (e.type === 'warden') return !['dormant', 'intro', 'talk'].includes(e.mode);

}
function resumeMode(e) {

}
function spark(x, y, color, n, speed) {

    state.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.35 + Math.random() * 0.25, color });
  }
}
function updateFx(dt) {
  for (let i = state.fx.length - 1; i >= 0; i--) {
    const p = state.fx[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.color !== 'streak' && p.color !== 'leaf') { p.vx *= 0.9; p.vy *= 0.9; }
    if (p.t > p.life) state.fx.splice(i, 1);

function damage(e, amount, kind, nx, ny, bowl) {
  e.hp -= amount; e.hitT = state.time;
