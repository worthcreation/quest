<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest</title>
<style>
  :root { --grass: #3f8f4c; --hero: #f5d06f; --goal: #6fc3f5; --ink: #fdf6e3; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--grass); color: var(--ink); font-family: "Courier New", monospace; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #msg { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-size: 1.05rem; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events: none; }
  #sound { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: rgba(0,0,0,.35); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: .95rem; }
  #pad { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; opacity: .85; }
  #pad button { font-size: 1.3rem; background: rgba(0,0,0,.35); color: var(--ink); border: 0; border-radius: 8px; touch-action: none; }
  #pad button:active { background: rgba(0,0,0,.6); }
  @media (pointer: fine) and (min-width: 900px) { #pad { display: none; } }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); font-size: 1.4rem; letter-spacing: 2px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="msg">Reach the blue stone</div>
<button id="sound">sound: on</button>
<div id="pad">
  <span></span><button data-dir="up">&#9650;</button><span></span>
  <button data-dir="left">&#9664;</button><span></span><button data-dir="right">&#9654;</button>
  <span></span><button data-dir="down">&#9660;</button><span></span>
</div>
<div id="start">tap to begin</div>

<script>
// ---------- Canvas that fills the screen ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
let W = 0, H = 0, UNIT = 32;   // UNIT = size of one "tile" in CSS px, scales with screen

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  UNIT = Math.max(20, Math.min(W, H) / 14);
}
window.addEventListener('resize', resize);
resize();

// ---------- State (positions stored as 0..1 fractions of the screen) ----------
const state = {
  player: { fx: 0.08, fy: 0.5, vx: 0, vy: 0 },
  goal:   { fx: 0.92, fy: 0.5 },
  speed: 0.55,          // screen-widths per second (relative to the longer side)
  accel: 10,            // how quickly velocity eases in/out
  won: false,
  started: false,
  keys: {},
  time: 0,
};

// ---------- Input ----------
window.addEventListener('keydown', e => {
  state.keys[e.key.toLowerCase()] = true;
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  if (e.key.toLowerCase() === 'r' && state.won) reset();
  begin();
});
window.addEventListener('keyup', e => { state.keys[e.key.toLowerCase()] = false; });

document.querySelectorAll('#pad button').forEach(b => {
  const map = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright' };
  const k = map[b.dataset.dir];
  b.addEventListener('pointerdown', e => { e.preventDefault(); state.keys[k] = true; begin(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { state.keys[k] = false; }));
});

function inputVector() {
  const k = state.keys;
  let x = 0, y = 0;
  if (k.arrowup || k.w) y -= 1;
  if (k.arrowdown || k.s) y += 1;
  if (k.arrowleft || k.a) x -= 1;
  if (k.arrowright || k.d) x += 1;
  const len = Math.hypot(x, y) || 1;
  return { x: x / len, y: y / len };
}

// ---------- Audio: all synthesized, no files ----------
let audio, master, musicOn = true, nextNoteTime = 0, noteIndex = 0, musicTimer = null;

function initAudio() {
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
  master = audio.createGain(); master.gain.value = 0.9; master.connect(audio.destination);
}

function tone(freq, start, dur, { type = 'triangle', vol = 0.12, attack = 0.03 } = {}) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  const t = audio.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

// Background music: a lilting 6/8 loop in G major pentatonic. Original tune.
// Each entry: [melody midi or 0 for rest, bass midi or 0], one entry per eighth note.
const BPM = 92;                          // dotted-quarter pulse feel
const EIGHTH = 60 / BPM / 2;             // seconds per eighth note
const TUNE = [
  [67,43],[71,0],[74,0], [79,50],[74,0],[71,0],
  [69,45],[71,0],[74,0], [76,0],[0,0],[74,0],
  [72,48],[74,0],[76,0], [79,52],[76,0],[74,0],
  [71,43],[69,0],[67,0], [69,0],[0,0],[0,0],
  [67,43],[71,0],[74,0], [79,50],[81,0],[79,0],
  [76,45],[74,0],[71,0], [74,0],[0,0],[76,0],
  [79,48],[78,0],[76,0], [74,52],[71,0],[69,0],
  [67,43],[0,0],[0,0],   [62,43],[0,0],[0,0],
];
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

function scheduleMusic() {
  if (!musicOn) return;
  while (nextNoteTime < audio.currentTime + 0.25) {
    const [mel, bass] = TUNE[noteIndex % TUNE.length];
    const start = nextNoteTime - audio.currentTime;
    if (mel)  tone(midiHz(mel),  start, EIGHTH * 1.6, { type: 'triangle', vol: 0.10, attack: 0.04 });
    if (mel)  tone(midiHz(mel) * 2, start, EIGHTH * 0.9, { type: 'sine', vol: 0.025, attack: 0.02 }); // soft octave shimmer
    if (bass) tone(midiHz(bass), start, EIGHTH * 3.2, { type: 'sine', vol: 0.14, attack: 0.06 });
    nextNoteTime += EIGHTH;
    noteIndex++;
  }
}
function startMusic() {
  initAudio();
  if (audio.state === 'suspended') audio.resume();
  nextNoteTime = audio.currentTime + 0.1;
  clearInterval(musicTimer);
  musicTimer = setInterval(scheduleMusic, 100);
}

function playVictory() {
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((f, i) => tone(f, i * 0.11, 0.18, { type: 'square', vol: 0.1, attack: 0.005 }));
  tone(1568, notes.length * 0.11, 0.7, { type: 'triangle', vol: 0.16 });
}

document.getElementById('sound').addEventListener('click', e => {
  e.stopPropagation();
  musicOn = !musicOn;
  e.target.textContent = 'sound: ' + (musicOn ? 'on' : 'off');
  if (musicOn && state.started) startMusic();
  if (master) master.gain.value = musicOn ? 0.9 : 0;
});

// ---------- Start gate (browsers require a gesture before audio) ----------
const startEl = document.getElementById('start');
function begin() {
  if (state.started) return;
  state.started = true;
  startEl.remove();
  startMusic();
}
startEl.addEventListener('pointerdown', begin);

function reset() {
  state.won = false;
  state.player = { fx: 0.08, fy: 0.5, vx: 0, vy: 0 };
  msg.textContent = 'Reach the blue stone';
}

// ---------- Update ----------
function update(dt) {
  state.time += dt;
  if (!state.started || state.won) return;
  const p = state.player;
  const inp = inputVector();
  const longSide = Math.max(W, H);
  const targetVx = inp.x * state.speed * longSide / W;   // convert to fraction-per-second on each axis
  const targetVy = inp.y * state.speed * longSide / H;
  const k = 1 - Math.exp(-state.accel * dt);              // frame-rate independent easing
  p.vx += (targetVx - p.vx) * k;
  p.vy += (targetVy - p.vy) * k;
  p.fx += p.vx * dt; p.fy += p.vy * dt;
  const hx = (UNIT * 0.5) / W, hy = (UNIT * 0.5) / H;   // keep the square on screen
  p.fx = Math.min(1 - hx, Math.max(hx, p.fx));
  p.fy = Math.min(1 - hy, Math.max(hy, p.fy));

  const dx = (p.fx - state.goal.fx) * W, dy = (p.fy - state.goal.fy) * H;
  if (Math.hypot(dx, dy) < UNIT * 0.6) {
    state.won = true;
    msg.textContent = 'You made it. Press R or tap to play again';
    playVictory();
  }
}
canvas.addEventListener('pointerdown', () => { if (state.won) reset(); });

// ---------- Draw ----------
function draw() {
  ctx.fillStyle = css('--grass');
  ctx.fillRect(0, 0, W, H);

  // goal: soft pulse so it reads as the target
  const g = state.goal, pulse = 1 + 0.06 * Math.sin(state.time * 3);
  const gs = UNIT * pulse;
  ctx.fillStyle = css('--goal');
  ctx.fillRect(g.fx * W - gs / 2, g.fy * H - gs / 2, gs, gs);

  // player: slight squash in the direction of travel
  const p = state.player, sp = Math.hypot(p.vx * W, p.vy * H);
  const stretch = Math.min(0.18, sp / 3000);
  const pw = UNIT * (1 + stretch * Math.abs(p.vx * W) / (sp || 1));
  const ph = UNIT * (1 + stretch * Math.abs(p.vy * H) / (sp || 1));
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(p.fx * W - pw / 2 + 3, p.fy * H - ph / 2 + 4, pw, ph);   // shadow
  ctx.fillStyle = css('--hero');
  ctx.fillRect(p.fx * W - pw / 2, p.fy * H - ph / 2, pw, ph);
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
